name: CI - App Content MCP

# Consolidated MCP server for the content domain (board + note + quiz tools).
on:
  push:
    branches: [main]
    paths:
      - "app-go/app-content-mcp/**"
      - ".github/workflows/ci-app-content-mcp.yml"
  pull_request:
    paths:
      - "app-go/app-content-mcp/**"
      - ".github/workflows/ci-app-content-mcp.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-go/app-content-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app-go/app-content-mcp/go.mod
          cache-dependency-path: app-go/app-content-mcp/go.sum

      - name: Gofmt check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Go vet
        run: go vet ./...

      - name: Go test (race)
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o /tmp/app-content-mcp .
