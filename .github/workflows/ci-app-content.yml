name: CI - App Content

on:
  push:
    branches: [main]
    paths:
      - "app-go/app-content/**"
      - ".github/workflows/ci-app-content.yml"
  pull_request:
    paths:
      - "app-go/app-content/**"
      - ".github/workflows/ci-app-content.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-go/app-content
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app-go/app-content/go.mod
          cache-dependency-path: app-go/app-content/go.sum

      - name: Gofmt check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Go vet
        run: go vet ./...

      - name: Go test (race + coverage gate)
        run: |
          go test -race -count=1 -coverpkg=./... -coverprofile=coverage.out ./tests/
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | tail -1 | sed -E 's/.*[[:space:]]([0-9.]+)%$/\1/')
          echo "total coverage: ${total}%"
          awk -v c="$total" 'BEGIN { if (c+0 < 25) { printf "coverage %.1f%% below 25%% gate\n", c; exit 1 } }'

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o /tmp/app-content ./cmd/app-content
