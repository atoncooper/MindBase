name: CI - Pay (Java)

on:
  push:
    branches: [main]
    paths:
      - "app-pay/**"
      - ".github/workflows/ci-app-pay.yml"
  pull_request:
    paths:
      - "app-pay/**"
      - ".github/workflows/ci-app-pay.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-pay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven test
        # 单元测试为纯 JUnit（无 @SpringBootTest），不依赖运行中的 MySQL
        run: mvn -s maven-settings.xml --batch-mode test
