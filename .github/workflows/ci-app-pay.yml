name: CI - Pay (Java)

on:
  push:
    branches: [main]
    paths:
      - "app-pay/**"
      - ".github/workflows/ci-app-pay.yml"
  pull_request:
    paths:
      - "app-pay/**"
      - ".github/workflows/ci-app-pay.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-pay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven test
        # 单元测试为纯 JUnit（无 @SpringBootTest），不依赖运行中的 MySQL
        run: mvn -s maven-settings.xml --batch-mode test

  security-scan:
    # P2-11 漏洞门禁：Maven 依赖 HIGH/CRITICAL CVE 直接红 —— 漏洞不得静默进入依赖树
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy vulnerability scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: app-pay
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "true"
