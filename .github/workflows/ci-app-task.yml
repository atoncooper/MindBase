name: CI - App Task

on:
  push:
    branches: [main]
    paths:
      - "app-task/**"
      - ".github/workflows/ci-app-task.yml"
  pull_request:
    paths:
      - "app-task/**"
      - ".github/workflows/ci-app-task.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-task
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app-task/go.mod
          cache-dependency-path: app-task/go.sum

      - name: Gofmt check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -count=1 ./...

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o /tmp/app-task .
