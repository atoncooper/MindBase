name: Desktop Release

# 推送 mind-base-desktop-v* 形式的 tag 时自动：拉取 ffmpeg sidecar →
# 前端 + Rust 编译 → 创建 GitHub Release 并上传安装包。
# 应用内更新器按该前缀识别版本（strip 后与 tauri.conf.json 的 version 比较），
# 附件文件名保持 tauri 默认命名（含 x64、以 -setup.exe 结尾）即可被识别。
#
# 签名无感更新（tauri-plugin-updater）：构建时以 Secret
# TAURI_SIGNING_PRIVATE_KEY 签出 Windows 安装包（*_x64-setup.exe / *.msi，
# tauri 2.11 直接签安装包本体）与 macOS 包（*.app.tar.gz）的 .sig；
# Windows job 额外生成并上传 latest.json（windows-x86_64 条目指向 NSIS
# 安装包），macOS job 上传 darwin 包后把 darwin 条目合并进 latest.json。
# 应用经 /releases/latest/download/latest.json 发现签名更新。
#
# 平台矩阵：Windows（NSIS/MSI，Windows job 创建 Release）与 macOS（Apple
# Silicon .dmg，Beta）。macOS job 等待 Release 出现后上传附件，避免与
# Windows job 的创建竞争。

on:
  push:
    tags:
      - "mind-base-desktop-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-14
            platform: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mind-base-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mind-base-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mind-base-desktop/src-tauri

      - name: Provision FFmpeg sidecar (Windows)
        if: matrix.platform == 'windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/fetch-ffmpeg.ps1

      # evermeet.cx 静态构建（GPL，同 gyan.dev 的许可注意项）。下载两个
      # 单二进制 zip 并按 Tauri externalBin 要求以 target triple 命名。
      - name: Provision FFmpeg sidecar (macOS)
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          triple="aarch64-apple-darwin"
          for tool in ffmpeg ffprobe; do
            case "$tool" in
              ffmpeg)  url="https://evermeet.cx/ffmpeg/getrelease/zip" ;;
              ffprobe) url="https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip" ;;
            esac
            curl -fL --retry 3 -o "${tool}.zip" "$url"
            unzip -o -j "${tool}.zip" "${tool}"
            mv "${tool}" "src-tauri/binaries/${tool}-${triple}"
            rm "${tool}.zip"
            chmod +x "src-tauri/binaries/${tool}-${triple}"
          done

      - name: Verify tag matches app version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"                          # mind-base-desktop-v0.1.0
          expected="${tag#mind-base-desktop-v}"
          actual=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$actual" != "$expected" ]; then
            echo "tag 版本($expected) 与 tauri.conf.json 版本($actual) 不一致，请先改版本号再打 tag"
            exit 1
          fi

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app
        env:
          # 签名更新产物（安装包 .sig）必需；缺失时 createUpdaterArtifacts
          # 会直接让构建失败。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Publish GitHub Release (Windows)
        if: matrix.platform == 'windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $files = @(
            (Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe")
            (Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi")
          ) | ForEach-Object { $_.FullName }
          if ($files.Count -eq 0) { Write-Error "未找到构建产物"; exit 1 }
          gh release create $env:GITHUB_REF_NAME @files `
            --title "MindBase Desktop $env:GITHUB_REF_NAME" `
            --generate-notes

          # 签名更新通道清单：windows-x86_64 → NSIS 安装包（tauri 2.11 直接
          # 签安装包本体，更新器按 .sig 校验后以静默模式执行）。
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_x64-setup.exe" | Select-Object -First 1
          if (-not $setup) { Write-Error "未找到 NSIS 安装包（*_x64-setup.exe）"; exit 1 }
          $sig = (Get-Content "$($setup.FullName).sig" -Raw).Trim()
          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME"
          $latest = [ordered]@{
            version  = $version
            notes    = ""
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{ signature = $sig; url = "$base/$($setup.Name)" }
            }
          }
          $json = $latest | ConvertTo-Json -Depth 6
          # WriteAllText 落盘为无 BOM 的 UTF-8（BOM 会破坏 updater 的 JSON 解析）。
          [System.IO.File]::WriteAllText("$PWD/latest.json", $json)
          gh release upload $env:GITHUB_REF_NAME "latest.json" --clobber

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=$(ls src-tauri/target/release/bundle/dmg/*.dmg)
          if [ -z "$files" ]; then echo "未找到构建产物"; exit 1; fi
          # Windows job 负责创建 Release；这里轮询等待它出现（最多 ~40 分钟）。
          for i in $(seq 1 40); do
            if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then break; fi
            echo "waiting for release to be created by the Windows job... ($i/40)"
            sleep 60
          done
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || { echo "Release 仍未创建"; exit 1; }
          gh release upload "$GITHUB_REF_NAME" $files --clobber

          # 签名更新包（darwin）：上传 app.tar.gz + sig，并把 darwin 条目
          # 合并进 Windows job 写入的 latest.json（通用的 universal 包两个
          # 架构共用一个条目）。
          app_tar=$(ls src-tauri/target/release/bundle/macos/*.app.tar.gz 2>/dev/null | head -n1)
          if [ -n "$app_tar" ] && [ -f "${app_tar}.sig" ]; then
            gh release upload "$GITHUB_REF_NAME" "$app_tar" "${app_tar}.sig" --clobber
            gh release download "$GITHUB_REF_NAME" -p "latest.json" -O latest.json
            base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
            sig=$(cat "${app_tar}.sig")
            tmp=$(mktemp)
            jq --arg url "$base/$(basename "$app_tar")" --arg sig "$sig" \
              '.platforms["darwin-aarch64"] = {signature: $sig, url: $url}
               | .platforms["darwin-x86_64"] = {signature: $sig, url: $url}' \
              latest.json > "$tmp"
            mv "$tmp" latest.json
            gh release upload "$GITHUB_REF_NAME" latest.json --clobber
          else
            echo "未找到 macOS 更新包（*.app.tar.gz），latest.json 保持 windows-only"
          fi
