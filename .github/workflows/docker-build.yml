name: Docker Build & Push

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          # Image names are hardcoded on Docker Hub (the standard registry).
          # The namespace must match the DOCKERHUB_USERNAME repo secret.
          # Requires repo secrets: DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
          # (Docker Hub → Account Settings → Personal access tokens, Read & Write).
          - context: .
            dockerfile: Dockerfile
            image: atoncooper/mind-base-backend
            name: backend
          - context: ./frontendv2
            dockerfile: frontendv2/Dockerfile
            image: atoncooper/mind-base-frontend
            name: frontend
          - context: ./app-go/app-auth
            dockerfile: app-go/app-auth/Dockerfile
            image: atoncooper/mind-base-app-auth
            name: app-auth
          - context: ./app-go/app-cloud
            dockerfile: app-go/app-cloud/Dockerfile
            image: atoncooper/mind-base-app-cloud
            name: app-cloud
          - context: ./app-board
            dockerfile: app-board/Dockerfile
            image: atoncooper/mind-base-app-board
            name: app-board
          - context: ./app-pay-admin
            dockerfile: app-pay-admin/Dockerfile
            image: atoncooper/mind-base-app-pay-admin
            name: app-pay-admin
          - context: ./app-pay
            dockerfile: app-pay/Dockerfile
            image: atoncooper/mind-base-app-pay
            name: app-pay
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
