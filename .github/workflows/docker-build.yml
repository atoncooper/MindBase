name: Docker Build & Push

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          # Image names are hardcoded on Docker Hub (the standard registry).
          # The namespace must match the DOCKERHUB_USERNAME repo secret.
          # Requires repo secrets: DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
          # (Docker Hub → Account Settings → Personal access tokens, Read & Write).
          - context: ./frontendv2
            dockerfile: frontendv2/Dockerfile
            image: atoncooper/mind-base-frontend
            name: frontend
          - context: ./app-go/app-user
            dockerfile: app-go/app-user/Dockerfile
            image: atoncooper/mind-base-app-user
            name: app-user
          - context: ./app-go/app-cloud
            dockerfile: app-go/app-cloud/Dockerfile
            image: atoncooper/mind-base-app-cloud
            name: app-cloud
          - context: ./app-go/app-content
            dockerfile: app-go/app-content/Dockerfile
            image: atoncooper/mind-base-app-content
            name: app-content
          - context: ./app-go/app-kg
            dockerfile: app-go/app-kg/Dockerfile
            image: atoncooper/mind-base-app-kg
            name: app-kg
          - context: .
            dockerfile: app-ts/Dockerfile
            image: atoncooper/mind-base-app-ts
            name: app-ts
          - context: ./app-go/app-content-mcp
            dockerfile: app-go/app-content-mcp/Dockerfile
            image: atoncooper/mind-base-app-content-mcp
            name: app-content-mcp
          - context: ./scripts
            dockerfile: scripts/certgen.Dockerfile
            image: atoncooper/mind-base-certgen
            name: certgen
          - context: ./scripts
            dockerfile: scripts/minio.Dockerfile
            image: atoncooper/mind-base-minio
            name: minio
          - context: ./app-go/app-admin
            dockerfile: app-go/app-admin/Dockerfile
            image: atoncooper/mind-base-app-admin
            name: app-admin-api
          - context: .
            dockerfile: frontend-admin/Dockerfile
            image: atoncooper/mind-base-app-admin-ui
            name: app-admin-ui
          - context: ./app-pay
            dockerfile: app-pay/Dockerfile
            image: atoncooper/mind-base-app-pay
            name: app-pay
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
