# DOCX 视觉回归（npm run eval:office，LibreOffice 基线）
#
# golden 必须与 CI 使用完全相同的渲染引擎（Debian bookworm + LibreOffice 7.4 +
# poppler + Noto CJK），否则 Word/LibreOffice、不同发行版之间会产生无意义 diff。
# 镜像直接在 workflow 里构建（不依赖仓库里的 Dockerfile）。
#
# 失败语义：0=一致，1=差异/golden 缺失，2=环境不可用（不伪造通过）
name: Office Visual Regression

on:
  push:
    branches: [main]
    paths:
      - "app-ts/src/services/office/**"
      - "app-ts/src/services/office-render/**"
      - "app-ts/scripts/office-visual-regression.ts"
      - "app-ts/scripts/office-samples.ts"
      - "app-ts/test/golden/**"
      - "app-ts/test/fixtures/**"
      - ".github/workflows/office-eval.yml"
  pull_request:
    paths:
      - "app-ts/src/services/office/**"
      - "app-ts/src/services/office-render/**"
      - "app-ts/scripts/office-visual-regression.ts"
      - "app-ts/scripts/office-samples.ts"
      - "app-ts/test/golden/**"
      - "app-ts/test/fixtures/**"
      - ".github/workflows/office-eval.yml"

permissions:
  contents: read

concurrency:
  group: office-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  office-eval:
    name: office visual regression (LibreOffice goldens)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build office-eval image (Debian + LibreOffice + poppler + CJK)
        run: |
          printf '%s\n' \
            'FROM node:22-bookworm-slim' \
            'ENV DEBIAN_FRONTEND=noninteractive' \
            'RUN apt-get update && apt-get install -y --no-install-recommends libreoffice-writer-nogui libreoffice-impress-nogui libreoffice-calc-nogui poppler-utils fonts-noto-cjk fonts-liberation && rm -rf /var/lib/apt/lists/*' \
            | docker build -t office-eval -f - .

      - name: Generate fixtures and compare against LibreOffice goldens
        id: eval
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -v office-eval-node:/repo/app-ts/node_modules \
            -w /repo/app-ts office-eval sh -c 'npm ci && npm run samples:office && node node_modules/tsx/dist/cli.mjs scripts/office-visual-regression.ts --dir qa-output --golden test/golden/office/lo' 2>&1 | tee app-ts/office-eval-report.txt

      - name: Explain eval failure
        if: always() && steps.eval.outcome == 'failure'
        shell: bash
        run: |
          if grep -q "无法进行视觉回归" app-ts/office-eval-report.txt 2>/dev/null; then
            echo "::error::渲染环境不可用（LibreOffice/poppler），视觉回归没有真正执行。检查 workflow 内联镜像与 soffice/pdftotext PATH。"
          elif ! ls app-ts/test/golden/office/lo/*.json >/dev/null 2>&1; then
            echo "::error::缺少 LibreOffice golden 基线（app-ts/test/golden/office/lo/*.json）。用同一镜像执行 --update 生成并提交。"
          else
            echo "::error::视觉回归与 golden 不一致，见 artifact office-eval-report。确认版式变更有意后，用同一镜像执行 --update 更新 test/golden/office/lo 并提交。"
          fi
          exit 1

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-eval-report
          path: |
            app-ts/office-eval-report.txt
            app-ts/qa-output/*.docx
          if-no-files-found: warn
          retention-days: 7
