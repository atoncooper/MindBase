# MindBase API — OpenAPI 3.1 根文件（按域拆分）
# paths 引用 ./paths/<域>.yaml；公共组件在 ./components/common.yaml。
# 注意：请通过 HTTP 提供 api/ 目录（Swagger UI / Redocly），file:// 无法解析相对 $ref。
openapi: 3.1.0
info:
  title: MindBase API
  version: 2.0.0
  description: 'MindBase 知识库/云盘/学术 Agent 平台当前 API。入口为 OpenResty edge -> APISIX -> 业务服务。用户面使用 Authorization: Bearer <session token>；公开面包括登录注册、分享页、支付回调与健康检查；内部 M2M 使用 apikey。统一错误体 {"detail": "..."}，响应头含 X-Request-Id。详见 api/README.md。'
servers:
- url: /mindbase/api/v1
  description: edge 同源入口
- url: https://{host}/mindbase/api/v1
  description: 公网部署
  variables:
    host:
      default: mindbase.example.com
tags:
- name: auth
  description: 登录/注册/凭证/设备/验证码（app-user）
- name: chat
  description: SSE 对话、会话/历史/计划/画板/沙箱执行（app-ts）
- name: tasks
  description: 任务视图/报名/答题（app-task、app-ts）
- name: content-ops
  description: 收藏夹、ASR、构建编排（app-user bili 域）
- name: vector
  description: 向量化/KG/检索/清理（app-ts）
- name: blindspot
  description: 盲区实体/图/练习（app-ts）
- name: skills
  description: 技能商店/安装/预览（app-ts）
- name: academic
  description: 科研项目/文献/实验/审批/导出（app-ts）
- name: quiz
  description: 出题/批改/历史/错题/导出/公开分享（app-content + app-ts）
- name: notes
  description: 笔记 CRUD/锚点/修订/分享（app-content）
- name: cloud
  description: 文件/文件夹/上传/HLS/预览/回收站/分享（app-cloud）
- name: workspaces
  description: 工作区/绑定/文件（app-cloud）
- name: board
  description: 板子 CRUD/置顶（app-content）
- name: pay
  description: SKU/订单/会员/二维码/回调（app-pay）
- name: settings
  description: 偏好/头像/Coding Plan（app-user）
- name: system
  description: 健康检查
- name: internal
  description: 服务间 key-auth 接口，仅服务网内调用
security:
- bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      $ref: ./components/common.yaml#/securitySchemes/bearerAuth
    apiKeyAuth:
      $ref: ./components/common.yaml#/securitySchemes/apiKeyAuth
  schemas:
    Error:
      $ref: ./components/common.yaml#/schemas/Error
    JsonObject:
      $ref: ./components/common.yaml#/schemas/JsonObject
  responses:
    BadRequest:
      $ref: ./components/common.yaml#/responses/BadRequest
    Unauthorized:
      $ref: ./components/common.yaml#/responses/Unauthorized
    NotFound:
      $ref: ./components/common.yaml#/responses/NotFound
    Conflict:
      $ref: ./components/common.yaml#/responses/Conflict
    TooManyRequests:
      $ref: ./components/common.yaml#/responses/TooManyRequests
