        '409':
          $ref: ../components/common.yaml#responses/Conflict
        '429':
          $ref: ../components/common.yaml#responses/TooManyRequests
      parameters:
      - name: note_uuid
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
