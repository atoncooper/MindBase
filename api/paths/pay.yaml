# API: pay — SKU/订单/会员/二维码/回调（app-pay）
# 仅由 api/openapi.yaml 引用；$ref 指向 ../components/common.yaml。
paths:
  /pay/callback/alipay:
    post:
      tags:
      - pay
      summary: 创建/执行支付宝
      description: 上游服务：app-pay
      operationId: post_pay_callback_alipay
      responses:
        '200':
          description: 成功
        '400':
          $ref: ../components/common.yaml#responses/BadRequest
        '401':
          $ref: ../components/common.yaml#responses/Unauthorized
        '404':
          $ref: ../components/common.yaml#responses/NotFound
        '409':
          $ref: ../components/common.yaml#responses/Conflict
        '429':
          $ref: ../components/common.yaml#responses/TooManyRequests
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#schemas/JsonObject
  /pay/channels:
    get:
      tags:
      - pay
      summary: 获取渠道
      description: 上游服务：app-pay
      operationId: get_pay_channels
      responses:
        '200':
          description: 成功
        '400':
          $ref: ../components/common.yaml#responses/BadRequest
        '401':
          $ref: ../components/common.yaml#responses/Unauthorized
        '404':
          $ref: ../components/common.yaml#responses/NotFound
        '409':
          $ref: ../components/common.yaml#responses/Conflict
        '429':
          $ref: ../components/common.yaml#responses/TooManyRequests
      security:
      - bearerAuth: []
  /pay/comparison:
    get:
      tags:
      - pay
      summary: 获取对比
      description: 上游服务：app-pay
      operationId: get_pay_comparison
      responses:
        '200':
