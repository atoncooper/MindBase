# API: settings — 偏好/头像/Coding Plan（app-user）
# 仅由 api/openapi.yaml 引用；$ref 指向 ../components/common.yaml。
paths:
  /avatar/file/{object_key}:
    get:
      tags:
      - settings
      summary: 获取文件
      description: 上游服务：app-user
      operationId: get_avatar_file_object_key
      responses:
        '200':
          description: 成功
        '400':
          $ref: ../components/common.yaml#responses/BadRequest
        '401':
          $ref: ../components/common.yaml#responses/Unauthorized
        '404':
          $ref: ../components/common.yaml#responses/NotFound
        '409':
          $ref: ../components/common.yaml#responses/Conflict
        '429':
          $ref: ../components/common.yaml#responses/TooManyRequests
      parameters:
      - name: object_key
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
  /avatar/upload:
    post:
      tags:
      - settings
      summary: 创建/执行上传
      description: 上游服务：app-user
      operationId: post_avatar_upload
      responses:
        '200':
          description: 成功
        '400':
          $ref: ../components/common.yaml#responses/BadRequest
        '401':
          $ref: ../components/common.yaml#responses/Unauthorized
        '404':
          $ref: ../components/common.yaml#responses/NotFound
        '409':
          $ref: ../components/common.yaml#responses/Conflict
        '429':
          $ref: ../components/common.yaml#responses/TooManyRequests
      security:
      - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#schemas/JsonObject
  /preferences:
    get:
      tags:
      - settings
      summary: 获取偏好
      description: 上游服务：app-user
      operationId: get_preferences
      responses:
        '200':
          description: 成功
        '400':
          $ref: ../components/common.yaml#responses/BadRequest
        '401':
          $ref: ../components/common.yaml#responses/Unauthorized
        '404':
          $ref: ../components/common.yaml#responses/NotFound
        '409':
          $ref: ../components/common.yaml#responses/Conflict
        '429':
          $ref: ../components/common.yaml#responses/TooManyRequests
      security:
      - bearerAuth: []
    patch:
      tags:
      - settings
      summary: 更新偏好
      description: 上游服务：app-user
      operationId: patch_preferences
      responses:
        '200':
          description: 成功
        '400':
          $ref: ../components/common.yaml#responses/BadRequest
        '401':
          $ref: ../components/common.yaml#responses/Unauthorized
        '404':
          $ref: ../components/common.yaml#responses/NotFound
        '409':
          $ref: ../components/common.yaml#responses/Conflict
        '429':
          $ref: ../components/common.yaml#responses/TooManyRequests
      security:
      - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#schemas/JsonObject
