# API: skills — 技能商店/安装/预览（app-ts）
# 仅由 api/openapi.yaml 引用；$ref 指向 ../components/common.yaml。
paths:
  /skills/install:
    post:
      tags:
      - skills
      summary: 创建/执行安装
      description: 上游服务：app-ts
      operationId: post_skills_install
      responses:
        '200':
          description: 成功
        '400':
          $ref: ../components/common.yaml#responses/BadRequest
        '401':
          $ref: ../components/common.yaml#responses/Unauthorized
        '404':
          $ref: ../components/common.yaml#responses/NotFound
        '409':
          $ref: ../components/common.yaml#responses/Conflict
        '429':
          $ref: ../components/common.yaml#responses/TooManyRequests
      security:
      - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#schemas/JsonObject
  /skills/installed:
    get:
      tags:
      - skills
      summary: 获取已安装
      description: 上游服务：app-ts
      operationId: get_skills_installed
      responses:
        '200':
          description: 成功
        '400':
          $ref: ../components/common.yaml#responses/BadRequest
        '401':
          $ref: ../components/common.yaml#responses/Unauthorized
        '404':
          $ref: ../components/common.yaml#responses/NotFound
        '409':
          $ref: ../components/common.yaml#responses/Conflict
        '429':
          $ref: ../components/common.yaml#responses/TooManyRequests
      security:
      - bearerAuth: []
  /skills/store/contents:
    get:
      tags:
      - skills
      summary: 获取内容
      description: 上游服务：app-ts
      operationId: get_skills_store_contents
      responses:
        '200':
          description: 成功
        '400':
          $ref: ../components/common.yaml#responses/BadRequest
        '401':
          $ref: ../components/common.yaml#responses/Unauthorized
        '404':
          $ref: ../components/common.yaml#responses/NotFound
        '409':
          $ref: ../components/common.yaml#responses/Conflict
        '429':
          $ref: ../components/common.yaml#responses/TooManyRequests
      security:
      - bearerAuth: []
  /skills/store/install:
    post:
      tags:
      - skills
      summary: 创建/执行安装
      description: 上游服务：app-ts
      operationId: post_skills_store_install
      responses:
        '200':
          description: 成功
        '400':
          $ref: ../components/common.yaml#responses/BadRequest
        '401':
          $ref: ../components/common.yaml#responses/Unauthorized
        '404':
          $ref: ../components/common.yaml#responses/NotFound
        '409':
          $ref: ../components/common.yaml#responses/Conflict
        '429':
          $ref: ../components/common.yaml#responses/TooManyRequests
      security:
      - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#schemas/JsonObject
  /skills/store/list:
    get:
      tags:
      - skills
      summary: 获取列表
      description: 上游服务：app-ts
      operationId: get_skills_store_list
      responses:
        '200':
          description: 成功
        '400':
          $ref: ../components/common.yaml#responses/BadRequest
        '401':
          $ref: ../components/common.yaml#responses/Unauthorized
        '404':
          $ref: ../components/common.yaml#responses/NotFound
        '409':
          $ref: ../components/common.yaml#responses/Conflict
        '429':
          $ref: ../components/common.yaml#responses/TooManyRequests
      security:
      - bearerAuth: []
  /skills/{skill_id}:
    delete:
      tags:
      - skills
      summary: 删除技能
      description: 上游服务：app-ts
      operationId: delete_skills_skill_id
      responses:
        '200':
          description: 成功
        '400':
          $ref: ../components/common.yaml#responses/BadRequest
        '401':
          $ref: ../components/common.yaml#responses/Unauthorized
        '404':
          $ref: ../components/common.yaml#responses/NotFound
        '409':
          $ref: ../components/common.yaml#responses/Conflict
        '429':
          $ref: ../components/common.yaml#responses/TooManyRequests
      parameters:
      - name: skill_id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
  /skills/{skill_id}/preview:
    get:
      tags:
      - skills
      summary: 获取预览
      description: 上游服务：app-ts
      operationId: get_skills_skill_id_preview
      responses:
        '200':
          description: 成功
        '400':
          $ref: ../components/common.yaml#responses/BadRequest
        '401':
          $ref: ../components/common.yaml#responses/Unauthorized
        '404':
          $ref: ../components/common.yaml#responses/NotFound
        '409':
          $ref: ../components/common.yaml#responses/Conflict
        '429':
          $ref: ../components/common.yaml#responses/TooManyRequests
      parameters:
      - name: skill_id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
