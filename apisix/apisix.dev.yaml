# APISIX standalone routes - LOCAL DEV variant (normalized)
# ============================================================
# Use this when APISIX runs in a VM (e.g. 192.168.138.128) but main app +
# app-task run on the host (reachable from the VM at 192.168.138.1 via VMnet8).
#
# For docker deployment, use apisix.yaml instead (upstream = docker service
# names app-ts:8000 / app-task:8001, all on the same mind-base-net).
#
# Mount in your local APISIX (standalone mode reads this file, NOT etcd):
#   - ./apisix/apisix.dev.yaml:/usr/local/apisix/conf/apisix.yaml:ro
#
# ⚠️ Standalone mode: dashboard / Admin API writes do NOT persist. Edit THIS
#    file and restart APISIX. Do NOT configure via the dashboard UI - changes
#    are lost on restart (no etcd).
#
# NOTE: standalone yaml does NOT interpolate ${ENV}. This dev file hardcodes
# 192.168.138.1 - adjust if your host IP differs. The consumer key below is a
# placeholder; replace with a real secret and keep it in sync with
# APISIX_CONSUMER_KEY in .env (backend) and APPTASK__APP__CONSUMER_KEY (app-task).
#
# Upstream normalization:
#   - retries: 2 for normal APIs; 0 for SSE (replaying a half stream corrupts it)
#   - timeout: connect/send 5s; read 30s normal / 300s SSE
#   - keepalive_pool: reuse backend connections (size/idle_timeout/requests)
#   - checks: active probes GET /health every 5s; passive observes real traffic.
#     Both backends expose /health (FastAPI /health, app-task /health). Even a
#     single node benefits: a failing node is marked unhealthy so APISIX returns
#     503 fast instead of hanging on a dead backend.
#
# Route matching: higher priority wins; ties broken by path length (longer first).
#   - /tasks/register (100) beats /tasks/* (10) so backend->app-task uses key-auth,
#     not the user-facing forward-auth path.
#   - catch_all (1) is the fallback for /auth /chat /favorites ... -> backend.

# ============================================================
# Upstreams
# ============================================================
upstreams:

  # app-task Go executor - /tasks/* user endpoints + /tasks/register
  # app-cloud (Go) - cloud drive authority (nginx /cloud/ is the main path;
  # this upstream serves the /workspaces/* routes)
  - id: upstream-app-cloud
    name: app-cloud
    type: roundrobin
    scheme: http
    pass_host: pass
    nodes:
      "192.168.138.1:8007": 1
    retries: 2
    timeout:
      connect: 5
      send: 5
      read: 30
    checks:
      active:
        type: http
        http_path: /health
        timeout: 1
        interval: 5
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200]
        unhealthy:
          interval: 5
          http_failures: 3
          http_statuses: [404, 500, 502, 503, 504]

  - id: upstream-app-task
    name: app-task
    type: roundrobin
    scheme: http
    pass_host: pass
    retries: 2
    timeout:
      connect: 5
      send: 5
      read: 30
    keepalive_pool:
      size: 10
      idle_timeout: 60
      requests: 100
    nodes:
      "192.168.138.1:8001": 1
    checks:
      active:
        type: http
        http_path: /health
        timeout: 1
        interval: 5
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200]
        unhealthy:
          interval: 5
          http_failures: 3
          http_statuses: [404, 500, 502, 503, 504]
      passive:
        type: http
        healthy:
          http_statuses: [200]
          successes: 2
        unhealthy:
          http_statuses: [500, 502, 503, 504]
          http_failures: 3

  # app-pay Spring Boot payment/membership service (host, loopback-published 8002)
  # 服务端 HTTPS-only（自签名开发证书，app-pay/scripts/gen-dev-cert.* 生成，
  # 证书 SAN 已含宿主 IP 192.168.138.1）。tls.verify=false = 只加密不校验身份。
  - id: upstream-app-pay
    name: app-pay
    type: roundrobin
    scheme: https
    tls:
      verify: false
    pass_host: pass
    retries: 2
    timeout:
      connect: 5
      send: 5
      read: 30
    keepalive_pool:
      size: 10
      idle_timeout: 60
      requests: 100
    nodes:
      "192.168.138.1:8002": 1
    checks:
      active:
        type: https
        https_verify_certificate: false
        http_path: /health
        timeout: 1
        interval: 5
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200]
        unhealthy:
          interval: 5
          http_failures: 3
          http_statuses: [404, 500, 502, 503, 504]
      passive:
        type: http
        healthy:
          http_statuses: [200]
          successes: 2
        unhealthy:
          http_statuses: [500, 502, 503, 504]
          http_failures: 3

  # app-note —— 笔记服务（Go；本机 go run ./app-go/app-note）
  - id: upstream-app-note
    name: app-note
    type: roundrobin
    scheme: http
    pass_host: pass
    retries: 2
    timeout:
      connect: 5
      send: 5
      read: 30
    keepalive_pool:
      size: 10
      idle_timeout: 60
      requests: 100
    nodes:
      "192.168.138.1:8008": 1
    checks:
      active:
        type: http
        http_path: /health
        timeout: 1
        interval: 5
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200]
        unhealthy:
          interval: 5
          http_failures: 3
          http_statuses: [404, 500, 502, 503, 504]
      passive:
        type: http
        healthy:
          http_statuses: [200]
          successes: 2
        unhealthy:
          http_statuses: [500, 502, 503, 504]
          http_failures: 3

  # app-quiz —— 测验存储服务（Go；本机 go run ./app-go/app-quiz）
  - id: upstream-app-quiz
    name: app-quiz
    type: roundrobin
    scheme: http
    pass_host: pass
    retries: 2
    timeout:
      connect: 5
      send: 5
      read: 30
    keepalive_pool:
      size: 10
      idle_timeout: 60
      requests: 100
    nodes:
      "192.168.138.1:8011": 1
    checks:
      active:
        type: http
        http_path: /health
        timeout: 1
        interval: 5
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200]
        unhealthy:
          interval: 5
          http_failures: 3
          http_statuses: [404, 500, 502, 503, 504]
      passive:
        type: http
        healthy:
          http_statuses: [200]
          successes: 2
        unhealthy:
          http_statuses: [500, 502, 503, 504]
          http_failures: 3

  # app-ts —— agent + RAG 服务（Node/Fastify；本机 go/tsx 直跑）
  - id: upstream-app-ts
    name: app-ts
    type: roundrobin
    scheme: http
    pass_host: pass
    retries: 2
    timeout:
      connect: 5
      send: 5
      read: 300
    keepalive_pool:
      size: 10
      idle_timeout: 60
      requests: 100
    nodes:
      "192.168.138.1:8000": 1
    checks:
      active:
        type: http
        http_path: /health
        timeout: 1
        interval: 5
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200]
        unhealthy:
          interval: 5
          http_failures: 3
          http_statuses: [404, 500, 502, 503, 504]

  # app-auth —— 身份认证服务（Go；本机 go run ./app-go/app-auth）。
  # forward-auth verify 权威 + /auth/* 用户端点归属地（宽验证：无凭证放行，
  # 受保护服务对缺 X-Uid 自行 401）。
  - id: upstream-app-auth
    name: app-auth
    type: roundrobin
    scheme: http
    pass_host: pass
    retries: 2
    timeout:
      connect: 5
      send: 5
      read: 30
    keepalive_pool:
      size: 10
      idle_timeout: 60
      requests: 100
    nodes:
      "192.168.138.1:8006": 1
    checks:
      active:
        type: http
        http_path: /health
        timeout: 1
        interval: 5
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200]
        unhealthy:
          interval: 5
          http_failures: 3
          http_statuses: [404, 500, 502, 503, 504]

  # app-settings —— 设置服务（Go；本机 go run ./app-go/app-settings）
  - id: upstream-app-settings
    name: app-settings
    type: roundrobin
    scheme: http
    pass_host: pass
    retries: 2
    timeout:
      connect: 5
      send: 5
      read: 30
    keepalive_pool:
      size: 10
      idle_timeout: 60
      requests: 100
    nodes:
      "192.168.138.1:8015": 1
    checks:
      active:
        type: http
        http_path: /health
        timeout: 1
        interval: 5
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200]
        unhealthy:
          interval: 5
          http_failures: 3
          http_statuses: [404, 500, 502, 503, 504]

  # app-bili —— B 站数据获取服务（Go；本机 go run ./app-go/app-bili）
  - id: upstream-app-bili
    name: app-bili
    type: roundrobin
    scheme: http
    pass_host: pass
    retries: 2
    timeout:
      connect: 5
      send: 5
      read: 30
    keepalive_pool:
      size: 10
      idle_timeout: 60
      requests: 100
    nodes:
      "192.168.138.1:8010": 1
    checks:
      active:
        type: http
        http_path: /health
        timeout: 1
        interval: 5
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200]
        unhealthy:
          interval: 5
          http_failures: 3
          http_statuses: [404, 500, 502, 503, 504]
      passive:
        type: http
        healthy:
          http_statuses: [200]
          successes: 2
        unhealthy:
          http_statuses: [500, 502, 503, 504]
          http_failures: 3

# ============================================================
# Routes
# ============================================================
routes:
  # User <-> main app task-quiz agent chat (SSE; forward-auth verifies bili_session)
  - id: task_quiz_chat
    uri: /task-quiz/chat
    methods: [POST]
    priority: 50
    upstream_id: upstream-app-ts
    plugins:
      forward-auth:
        uri: "http://192.168.138.1:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid]
        timeout: 5000
        status_code: 401

  # User -> main app task-quiz register form (forward-auth verifies bili_session)
  - id: task_quiz_register
    uri: /task-quiz/register
    methods: [POST]
    priority: 50
    upstream_id: upstream-app-ts
    plugins:
      forward-auth:
        uri: "http://192.168.138.1:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid]
        timeout: 5000
        status_code: 401

  # app-task -> main app generate quiz (async, service-to-service, key-auth).
  # priority 110 > quiz_internal (/internal/quiz/* → app-quiz, 100) so the more
  # specific generate-llm URI is not shadowed by the app-quiz wildcard.
  - id: internal_quiz_generate
    uri: /internal/quiz/generate-llm
    methods: [POST]
    priority: 110
    upstream_id: upstream-app-ts
    plugins:
      key-auth: {}

  # app-task -> main app poll quiz generation status (async A+B).
  # priority 110 > quiz_internal (100) — same shadow guard as generate-llm.
  - id: internal_quiz_status
    uri: /internal/quiz/status/*
    methods: [GET]
    priority: 110
    upstream_id: upstream-app-ts
    plugins:
      key-auth: {}

  # Lua scripts: upload/list/logs (service-to-service, key-auth). Script
  # uploads change executable code, so this MUST stay key-protected.
  - id: scripts_upload
    uri: /scripts*
    methods: [POST, GET]
    priority: 60
    upstream_id: upstream-app-task
    plugins:
      key-auth: {}

  # main app -> app-task async callback + mail delivery (service-to-service,
  # key-auth): executors report task completion and request email delivery.
  - id: internal_task_complete
    uri: /internal/task/*/complete
    methods: [POST]
    priority: 50
    upstream_id: upstream-app-task
    plugins:
      key-auth: {}

  - id: internal_email_send
    uri: /internal/email/send
    methods: [POST]
    priority: 50
    upstream_id: upstream-app-task
    plugins:
      key-auth: {}

  # User -> app-quiz scheduled-quiz business detail (forward-auth, X-Uid injected).
  # 业务行 quiz_task/quiz_task_answer + Mongo task_quiz_questions 归 app-quiz；
  # app-task 只提供调度视图（/tasks、/tasks/{id}）。
  - id: tasks_detail
    uri: /tasks/*/detail
    methods: [GET]
    priority: 100
    upstream_id: upstream-app-quiz
    plugins:
      forward-auth:
        uri: "http://192.168.138.1:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid]
        timeout: 5000
        status_code: 401

  - id: tasks_register
    uri: /tasks/register
    methods: [POST]
    priority: 100
    upstream_id: upstream-app-task
    plugins:
      key-auth: {}

  # User -> app-task task list (forward-auth, X-Uid injected)
  - id: tasks_list
    uri: /tasks
    methods: [GET]
    priority: 90
    upstream_id: upstream-app-task
    plugins:
      proxy-rewrite:
        headers:
          remove: [X-Uid]
          set:
            X-API-Key: "D4ldTC-nOpCp0YEokVKrEMN2mvjc_LDsOjaBY2oRPbooWLre"
      forward-auth:
        uri: "http://192.168.138.1:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid]
        timeout: 5000
        status_code: 401

  # User -> app-task task detail / delete (forward-auth, X-Uid injected)
  - id: tasks_wildcard
    uri: /tasks/*
    methods: [GET, POST, DELETE]
    priority: 10
    upstream_id: upstream-app-task
    plugins:
      proxy-rewrite:
        headers:
          remove: [X-Uid]
          set:
            X-API-Key: "D4ldTC-nOpCp0YEokVKrEMN2mvjc_LDsOjaBY2oRPbooWLre"
      forward-auth:
        uri: "http://192.168.138.1:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid]
        timeout: 5000
        status_code: 401

  # User -> app-quiz submit answer (forward-auth, X-Uid injected).
  # 判题/入库/状态流转是 quiz 域业务逻辑，归 app-quiz（app-task 只做调度+通知）。
  # priority 100 so /tasks/{id}/answer is NOT shadowed by /tasks/* (app-task).
  - id: tasks_answer
    uri: /tasks/*/answer
    methods: [POST]
    priority: 100
    upstream_id: upstream-app-quiz
    plugins:
      forward-auth:
        uri: "http://192.168.138.1:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid]
        timeout: 5000
        status_code: 401

  # User -> app-pay products/orders/membership (forward-auth, X-Uid injected).
  # /pay/callback/* is served by pay_callback below (priority 60, no forward-auth).
  - id: pay_user
    uri: /pay/*
    methods: [GET, POST]
    priority: 50
    upstream_id: upstream-app-pay
    plugins:
      forward-auth:
        uri: "http://192.168.138.1:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid]
        timeout: 5000
        status_code: 401

  # 支付渠道异步回调（M2）：免登录态，伪造请求由渠道验签拒绝；掉单兜底以 ChannelQueryJob 为主。
  # limit-req：伪造请求也要烧一次 RSA2 验签 CPU（重操作），per-IP 限流防验签 DoS
  - id: pay_callback
    uri: /pay/callback/*
    methods: [POST]
    priority: 60
    upstream_id: upstream-app-pay
    plugins:
      limit-req:
        rate: 10
        burst: 20
        rejected_code: 429
        key_type: var
        key: remote_addr

  # main app / ops -> app-pay internal。P1 密钥分权（最小权限）：
  #   - membership 读（app-cloud / app-ts 会员查询）: 共享 internal 或 pay-readonly
  #   - grant / orders 下的退款操作（资金写）: 仅 pay-ops 专用密钥 —— 持有共享 key 的其他服务
  #     无法开通会员/退款；pay-ops 密钥只保存在 .env（PAY_OPS_KEY），不下发到任何业务容器。
  # 注意：APISIX 仅支持尾缀通配，/orders/{orderNo}/refund 用 /orders/* 前缀路由覆盖；
  # priority 100 先于 pay_internal(50) 命中，timeout/execute 仍走 pay_internal（共享 key）。
  - id: pay_internal_membership
    uri: /internal/pay/membership/*
    methods: [GET]
    priority: 100
    upstream_id: upstream-app-pay
    plugins:
      key-auth: {}
      consumer-restriction:
        type: consumer_name
        whitelist:
          - internal
          - pay-readonly

  - id: pay_internal_grant
    uri: /internal/pay/grant
    methods: [POST]
    priority: 100
    upstream_id: upstream-app-pay
    plugins:
      key-auth: {}
      consumer-restriction:
        type: consumer_name
        whitelist:
          - pay-ops

  - id: pay_internal_orders
    uri: /internal/pay/orders/*
    methods: [POST]
    priority: 100
    upstream_id: upstream-app-pay
    plugins:
      key-auth: {}
      consumer-restriction:
        type: consumer_name
        whitelist:
          - pay-ops

  - id: pay_internal_refund_requests
    uri: /internal/pay/refund-requests
    methods: [GET]
    priority: 100
    upstream_id: upstream-app-pay
    plugins:
      key-auth: {}
      consumer-restriction:
        type: consumer_name
        whitelist:
          - pay-ops

  # 兜底：/internal/pay/* 其余路径（timeout/execute 等）仍走共享 key-auth
  - id: pay_internal
    uri: /internal/pay/*
    methods: [GET, POST]
    priority: 50
    upstream_id: upstream-app-pay
    plugins:
      key-auth: {}


  # 用户端认证端点 (/auth, /auth/*) -> app-auth（全栈认证权威；app-auth 自校验
  # Bearer token，无需 forward-auth；仍剥离伪造身份头）。
  - id: auth_user
    uris: [/auth, /auth/*]
    priority: 50
    upstream_id: upstream-app-auth
    plugins:
      request-id: {}
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
      limit-req:
        rate: 10
        burst: 20
        rejected_code: 429
        key_type: var
        key: remote_addr

  # /chat 的聊天域切流（显式枚举，priority 60 压过 chat_sse 的 /chat/*）：
  # ask/stream（SSE）+ sessions/history REST + board AI 补全 → app-ts。
  # /chat/messages、/chat/search 等不在此列，仍落 chat_sse/catch_all → Python
  # （AI 域）。回滚：删除本路由对应 uri 即回落 Python。
  - id: chat_ts
    uris: [/chat/ask/agent/stream, /chat/ask/stream, /chat/sessions, /chat/sessions/*, /chat/history, /chat/history/*, /chat/board/complete, /quota/summary]
    priority: 60
    upstream_id: upstream-app-ts
    plugins:
      request-id: {}
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
      forward-auth:
        uri: "http://192.168.138.1:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid, X-Roles]
        timeout: 5000
        status_code: 401

  # /knowledge/kg/* -> app-ts（KG AI 编排：抽取/实体链接/子图；存储在 app-go/app-kg
  # 经 gRPC。契约镜像 Python，前端 kgApi 零改动。切流自主 backend catch_all。
  # 回滚 = 删除本路由即回落 catch_all -> Python。）
  - id: kg_ts
    uris: [/knowledge/kg, /knowledge/kg/*]
    priority: 50
    upstream_id: upstream-app-ts
    plugins:
      request-id: {}
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
      forward-auth:
        uri: "http://192.168.138.1:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid, X-Roles]
        timeout: 5000
        status_code: 401


  # /quiz/* -> app-quiz（Go 测验存储服务；宽验证 forward-auth，公开分享页
  # /quiz/shared/{token} 免登录可达。过渡期 Python 的 AI 端点仍直写共享
  # quiz 表）
  - id: quiz_user
    uris: [/quiz, /quiz/*]
    priority: 50
    upstream_id: upstream-app-quiz
    plugins:
      request-id: {}
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
      forward-auth:
        uri: "http://192.168.138.1:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid, X-Roles]
        timeout: 5000
        status_code: 401

  # /quiz/styles -> app-ts（考试蓝本目录，65 种，个性化出题选择器数据源；实现在
  # app-ts routes/quiz.ts，纯静态无 LLM。priority 110 压过 quiz_user 通配——缺此
  # 路由会落 app-quiz 的 /:quiz_uuid 404，前端目录永远「加载中」）。
  - id: quiz_ai_styles
    uri: /quiz/styles
    methods: [GET]
    priority: 110
    upstream_id: upstream-app-ts
    plugins:
      request-id: {}
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
      forward-auth:
        uri: "http://192.168.138.1:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid, X-Roles]
        timeout: 5000
        status_code: 401

  # /quiz/generate-from-summary -> app-ts（AI 编排；priority 110 > quiz_ai 100）。
  - id: quiz_ai_summary
    uri: /quiz/generate-from-summary
    methods: [POST]
    priority: 110
    upstream_id: upstream-app-ts
    plugins:
      request-id: {}
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
      forward-auth:
        uri: "http://192.168.138.1:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid, X-Roles]
        timeout: 5000
        status_code: 401

  # /quiz/generate -> app-ts（folder/pages 来源的 AI 出题；priority 110）。
  # /quiz/resume -> app-ts（partial 卷断点续跑）。
  - id: quiz_ai_generate
    uris: [/quiz/generate, /quiz/generate-ai, /quiz/resume]
    methods: [POST]
    priority: 110
    upstream_id: upstream-app-ts
    plugins:
      request-id: {}
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
