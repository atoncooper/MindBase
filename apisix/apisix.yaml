# APISIX standalone routes - DOCKER variant (normalized)
# ========================================================
# Mounted to /usr/local/apisix/conf/apisix.yaml.
#
# Docker deployment: upstreams use service names backend:8000 / app-task:8001
# (same mind-base-net). For local VM dev, use apisix.dev.yaml instead.
#
# ⚠️ Standalone mode: dashboard / Admin API writes do NOT persist. Edit THIS
#    file and restart APISIX. Do NOT configure via the dashboard UI - changes
#    are lost on restart (no etcd).
#
# Auth model:
#   - User endpoints (/task-quiz/chat, /task-quiz/register, /tasks, /tasks/*):
#       forward-auth -> backend /internal/auth/verify (validates bili_session,
#       injects X-Uid). Backend/app-task read uid from X-Uid header.
#   - User pay endpoints (/pay/*): forward-auth -> X-Uid -> app-pay (same model).
#   - app-pay service-to-service (/internal/pay/*): key-auth. M2 channel callbacks
#     (/pay/callback/*) carry gateway-channel signature instead of user auth.
#   - Service-to-service (/internal/quiz/generate-llm, /tasks/register):
#       key-auth (consumer "internal"). backend calls /tasks/register with apikey;
#       uid passed in request body (agent already knows it).
#
# NOTE: standalone yaml does NOT interpolate ${ENV}. Replace the placeholder
# key below with a real secret (or migrate to APISIX dashboard + etcd for
# env-based config).
#
# Upstream normalization:
#   - retries: 2 for normal APIs; 0 for SSE (replaying a half stream corrupts it)
#   - timeout: connect/send 5s; read 30s normal / 300s SSE
#   - keepalive_pool: reuse backend connections (size/idle_timeout/requests)
#   - checks: active probes GET /health every 5s; passive observes real traffic.
#     Both backends expose /health (FastAPI /health, app-task /health). Even a
#     single node benefits: a failing node is marked unhealthy so APISIX returns
#     503 fast instead of hanging on a dead backend.
#
# Route matching: higher priority wins; ties broken by path length (longer first).
#   - /tasks/register (100) beats /tasks/* (10) so backend->app-task uses key-auth.
#   - catch_all (1) is the fallback for /auth /chat /favorites ... -> backend.

# ============================================================
# Upstreams
# ============================================================
upstreams:
  # Main app FastAPI - normal API (read timeout 30s)
  - id: upstream-backend
    name: backend
    type: roundrobin
    scheme: http
    pass_host: pass
    retries: 2
    timeout:
      connect: 5
      send: 5
      read: 30
    keepalive_pool:
      size: 10
      idle_timeout: 60
      requests: 100
    nodes:
      "backend:8000": 1
    checks:
      active:
        type: http
        http_path: /health
        timeout: 1
        interval: 5
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200]
        unhealthy:
          interval: 5
          http_failures: 3
          http_statuses: [404, 500, 502, 503, 504]
      passive:
        type: http
        healthy:
          http_statuses: [200]
          successes: 2
        unhealthy:
          http_statuses: [500, 502, 503, 504]
          http_failures: 3

  # Main app FastAPI - SSE streaming (/task-quiz/chat)
  - id: upstream-backend-sse
    name: backend-sse
    type: roundrobin
    scheme: http
    pass_host: pass
    retries: 0  # SSE: never retry - replaying a half stream corrupts it
    timeout:
      connect: 5
      send: 5
      read: 300  # SSE streaming - keep long or the stream is cut at 30s
    keepalive_pool:
      size: 10
      idle_timeout: 60
      requests: 100
    nodes:
      "backend:8000": 1
    checks:
      active:
        type: http
        http_path: /health
        timeout: 1
        interval: 5
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200]
        unhealthy:
          interval: 5
          http_failures: 3
          http_statuses: [404, 500, 502, 503, 504]
      passive:
        type: http
        healthy:
          http_statuses: [200]
          successes: 2
        unhealthy:
          http_statuses: [500, 502, 503, 504]
          http_failures: 3

  # Main app FastAPI - WebSocket (/ws task notifications, long-lived)
  # Same nodes as backend; read 86400s aligns with nginx proxy_read_timeout so
  # idle WS isn't dropped. retries:0 - never retry a long-lived connection.
  - id: upstream-backend-ws
    name: backend-ws
    type: roundrobin
    scheme: http
    pass_host: pass
    retries: 0
    timeout:
      connect: 5
      send: 5
      read: 86400
    keepalive_pool:
      size: 10
      idle_timeout: 60
      requests: 100
    nodes:
      "backend:8000": 1
    checks:
      active:
        type: http
        http_path: /health
        timeout: 1
        interval: 5
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200]
        unhealthy:
          interval: 5
          http_failures: 3
          http_statuses: [404, 500, 502, 503, 504]
      passive:
        type: http
        healthy:
          http_statuses: [200]
          successes: 2
        unhealthy:
          http_statuses: [500, 502, 503, 504]
          http_failures: 3

  # app-auth —— 身份认证服务（Go；auth 表 schema 所有者）。
  # forward-auth verify 权威 + /auth/* 用户端点归属地。宽验证语义：
  # 无凭证 200（不带身份头，公有端点放行；受保护服务对缺 X-Uid 自行 401）。
  - id: upstream-app-auth
    name: app-auth
    type: roundrobin
    scheme: http
    pass_host: pass
    retries: 2
    timeout:
      connect: 5
      send: 5
      read: 30
    keepalive_pool:
      size: 10
      idle_timeout: 60
      requests: 100
    nodes:
      "app-auth:8006": 1
    checks:
      active:
        type: http
        http_path: /health
        timeout: 1
        interval: 5
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200]
        unhealthy:
          interval: 5
          http_failures: 3
          http_statuses: [404, 500, 502, 503, 504]
      passive:
        type: http
        healthy:
          http_statuses: [200]
          successes: 2
        unhealthy:
          http_statuses: [500, 502, 503, 504]
          http_failures: 3

  # app-cloud —— 云盘服务（Go；nginx /cloud/ 直连为主路径，此 upstream 仅兜底路由用）
  - id: upstream-app-cloud
    name: app-cloud
    type: roundrobin
    scheme: http
    pass_host: pass
    retries: 2
    timeout:
      connect: 5
      send: 5
      read: 30
    keepalive_pool:
      size: 10
      idle_timeout: 60
      requests: 100
    nodes:
      "app-cloud:8007": 1
    checks:
      active:
        type: http
        http_path: /health
        timeout: 1
        interval: 5
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200]
        unhealthy:
          interval: 5
          http_failures: 3
          http_statuses: [404, 500, 502, 503, 504]
      passive:
        type: http
        healthy:
          http_statuses: [200]
          successes: 2
        unhealthy:
          http_statuses: [500, 502, 503, 504]
          http_failures: 3

  # app-task Go executor - /tasks/* user endpoints + /tasks/register
  - id: upstream-app-task
    name: app-task
    type: roundrobin
    scheme: http
    pass_host: pass
    retries: 2
    timeout:
      connect: 5
      send: 5
      read: 30
    keepalive_pool:
      size: 10
      idle_timeout: 60
      requests: 100
    nodes:
      "app-task:8001": 1
    checks:
      active:
        type: http
        http_path: /health
        timeout: 1
        interval: 5
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200]
        unhealthy:
          interval: 5
          http_failures: 3
          http_statuses: [404, 500, 502, 503, 504]
      passive:
        type: http
        healthy:
          http_statuses: [200]
          successes: 2
        unhealthy:
          http_statuses: [500, 502, 503, 504]
          http_failures: 3

  # app-pay Spring Boot payment/membership service - /pay/* + /internal/pay/*
  # 服务端 HTTPS-only（自签名开发证书，app-pay/scripts/gen-dev-cert.* 生成）。
  # tls.verify=false = 只加密不校验身份：避免 ssl_trusted_certificate 覆盖公共 CA
  # 影响其他 cosocket；生产换正式 CA 后建议收紧为 verify:true + 挂载 CA。
  # 健康检查同步走 https（https_verify_certificate=false 对应自签名）。
  - id: upstream-app-pay
    name: app-pay
    type: roundrobin
    scheme: https
    # NOTE: no `tls:` block here — APISIX 3.11 crashes (parse_pem_cert(nil)
    # in upstream.lua set_upstream) for https upstreams carrying a tls block
    # without client_cert. Default behaviour already skips upstream cert
    # verification, so removing the block is equivalent and avoids the bug.
    pass_host: pass
    retries: 2
    timeout:
      connect: 5
      send: 5
      read: 30
    keepalive_pool:
      size: 10
      idle_timeout: 60
      requests: 100
    nodes:
      "app-pay:8002": 1
    checks:
      active:
        type: https
        https_verify_certificate: false
        http_path: /health
        timeout: 1
        interval: 5
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200]
        unhealthy:
          interval: 5
          http_failures: 3
          http_statuses: [404, 500, 502, 503, 504]
      passive:
        type: http
        healthy:
          http_statuses: [200]
          successes: 2
        unhealthy:
          http_statuses: [500, 502, 503, 504]
          http_failures: 3

  # app-board Go content store - mind maps & whiteboards (/board/*).
  # 服务端 HTTPS-only（自动生成 dev-CA + 叶子，自愈+自动续期，见 app-board/internal/tls）。
  # ⚠️ APISIX 3.11 限制：upstream tls.verify 仅支持 kafka upstream（schema_def.lua 注释
  # 明示），普通 https upstream 配 tls 对象会走 mTLS 路径且 client_cert 为 nil 直接 500。
  # 且 ngx_tpl 从不设 proxy_ssl_verify —— 本版本无 http upstream 身份校验旋钮。
  # 因此这里与 app-pay 同姿态：TLS 加密 on、证书校验暂不可用，待 APISIX 升级后收紧。
  # ca-bundle.crt（系统池+dev-CA）保留在 /tmp，供 lua_ssl_trusted_certificate 使用。
  # 节点名 app-board 即 SNI，命中叶子证书 SAN。健康检查走 https 但不验证书（探活无数据）。
  - id: upstream-app-board
    name: app-board
    type: roundrobin
    scheme: https
    pass_host: pass
    retries: 2
    timeout:
      connect: 5
      send: 5
      read: 30
    keepalive_pool:
      size: 10
      idle_timeout: 60
      requests: 100
    nodes:
      "app-board:8004": 1
    checks:
      active:
        type: https
        http_path: /health
        https_verify_certificate: false
        timeout: 1
        interval: 5
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200]
        unhealthy:
          interval: 5
          http_failures: 3
          http_statuses: [404, 500, 502, 503, 504]
      passive:
        type: http
        healthy:
          http_statuses: [200]
          successes: 2
        unhealthy:
          http_statuses: [500, 502, 503, 504]
          http_failures: 3

# ============================================================
# Routes
# ============================================================
routes:
  # User <-> main app task-quiz agent chat (SSE; forward-auth verifies bili_session)
  - id: task_quiz_chat
    uri: /task-quiz/chat
    methods: [POST]
    priority: 50
    upstream_id: upstream-backend-sse
    plugins:
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
      forward-auth:
        uri: "http://app-auth:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid, X-Roles]
        timeout: 5000
        status_code: 401

  # User -> main app task-quiz register form (forward-auth verifies bili_session)
  - id: task_quiz_register
    uri: /task-quiz/register
    methods: [POST]
    priority: 50
    upstream_id: upstream-backend
    plugins:
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
      forward-auth:
        uri: "http://app-auth:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid, X-Roles]
        timeout: 5000
        status_code: 401

  # app-task -> main app generate quiz (async, service-to-service, key-auth)
  - id: internal_quiz_generate
    uri: /internal/quiz/generate-llm
    methods: [POST]
    priority: 50
    upstream_id: upstream-backend
    plugins:
      key-auth: {}

  # app-task -> main app poll quiz generation status (async A+B)
  - id: internal_quiz_status
    uri: /internal/quiz/status/*
    methods: [GET]
    priority: 50
    upstream_id: upstream-backend
    plugins:
      key-auth: {}

  # agent(backend) -> app-task register (service-to-service, key-auth; uid in body)
  # priority 100 so /tasks/register is NOT shadowed by /tasks/* (forward-auth)
  # Lua scripts: upload/list/logs (service-to-service, key-auth). Script
  # uploads change executable code, so this MUST stay key-protected.
  - id: scripts_upload
    uri: /scripts*
    methods: [POST, GET]
    priority: 60
    upstream_id: upstream-app-task
    plugins:
      key-auth: {}

  # main app -> app-task async callback + mail delivery (service-to-service,
  # key-auth): executors report task completion and request email delivery.
  - id: internal_task_complete
    uri: /internal/task/*/complete
    methods: [POST]
    priority: 50
    upstream_id: upstream-app-task
    plugins:
      key-auth: {}

  - id: internal_email_send
    uri: /internal/email/send
    methods: [POST]
    priority: 50
    upstream_id: upstream-app-task
    plugins:
      key-auth: {}

  # User -> main app quiz-task business detail (forward-auth, X-Uid injected)
  - id: tasks_detail
    uri: /tasks/*/detail
    methods: [GET]
    priority: 100
    upstream_id: upstream-backend
    plugins:
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
      forward-auth:
        uri: "http://app-auth:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid, X-Roles]
        timeout: 5000
        status_code: 401

  - id: tasks_register
    uri: /tasks/register
    methods: [POST]
    priority: 100
    upstream_id: upstream-app-task
    plugins:
      key-auth: {}

  # User -> app-task task list (forward-auth, X-Uid injected)
  - id: tasks_list
    uri: /tasks
    methods: [GET]
    priority: 90
    upstream_id: upstream-app-task
    plugins:
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
      forward-auth:
        uri: "http://app-auth:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid, X-Roles]
        timeout: 5000
        status_code: 401

  # User -> app-task task detail (forward-auth, X-Uid injected)
  - id: tasks_wildcard
    uri: /tasks/*
    methods: [GET, POST]
    priority: 10
    upstream_id: upstream-app-task
    plugins:
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
      forward-auth:
        uri: "http://app-auth:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid, X-Roles]
        timeout: 5000
        status_code: 401

  # User -> main app submit answer (forward-auth, X-Uid injected).
  # 判题/入库/状态流转是业务逻辑，归主 app（app-task 只做调度+通知）。
  # priority 100 so /tasks/{id}/answer is NOT shadowed by /tasks/* (app-task).
  - id: tasks_answer
    uri: /tasks/*/answer
    methods: [POST]
    priority: 100
    upstream_id: upstream-backend
    plugins:
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
      forward-auth:
        uri: "http://app-auth:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid, X-Roles]
        timeout: 5000
        status_code: 401

  # User -> app-pay products/orders/membership (forward-auth, X-Uid injected).
  # /pay/callback/* is served by pay_callback below (priority 60, no forward-auth).
  - id: pay_user
    uri: /pay/*
    methods: [GET, POST]
    priority: 50
    upstream_id: upstream-app-pay
    plugins:
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
      forward-auth:
        uri: "http://app-auth:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid, X-Roles]
        timeout: 5000
        status_code: 401

  # 支付渠道异步回调（M2）：免登录态，伪造请求由渠道验签拒绝；掉单兜底以 ChannelQueryJob 为主
  - id: pay_callback
    uri: /pay/callback/*
    methods: [POST]
    priority: 60
    upstream_id: upstream-app-pay

  # main app / ops -> app-pay membership query & grant (service-to-service, key-auth)
  - id: pay_internal
    uri: /internal/pay/*
    methods: [GET, POST]
    priority: 50
    upstream_id: upstream-app-pay
    plugins:
      key-auth: {}

  # CORS preflight for /board/*: browsers strip Authorization on preflight,
  # so this route MUST NOT carry forward-auth (it would 401) — app-board's
  # corsMiddleware answers 204 + CORS headers directly. priority above board_user.
  - id: board_preflight
    uri: /board/*
    methods: [OPTIONS]
    priority: 60
    upstream_id: upstream-app-board

  # User -> app-board mind-map/whiteboard CRUD (forward-auth verifies
  # bili_session, injects X-Uid; app-board enforces per-uid ownership).
  # request-id plugin: assigns X-Request-Id (honors client-supplied value,
  # echoes in response) so gateway + app-board logs share one trace id.
  # Rollout note: other routes generate their own ids per-service; extending
  # request-id to all routes is a separate one-line-per-route change.
  - id: board_user
    uri: /board/*
    methods: [GET, POST, PUT, DELETE, PATCH]
    priority: 50
    upstream_id: upstream-app-board
    plugins:
      request-id: {}
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
      forward-auth:
        uri: "http://app-auth:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid, X-Roles]
        timeout: 5000
        status_code: 401

  # Internal (M2M) -> app-board: key-auth consumers (app-board-mcp and future
  # internal services) call /internal/board/* with the shared apikey plus the
  # acting user's X-Uid; proxy-rewrite strips the /internal prefix so app-board
  # serves its normal /board/* handlers. Caller-supplied X-Uid is trusted for
  # key-auth holders by design (same trust model as app-task's uid-in-body).
  # priority 100 so /internal/board/* never falls into board_user/catch_all.
  # limit-req: per-caller (remote_addr) 20 rps + burst 10 — the gateway-side
  # backstop so no key-auth holder can stampede app-board (standalone mode
  # keeps counters in local shm, no etcd needed).
  - id: board_internal
    uri: /internal/board/*
    methods: [GET, POST, PUT, DELETE, PATCH]
    priority: 100
    upstream_id: upstream-app-board
    plugins:
      request-id: {}
      key-auth: {}
      limit-req:
        rate: 20
        burst: 10
        rejected_code: 429
        key_type: var
        key: remote_addr
      proxy-rewrite:
        regex_uri: ["^/internal/board/(.*)", "/board/$1"]

  # 用户端认证端点 (/auth/*) -> app-auth。app-auth 自己校验 Bearer token
  # （authGuard），无需 forward-auth；仍剥离伪造身份头以防伪造 X-Uid。
  - id: auth_user
    uris: [/auth, /auth/*]
    priority: 50
    upstream_id: upstream-app-auth
    plugins:
      request-id: {}
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
      # Gateway-level backstop for the credential surface (nginx sheds at
      # 1r/s first; this catches bursts and any non-nginx internal caller).
      limit-req:
        rate: 10
        burst: 20
        rejected_code: 429
        key_type: var
        key: remote_addr

  # /cloud/* -> app-cloud（兜底路由：nginx /cloud/ 直连已绕过 APISIX，此路由
  # 保证任何直连 APISIX 的调用者也不会落回 backend 的已下线 cloud router）
  - id: cloud_user
    uris: [/cloud, /cloud/*]
    priority: 50
    upstream_id: upstream-app-cloud
    plugins:
      request-id: {}
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
      forward-auth:
        uri: "http://app-auth:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid, X-Roles]
        timeout: 5000
        status_code: 401

  - id: chat_sse
    uris: [/chat, /chat/*]
    priority: 50
    upstream_id: upstream-backend-sse
    plugins:
      request-id: {}
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
      forward-auth:
        uri: "http://app-auth:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid, X-Roles]
        timeout: 5000
        status_code: 401

  # User <-> main app WebSocket (/ws task notifications, long-lived). WS upstream
  # read 86400s aligns with nginx; APISIX passes Upgrade/Connection headers through.
  - id: ws_notifications
    uris: [/ws, /ws/*]
    priority: 50
    upstream_id: upstream-backend-ws
    plugins:
      request-id: {}
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
      forward-auth:
        uri: "http://app-auth:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid, X-Roles]
        timeout: 5000
        status_code: 401

  # Catch-all: other main app endpoints (/chat, /favorites, /knowledge, ...)
  # -> backend (passthrough)。forward-auth 经 app-auth 校验 bili_session 并注入
  # X-Uid/X-Roles（宽验证：无凭证放行，受保护端点对缺失 X-Uid 自行 401）。
  - id: catch_all
    uri: /*
    priority: 1
    upstream_id: upstream-backend
    plugins:
      request-id: {}
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
      forward-auth:
        uri: "http://app-auth:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid, X-Roles]
        timeout: 5000
        status_code: 401

# ============================================================
# Consumers
# ============================================================
consumers:
  - username: internal
    plugins:
      key-auth:
        key: mindbase-internal-key-change-me  # TODO: replace with real secret; sync with .env APISIX_CONSUMER_KEY

#END
