        request_headers: [Authorization]
        upstream_headers: [X-Uid, X-Roles]
        timeout: 5000
        status_code: 401


  # /vec/page/* + /knowledge(stats|folders/status|pages/vectorized|clear|video/*)
  # + /chat/search -> app-ts（视频分P向量化管线 + 知识库管理面，迁移自 Python
  # VectorPageService/knowledge router。向量真账本 = app-ts Mongo vec_pages/vec_tasks；
  # 收藏夹 scope 经 app-bili internal 只读端点。/knowledge/build* 与
  # /knowledge/folders/sync 仍归 app-bili（bili_user），uri 列表显式不相交。
  # 回滚 = 删除本路由（该 URI 将 404——Python 面已退役，无回落）。
  - id: vec_knowledge_ts
    uris: [/vec, /vec/*, /knowledge/stats, /knowledge/folders/status, /knowledge/pages/vectorized, /knowledge/clear, /knowledge/video, /knowledge/video/*, /chat/search, /blindspot, /blindspot/*, /skills, /skills/*]
    priority: 55
    upstream_id: upstream-app-ts
    plugins:
      request-id: {}
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
      forward-auth:
        uri: "http://app-auth:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid, X-Roles]
        timeout: 5000
        status_code: 401

  # /preferences + /wallpaper + /avatar -> app-settings（用户 KV 偏好 + 壁纸/
  # 头像上传与服务，2026-10-06 迁自 Python；wallpaper/file、avatar/file 无鉴权
  # —— <img> 直读语义，lenient verify 无凭证时放行）。
  - id: prefs_wallpaper_user
    uris: [/preferences, /preferences/*, /wallpaper, /wallpaper/*, /avatar, /avatar/*]
    priority: 50
    upstream_id: upstream-app-settings
    plugins:
      request-id: {}
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
      forward-auth:
        uri: "http://app-auth:8006/internal/auth/verify"
        request_headers: [Authorization]
        upstream_headers: [X-Uid, X-Roles]
        timeout: 5000
        status_code: 401

  # /workspaces/* -> app-cloud（RAG 工作区 CRUD/绑定/文件展开，2026-10-06 迁自
  # Python workspace router；camelCase wire。回滚 = 删除本路由即回落 catch_all。）
  - id: workspaces_user
    uris: [/workspaces, /workspaces/*]
    priority: 50
    upstream_id: upstream-app-cloud
    plugins:
      request-id: {}
      proxy-rewrite:
        headers:
          remove: [X-Uid, X-Roles]
      forward-auth:
        uri: "http://app-auth:8006/internal/auth/verify"
