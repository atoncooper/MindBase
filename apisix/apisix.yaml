        upstream_headers: [X-Uid, X-Roles]
        timeout: 5000
        status_code: 401

  # /notes/* -> app-note（笔记服务；切流自主 backend catch_all。宽验证
  # forward-auth 与 catch_all 语义一致：无凭证放行，公开分享页
  # /notes/shared/{token} 免登录可达，受保护端点对缺失 X-Uid 自行 401。
  # 回滚方式：删除本路由（该 URI 将 404——Python 面已退役，无回落）。
  - id: notes_user
    uris: [/notes, /notes/*]
    priority: 50
