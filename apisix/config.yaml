# APISIX standalone (yaml) mode configuration.
# Routes/upstreams/consumers are read from apisix.yaml at startup; etcd is not
# the route source. Some image startup paths still call init_etcd, so keep the
# compose dependency until that is verified/removed.
#
# In APISIX 3.x, standalone = deployment.role "data_plane" +
# role_data_plane.config_provider "yaml" (there is no "standalone" role).
# The route source is yaml, so APISIX does not read routes from etcd. The
# image's startup command can still run `apisix init_etcd`; keep the compose
# etcd dependency until that startup path is explicitly removed/verified.
# Admin API is disabled under the yaml provider, so no admin_key is configured.
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

apisix:
  # Control API (port 9090, in-container only). The compose healthcheck checks
  # this listener via /proc/net/tcp; bind loopback so other containers cannot
  # query APISIX control endpoints.
  control:
    ip: 127.0.0.1
    port: 9090
  # Trust anchors for upstream TLS verification (cosocket ssl.verify).
  # ca-bundle.crt = system CA pool + app-content（board 面）dev CA (concatenated
  # by the compose entrypoint into /tmp at container start — the image's
  # conf/certs dir is not writable by the runtime user). The system pool MUST be
  # included: ssl_trusted_certificate REPLACES the default verification pool, so
  # a bare dev-ca.crt here would break every other https cosocket — the exact
  # trap documented on upstream-app-pay (which works around it with verify:false;
  # app-content board 面 keeps verification on). If app-content has not generated
  # its CA yet (cold start ordering), the entrypoint falls back to the system pool
  # and `docker compose restart apisix` after first app-content boot reloads it.
  ssl:
    # Service-to-service HTTPS listener (nginx -> https://apisix:9443).
    # Encryption only for upstreams (APISIX 3.11 cannot verify non-kafka
    # upstream certs), but nginx verifies this listener's leaf.
    enable: true
    listen:
      - port: 9443
    cert: /usr/local/apisix/conf/certs/apisix/server.crt
    key: /usr/local/apisix/conf/certs/apisix/server.key
    ssl_trusted_certificate: /tmp/ca-bundle.crt

# Custom nginx directives.
# proxy_buffering off: /chat/* and /task-quiz/chat are SSE streams. APISIX
# (nginx-based) buffers upstream responses by default, which collapses
# token-by-token streaming into one bulk delivery.
#
# NOTE: `nginx_config.http.proxy_buffering` is NOT a supported key — APISIX
# silently ignores it (verified: absent from ngx_tpl.lua and from the
# generated nginx.conf). Arbitrary directives must go through a
# *_configuration_snippet slot; this one lands `proxy_buffering off;` inside
# every location block of the generated nginx.conf (verified with
# `apisix test` + grep). SSE upstreams (app-ts/app-content) also send
# `X-Accel-Buffering: no` as a per-response belt-and-braces.
#
# client_max_body_size aligns APISIX with the OpenResty API boundary (50 MB);
# large object bytes never pass through APISIX (edge -> MinIO direct).
nginx_config:
  http_server_configuration_snippet: |
    client_max_body_size 50m;
  http_server_location_configuration_snippet: |
    proxy_buffering off;