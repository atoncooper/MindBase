auth:
  # ============================================================
  # app-user (Go) - default configuration
  # ============================================================
  # Identity & access service: session tokens, login methods, account
  # management, RBAC. Owns the auth tables (users/user_tokens/user_oauth/
  # user_profile/user_device/verification_codes/login_attempts/rbac_*) in the
  # SHARED bilirag MySQL database — schema ownership moved here from the
  # Python backend (which keeps READ-ONLY access to user_oauth for SESSDATA).
  #
  # Merge order (later overrides earlier):
  #   1. default.yaml               <- this file (embedded in binary)
  #   2. Environment variables      <- prefix APPAUTH__, double-underscore nesting:
  #        APPAUTH__RDBMS__URL=...  -> rdbms.url
  #   Shared secret env vars (read directly, same names as the Python backend):
  #        SECURITY__API_KEY_ENCRYPTION_KEY, EMAIL__API_KEY, SMS__*,
  #        WECHAT__APP_ID/APP_SECRET/REDIRECT_URI, REDIS__URL
  # Secrets MUST be injected via env, never committed in YAML.
  # ============================================================

  app:
    name: app-user
    debug: false

  server:
    host: 0.0.0.0
    port: 8006
    read_header_timeout_seconds: 5
    read_timeout_seconds: 15
    write_timeout_seconds: 30
    idle_timeout_seconds: 60
    shutdown_timeout_seconds: 10
    max_header_bytes: 1048576
    max_body_bytes: 1048576
    trusted_proxies: ["127.0.0.1", "::1", "172.16.0.0/12"]
    max_connections: 1024
    max_concurrent: 64
    max_concurrent_per_ip: 16
    http2_enabled: true
    compression: "both"
    keepalive_max_requests: 1000
    access_log_enabled: true
    access_log_sample_rate: 100
    access_log_format: "slog"

  timezone: Asia/Shanghai

  rdbms:
    url: ""                    # inject via APPAUTH__RDBMS__URL (shared bilirag MySQL dsn)
    max_open_conns: 30         # auth/settings pool — forward-auth hot path
    max_idle_conns: 10
    conn_max_lifetime: 1800    # seconds
    conn_max_idle_time_seconds: 300

  redis:
    url: ""                    # inject via APPAUTH__REDIS__URL or shared REDIS__URL; empty = in-memory cache only
    pool_size: 50
    min_idle_conns: 5
    pool_timeout_seconds: 5
    dial_timeout_seconds: 5
    read_timeout_seconds: 3
    write_timeout_seconds: 3
    max_retries: 2

  auth:
    token_ttl_days: 30         # session token lifetime (must match Python DEFAULT_TOKEN_TTL_DAYS)
    cache_ttl_seconds: 300     # token->uid cache TTL (must match Python _TOKEN_TTL)
    token_cache_namespace: "appauth:token:"  # redis key prefix for the token cache

  security:
    api_key_encryption_key: "" # inject via SECURITY__API_KEY_ENCRYPTION_KEY (shared with Python backend;
                               # AES-256-GCM key, base64(32 bytes); empty = plaintext-base64 fallback
                               # ONLY when app.debug=true or allow_plaintext_fallback=true)
    allow_plaintext_fallback: false
    captcha:
      enabled: true
      length: 4
      ttl_seconds: 300
      image_width: 160
      image_height: 56
    # Per-endpoint fixed-window rate limits (Redis-backed, fail-open).
    # Defaults mirror the Python backend's security.rate_limit.* — entries
    # listed here are the effective defaults; override any rule per key.
    rate_limit:
      login_ip:          { max: 10, window: 60 }    # per-IP login attempts
      login_target:      { max: 20, window: 300 }   # per-identifier (email/phone); high enough that 5 bad guesses cannot lock a victim from another IP
      register_send_ip:  { max: 5,  window: 3600 }  # per-IP register-code sends
      register_send_tgt: { max: 3,  window: 3600 }  # per-email register-code sends
      register_ip:       { max: 10, window: 3600 }  # per-IP registrations
      phone_send_ip:     { max: 10, window: 60 }    # per-IP sms sends
      phone_send_tgt:    { max: 5,  window: 600 }   # per-phone sms sends
      phone_login_ip:    { max: 10, window: 300 }   # per-IP sms-code logins
      email_send_ip:     { max: 10, window: 60 }    # per-IP email-code sends (authed)
      email_send_uid:    { max: 5,  window: 600 }   # per-uid email-code sends
      email_verify_ip:   { max: 20, window: 60 }    # per-IP code verifications
      pw_reset_req_ip:   { max: 5,  window: 3600 }  # per-IP reset requests
      pw_reset_req_tgt:  { max: 3,  window: 3600 }  # per-email reset requests
      pw_reset_ip:       { max: 10, window: 3600 }  # per-IP reset confirms
      pw_change_uid:     { max: 3,  window: 3600 }  # per-uid password changes
      pw_set_uid:        { max: 3,  window: 3600 }  # per-uid first-time password sets

  # app-pay membership lookup used by the Coding Plan VIP/SVIP gate.
  # The client calls {base_url}/internal/pay/membership/{uid} through APISIX
  # key-auth; base_url is the gateway origin (default http://apisix:9080).
  # key falls back to the shared APISIX_CONSUMER_KEY env when empty; an empty
  # key makes every membership check fail closed (Coding Plan unavailable).
  app_pay:
    base_url: "http://apisix:9080"
    key: ""

  email:
    enabled: true             # inject via EMAIL__ENABLED (shared with Python backend)
    api_key: ""                # inject via EMAIL__API_KEY (Resend)
    from_email: "MindBase <onboarding@resend.dev>"
    frontend_url: "http://localhost:3000"
    code_ttl_seconds: 300
    code_length: 6
    rate_limit_target_seconds: 60
    rate_limit_uid_minutes: 10
    rate_limit_uid_max: 5
    max_verify_attempts: 5

  sms:
    # 阿里云短信验证码(手机登录/绑定/二次验证)。provider 二选一:
    #   dysmsapi（默认，短信服务）：自定义签名+模板，验证码由本服务生成并本地核验
    #   dypnsapi（号码认证服务-短信认证）：推荐个人开发者使用控制台赠送的
    #     签名/模板（该产品不支持自定义签名，SignName 必须从赠送签名配置页选）；
    #     code_source=aliyun 时由阿里云生成并核验验证码
    #     （CheckSmsVerifyCode 免费，本服务不存明文码）
    # 模板必须包含 ${code} 变量；dypnsapi 的赠送模板通常已含该变量。
    # 密钥对走 .env 的 SMS__ACCESS_KEY_ID / SMS__ACCESS_KEY_SECRET；
    # 改完执行 docker compose up -d --force-recreate app-user。
    # 未配置时 /auth/features 返回 sms_enabled=false,前端隐藏手机登录入口。
    enabled: true
    provider: dypnsapi         # dysmsapi | dypnsapi
    # 必须与 dypns 控制台「赠送签名配置」页的签名名称完全一致；
    # 若这里用的是短信服务的自定义签名，provider 必须改回 dysmsapi。
    sign_name: "恒创联众科技"
    # 默认模板（未在 template_codes 中匹配到 purpose 时使用）
    template_code: "100001"    # 必须是 dypns「赠送模板配置」页的模板 CODE
    # 按业务 purpose 选择不同模板（code 登录/注册 / 绑定手机 / 二次验证）
    template_codes:
      login: "100001"          # 登录/注册模板
      bind_phone: "100004"     # 绑定新手机号模板
      twofa_sms: "100005"      # 验证绑定手机号模板（改密/设密二次验证）
      # 备用：修改绑定手机号 100002 / 重置密码 100003（当前无 SMS 重置流程）
    scheme_name: ""            # dypnsapi 方案名(可空=默认方案);发送/核验必须一致
    country_code: "86"         # dypnsapi 号码国家码(当前仅支持中国大陆)
    code_source: aliyun        # 赠送模板推荐 aliyun：阿里云生成+核验(CheckSmsVerifyCode 免费)
    interval_seconds: 60       # dypnsapi 单号码发送间隔
    duplicate_policy: 1        # 1=新码覆盖旧码
    auto_retry: 1              # 1=允许阿里云内部重试
    # 模板额外变量（不是模板列表！）。阿里云赠送验证码模板通常含
    # ${code} 与 ${min}（有效期分钟数）；若模板没有 ${min} 就删掉此行。
    template_params:
      min: "5"
    access_key_id: ""          # inject via SMS__ACCESS_KEY_ID (.env)
    access_key_secret: ""      # inject via SMS__ACCESS_KEY_SECRET (.env)

  wechat:
    enabled: false             # inject via WECHAT__ENABLED
    app_id: ""
    app_secret: ""
    redirect_uri: ""

  worker_id: 2                # snowflake worker id — MUST differ from the Python backend (default 1) to avoid uid collisions

  security_cors:
    # 本地部署的页面入口可能落在 nginx :80/:443 的任一源（localhost、127.0.0.1、
    # hosts 别名 mindbase —— 三者都在 cert-gen 的证书 SAN 里）。API 基址是
    # NEXT_PUBLIC_API_URL=https://localhost，从其他源打开页面时浏览器会发 CORS
    # 预检，白名单必须覆盖全部本地入口，否则预检 204 缺 ACAO、实际请求被浏览器
    # 拦截（表现为前端 Failed to fetch 而后端只见 OPTIONS 不见 GET）。
    allow_origins:
      - http://localhost:3000
      - https://localhost
      - http://localhost
      - https://127.0.0.1
      - http://127.0.0.1
      - https://mindbase
      - http://mindbase

  log:
    level: info       # debug|info|warn|error (APPAUTH__LOG__LEVEL)
    format: json      # text|json (APPAUTH__LOG__FORMAT)
    output: stdout    # stdout|file|both (APPAUTH__LOG__OUTPUT)
    add_source: true
    redact_keys: ["password", "token", "secret", "api_key", "apikey", "authorization", "cookie", "access_key", "access_key_secret", "sms_code", "refresh_token"]
    sampling:
      enabled: true
      initial: 5
      thereafter: 100
    async:
      enabled: true
      buffer: 4096
      drop_when_full: true
    file:
      path: /app/logs/app-user.log
      max_size: 100
      max_backups: 7
      max_age: 30
      compress: true

bili:
  # ============================================================
  # app-user (Go) - default configuration
  # ============================================================
  # Bilibili data acquisition service: favorites sync/organize,
  # video/player info (WBI-signed), audio/subtitle fetching, and
  # DashScope ASR transcription (via the Higress AI gateway).
  # Data acquisition ONLY — no embedding/Milvus/RAG work happens
  # here (those stay in the Python AI stack; ASR completion is
  # published to Redis so the AI side can trigger vectorization).
  #
  # Schema ownership: collection / favorite_folders / video /
  # video_versions / async_tasks in the SHARED bilirag MySQL.
  # Merge order (later overrides earlier):
  #   1. default.yaml               <- this file (embedded in binary)
  #   2. Environment variables      <- prefix APPBILI__, double-underscore nesting
  #   Shared secret env vars (same names as the other services):
  #        AI_GATEWAY__API_KEY, MONGO__URI, SECURITY__API_KEY_ENCRYPTION_KEY, REDIS__URL
  # Secrets MUST be injected via env, never committed in YAML.
  # ============================================================

  app:
    name: app-user
    debug: false

  server:
    host: 0.0.0.0
    port: 8006
    max_body_bytes: 1048576
    trusted_proxies: ["127.0.0.1", "::1", "172.16.0.0/12"]

  timezone: Asia/Shanghai

  rdbms:
    url: ""                    # inject via APPBILI__RDBMS__URL (shared bilirag MySQL dsn)
    max_open_conns: 15         # acquisition/ASR pool — separate from auth
    max_idle_conns: 8
    conn_max_lifetime: 1800
    conn_max_idle_time_seconds: 300

  mongo:
    uri: ""                    # inject via MONGO__URI (shared); asr_documents
    database: mind_base
    max_pool_size: 50
    min_pool_size: 5
    max_conn_idle_time_seconds: 300
    connect_timeout_seconds: 5
    server_selection_timeout_seconds: 5

  redis:
    url: ""                    # inject via APPBILI__REDIS__URL or shared REDIS__URL

  # ASR credentials: platform path uses the Higress AI gateway native
  # passthrough (same env names as the Python backend — one .env).
  asr:
    api_key: ""                # inject via AI_GATEWAY__API_KEY
    base_url: "http://higress:8080/api/v1"  # OpenAI-style base; native base derived
    transcribe_model: paraformer-v2          # offline async (REST)
    transcribe_timeout_seconds: 600
    poll_interval_ms: 1500
    chunk_concurrency: 3                     # parallel chunk recognition cap
    min_text_chars: 50                       # below this = failed transcription
    tmp_dir: /tmp/asr_tmp

  bili:
    # Anti-crawl hardening: full device fingerprint + adaptive backoff.
    page_delay_min_ms: 300        # favorite-list pagination jitter floor
    page_delay_max_ms: 800
    video_delay_min_ms: 1500      # per-video pause floor (folder sync)
    video_delay_max_ms: 4000
    max_retries: 4                # 412/352 backoff attempts
    backoff_base_ms: 1500         # exponential base
    proxy: ""                     # optional static egress proxy (http://host:port or socks5://)
    request_timeout_seconds: 30

  cors:
    allow_origins:
      - http://localhost:3000

  # Internal M2M face (/internal/bili/*) — AI stack reads the knowledge scope.
  # Key = shared APISIX consumer key; compose injects it via
  # APPBILI__INTERNAL__API_KEY. Empty = every internal request rejected.
  internal:
    api_key: ""

  log:
    level: info
    format: json
    output: stdout
    file:
      path: /app/logs/app-user.log
      max_size: 100
      max_backups: 7
      max_age: 30
      compress: true

settings:
  # ============================================================
  # app-settings (Go) - default configuration
  # ============================================================
  # User preferences (/preferences KV) + avatar (/avatar/upload,
  # /avatar/file via app-cloud object storage) on the SHARED bilirag MySQL.
  # Owns user_preferences only (CREATE-only) — the per-user API key
  # config tables (user_credentials / user_embedding_configs /
  # user_asr_configs) were retired with BYOK: nothing reads them.
  #
  # Merge order (later overrides earlier):
  #   1. default.yaml               <- this file (embedded in binary)
  #   2. Environment variables      <- prefix APPSETTINGS__, double-underscore nesting
  #   Shared env vars: RDBMS__URL; avatar storage is app-cloud M2M
  # Secrets MUST be injected via env, never committed in YAML.
  # ============================================================

  app:
    name: app-settings
    debug: false

  server:
    host: 0.0.0.0
    port: 8006
    max_body_bytes: 4194304
    trusted_proxies: ["127.0.0.1", "::1", "172.16.0.0/12"]

  timezone: Asia/Shanghai

  rdbms:
    url: ""                    # inject via APPSETTINGS__RDBMS__URL (shared bilirag MySQL dsn)
    max_open_conns: 10
    max_idle_conns: 5
    conn_max_lifetime: 1800

  log:
    level: info
    format: json
    output: stdout
    file:
      path: /app/logs/app-settings.log
      max_size: 100
      max_backups: 7
      max_age: 30
      compress: true

  # 头像对象存储归 app-cloud（MinIO 凭据只留在 app-cloud）。
  # app-user 只调用 /internal/cloud/avatar；base_url 指向 app-cloud 服务。
  app_cloud:
    base_url: "http://app-cloud:8007"
    api_key: ""
    timeout_ms: 30000

# 可选：三个监听口启用 TLS（空 = 明文 HTTP，默认）。部署时可用
# TLS__CERT_FILE / TLS__KEY_FILE 覆盖；生产建议用挂载的正式证书。
tls:
  cert_file: ""
  key_file: ""
