name: app_mobile
description: "MindBase mobile client - B站收藏知识库 RAG 系统的 Flutter 移动端。"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 网络 / 状态 / 路由
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1

  # 安全存储（token 只允许进这里）
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # UI
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1

  # 工具
  path_provider: ^2.1.5
  mime: ^1.0.6
  intl: ^0.19.0
  file_picker: ^8.1.2
  uuid: ^4.5.1
  flutter_markdown_plus: ^1.0.12
  highlight: ^0.7.0
  markdown: ^7.3.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # MiSans（小米官方字体，免费商用）：Latin + CJK 一体，观感接近苹方。
  # 仅打包 4 个字重（Regular/Medium/Demibold/Bold ≈ 30MB）；
  # 如需缩减体积，后续可用 fonttools 对 CJK 按需子集化。
  # ⚠️ MiSans 无 italic：禁止任何 FontStyle.italic（合成斜体会让汉字歪扭），
  #    markdown 强调用字重表达；代码字体用 AppTheme.codeFontFamily 链。
  fonts:
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
        - asset: assets/fonts/MiSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MiSans-Demibold.ttf
          weight: 600
        - asset: assets/fonts/MiSans-Bold.ttf
          weight: 700
