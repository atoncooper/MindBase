<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 400" fill="none">
  <!-- 登录页侧栏插画（深蓝底用）：盾形主视觉 + 账卡 + 结算折线 + 硬币 -->
  <!-- 背景同心虚线弧 -->
  <circle cx="230" cy="182" r="172" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5" stroke-dasharray="3 7"/>
  <circle cx="230" cy="182" r="122" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5" stroke-dasharray="3 7"/>

  <!-- 主盾标（logo 几何的白色线稿版，双色对角） -->
  <g transform="translate(172,44) scale(2.4)" stroke="#ffffff">
    <path d="M24 2.5 41.5 9v12.6c0 10.9-7.1 19.2-17.5 23C13.6 40.8 6.5 32.5 6.5 21.6V9Z" fill="rgba(255,255,255,0.12)" stroke-opacity="0.9" stroke-width="1"/>
    <path d="M24 2.5 41.5 9v12.6c0 10.9-7.1 19.2-17.5 23V2.5Z" fill="rgba(255,255,255,0.08)" stroke="none"/>
    <path d="M24 7.2 37.3 12.3v9.3c0 8.2-5.3 14.6-13.3 17.6-8-3-13.3-9.4-13.3-17.6v-9.3Z" fill="none" stroke-opacity="0.35" stroke-width="0.8"/>
    <g stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18.2 15.2 24 22.2l5.8-7"/>
      <path d="M24 22.2v10"/>
      <path d="M19.4 26h9.2"/>
      <path d="M19.4 29.4h9.2"/>
    </g>
  </g>

  <!-- 左下：层叠账卡 -->
  <g>
    <rect x="34" y="302" width="118" height="72" rx="9" transform="rotate(-8 93 338)" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.28)"/>
    <rect x="46" y="294" width="118" height="72" rx="9" transform="rotate(-4 105 330)" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.34)"/>
    <rect x="58" y="288" width="118" height="72" rx="9" fill="rgba(255,255,255,0.13)" stroke="rgba(255,255,255,0.45)"/>
    <circle cx="82" cy="312" r="9" fill="rgba(255,255,255,0.28)"/>
    <rect x="74" y="330" width="60" height="6" rx="3" fill="rgba(255,255,255,0.38)"/>
    <rect x="74" y="342" width="36" height="6" rx="3" fill="rgba(255,255,255,0.22)"/>
  </g>

  <!-- 右下：结算折线 -->
  <g>
    <path d="M262 358 H432" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="2 6"/>
    <path d="M270 342 300 312 328 324 360 286 398 294 426 260" stroke="rgba(255,255,255,0.78)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="300" cy="312" r="3.5" fill="#0d2f6e" stroke="#ffffff" stroke-width="2"/>
    <circle cx="360" cy="286" r="3.5" fill="#0d2f6e" stroke="#ffffff" stroke-width="2"/>
    <circle cx="426" cy="260" r="3.5" fill="#0d2f6e" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- 漂浮硬币 -->
  <g stroke="#ffffff">
    <circle cx="94" cy="94" r="15" fill="rgba(255,255,255,0.10)" stroke-opacity="0.5" stroke-width="1.5"/>
    <g stroke-opacity="0.9" stroke-width="1.6" stroke-linecap="round" transform="translate(94,94)">
      <path d="M-4.5 -5.5 0 -0.5 4.5 -5.5"/>
      <path d="M0 -0.5 V 7"/>
      <path d="M-3.5 2 H 3.5"/>
      <path d="M-3.5 5 H 3.5"/>
    </g>
    <circle cx="380" cy="86" r="11" fill="rgba(255,255,255,0.08)" stroke-opacity="0.4" stroke-width="1.5"/>
    <g stroke-opacity="0.7" stroke-width="1.3" stroke-linecap="round" transform="translate(380,86) scale(0.75)">
      <path d="M-4.5 -5.5 0 -0.5 4.5 -5.5"/>
      <path d="M0 -0.5 V 7"/>
      <path d="M-3.5 2 H 3.5"/>
      <path d="M-3.5 5 H 3.5"/>
    </g>
  </g>
</svg>
