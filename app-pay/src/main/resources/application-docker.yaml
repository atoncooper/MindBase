# Production container shape (compose command activates the docker profile):
# in-container network addresses, MOCK off, test entry off, real Alipay gateway.
# Secrets/passwords are referenced from .env via placeholders (injected into the container by env_file) and never enter git.
pay:
  rdbms:
    url: jdbc:mysql://app-pay-mysql:3306/app_pay?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=false
    username: ${PAY_MYSQL_USER:app_pay}
    password: ${PAY_MYSQL_PASSWORD:app-pay}
  mock:
    # production red line: the MOCK channel must be off
    enabled: false
  alipay:
    enabled: ${ALIPAY_ENABLED:false}
    gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi.alipay.com/gateway.do}
    app-id: ${ALIPAY_APP_ID:}
    # application private key (signs requests); platform-public-key = Alipay public key (provided by the platform, verifies responses/callbacks; not the application public key)
    app-private-key: ${ALIPAY_APP_PRIVATE_KEY:}
    platform-public-key: ${ALIPAY_PLATFORM_PUBLIC_KEY:}
    notify-url: ${ALIPAY_NOTIFY_URL:}
  test:
    enabled: false
    # production container: even if the test entry is mistakenly enabled, an empty token must not be allowed
    require-token: true
  internal:
    executor-token: ${PAY_EXECUTOR_TOKEN:}
  refund:
    enabled: true
    max-days-back: 365
  apptask:
    base-url: ${APPTASK_BASE_URL:http://apisix:9080}
    executor-base-url: ${PAY_EXECUTOR_BASE_URL:https://app-pay:8002}
