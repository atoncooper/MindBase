# Test/local container shape (compose command activates the test profile):
# isolated database app_pay_test, MOCK channel on, local test entry on, order timeout reduced to 2min.
# Production instances do not carry the test profile, so this file does not affect them.
pay:
  rdbms:
    url: jdbc:mysql://app-pay-test-mysql:3306/app_pay_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=false
    username: app_pay_test
    password: app-pay-test
  mock:
    enabled: true
  order:
    timeout-minutes: 2
  test:
    enabled: true
    token: ${PAY_TEST_TOKEN:local-test-token}
    require-token: true
  refund:
    enabled: true
    max-days-back: 365
  apptask:
    # registered through APISIX inside the container network; the delegation callback points at the test
    # instance (naturally isolated from production delegations).
    # executor-base-url https: app-task trusts the dev CA (injected by compose) and then validates the certificate
    base-url: http://apisix:9080
    executor-base-url: https://app-pay-test:8002
  alipay:
    # sandbox integration: set true and configure the ALIPAY_* sandbox keys in .env (the gateway already points at the sandbox)
    enabled: false
    gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
