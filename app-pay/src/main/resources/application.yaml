server:
  port: 8002
  ssl:
    # End-to-end HTTPS (including local startup): transaction/membership data must never go online in plaintext.
    # Certificate = PEM (CA-issued). Dev/test certificates are generated by app-pay/scripts/gen-dev-cert.sh|.ps1 into
    # app-pay/certs/ (gitignored); the default relative paths hold for both shapes:
    #   - local IDE/mvn startup (workdir=app-pay/) -> app-pay/certs/*
    #   - container startup (WORKDIR=/app, compose mounts app-pay/certs:/app/certs:ro) -> /app/certs/*
    # Switch to a real certificate in production: after mounting, override the paths with PAY_TLS_CERT / PAY_TLS_KEY.
    # Emergency escape: PAY_TLS_ENABLED=false falls back to plaintext (local troubleshooting only, forbidden in production).
    enabled: ${PAY_TLS_ENABLED:true}
    certificate: ${PAY_TLS_CERT:certs/pay.crt}
    certificate-private-key: ${PAY_TLS_KEY:certs/pay.key}

spring:
  application:
    name: app-pay
  http:
    client:
      # Global fail-fast for outbound HTTP (timeout delegation registration runs in the request thread's afterCommit, so it must be bounded in time)
      connect-timeout: 2s
      read-timeout: 3s
  # Database migration is managed by Flyway (resources/db/migration/V*.sql).
  # baseline-on-migrate: an existing database (created by the historical schema.sql) is baselined to 0 and
  # then migrated incrementally; a new database is built in full from V1 -- both paths converge on the same
  # schema, no longer relying on hand-edited memory.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    # automatic mapping between entity camelCase and table snake_case (order_no <-> orderNo)
    map-underscore-to-camel-case: true
  # handwritten SQL is centralized in XML (resources/mapper/*.xml), matching Mapper interface method ids one-to-one
  mapper-locations: classpath*:/mapper/**/*.xml

pay:
  rdbms:
    # [this file = local development shape] connects directly to host-mapped port 3307 (app-pay-mysql container);
    # the Docker container shape is in application-docker.yaml (compose command activates the docker profile)
    # connection params: PreparedStatement client-side cache (clearly beneficial for repeated MyBatis statements)
    url: jdbc:mysql://127.0.0.1:3307/app_pay?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=false
    # the password placeholder references .env (shares the same variable name with the MySQL container); defaults match compose, works out of the box
    username: ${PAY_MYSQL_USER:app_pay}
    password: ${PAY_MYSQL_PASSWORD:app-pay}
  mock:
    # enabled by default for local development (closes the M1 mock channel loop); the container shape tightens this in application-docker/test.yaml
    enabled: true
  order:
    # payment deadline for CREATED orders (minutes); on timeout OrderTimeoutJob closes the order
    timeout-minutes: 30
    # per-user cap on unpaid orders: checked before placing an order, over the limit returns 429 (prevents order-spam from occupying the DB)
    max-open-per-user: 10
  alipay:
    # sandbox gateway (friendly for local integration); production overrides this with the real gateway in application-docker.yaml
    enabled: ${ALIPAY_ENABLED:false}
    gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
    app-id: ${ALIPAY_APP_ID:}
    # application private key (generated by the merchant key tool, signs requests)
    app-private-key: ${ALIPAY_APP_PRIVATE_KEY:}
    # Alipay public key (provided by the platform console's "interface signing mode"; verifies platform responses/callbacks -- not the application public key you generated)
    platform-public-key: ${ALIPAY_PLATFORM_PUBLIC_KEY:}
    # publicly reachable async notification URL; leave empty = do not rely on callbacks, rely mainly on ChannelQueryJob querying
    notify-url: ${ALIPAY_NOTIFY_URL:}
    # timeout of the SDK's built-in HTTP client (does not use RestClient, so global spring.http.client.* has no effect on it)
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
  test:
    # enabled by default in the local development shape (base means "developer = tester"); the production container pins it off via the docker profile.
    # controls: /test/pay/* endpoints + root path redirect to the console
    enabled: true
    token: ${PAY_TEST_TOKEN:}
    # local development allows an empty token (loopback + the switch is the gate); the container profile enforces a token
    require-token: false
  internal:
    # executor callback token: when non-empty, /internal/pay/timeout/execute enforces the query token;
    # the token is delivered via the registered executor_url query string (app-task POSTs it as-is, no change needed).
    executor-token: ${PAY_EXECUTOR_TOKEN:}
  refund:
    # M4 refund reversal: controlled by the internal endpoint (key-auth); maxDaysBack limits the refund window
    enabled: true
    max-days-back: 365
  apptask:
    # timeout delegation registration (plan/1.0.8): after the order transaction commits, register a precise
    # timed task with app-task; registration failure does not block the order and fallback polling takes over.
    # In local development APISIX is reachable through the host port.
    # executor-base-url changed to https along with server-side HTTPS (app-task validates the callback via the CA certificate)
    base-url: ${APPTASK_BASE_URL:http://127.0.0.1:9080}
    consumer-key: ${APISIX_CONSUMER_KEY:mindbase-internal-key-change-me}
    register-enabled: true
    executor-base-url: ${PAY_EXECUTOR_BASE_URL:https://127.0.0.1:8002}
  job:
    # executor concurrency self-limits: worker count is anchored to the DB connection pool (Hikari 10 -> 8); a full queue fails fast with 503
    executor-workers: 8
    executor-queue-capacity: 10000
    # fallback polling (JitteredBackoffTrigger): base + empty-run backoff cap; query does not back off (missing orders need timeliness)
    timeout-base-seconds: 120
    timeout-cap-seconds: 600
    delivery-base-seconds: 60
    delivery-cap-seconds: 300
    query-base-seconds: 60
    # scheduler thread pool >1: a slow job (serial outbound channel queries) must not block order closing/delivery compensation
    scheduler-pool-size: 4
    # cross-instance job lease TTL (mutual exclusion across replicas; automatically takeover-able on expiry)
    lease-ttl-seconds: 900
    # reconciliation job: base interval + look-back window
    recon-base-seconds: 3600
    recon-window-hours: 24

# The logging system (runtime logs + fund audit JSONL) is configured uniformly in logback-spring.xml,
# including traceId/uid MDC injection; the pattern is not redefined here.

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # funds service: an unavailable DB must report DOWN (a liveness probe that does not probe dependencies = false health)
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
  metrics:
    tags:
      application: app-pay
