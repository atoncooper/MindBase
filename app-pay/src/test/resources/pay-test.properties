# ============================================================
# app-pay security/performance test configuration (Java, src/test)
# ============================================================
# Usage:
#   1) Start the standalone test environment:
#        cd app-pay
#        mvn -DskipTests package
#        docker compose -f docker-compose.test.yml up -d --build
#   2) Run security tests:
#        mvn test -Dtest=PaySecurityTest
#   3) Run performance tests (edit perf.enabled=true below first):
#        mvn test -Dtest=PayPerformanceTest
#
# This file is the single source of truth for the test client.
# Values are read directly from this file: no environment variables,
# no -D overrides, no external config file. Edit and rerun mvn test.
#
# Server-side tuning (Tomcat threads, Hikari pool, buffers, etc.)
# lives in app-pay/config-test.yaml; restart app-pay-test after editing.
#
# File encoding: UTF-8 (no BOM). Keep comments in English/ASCII.
# ============================================================

# ---- master switch (false = skip all security/performance tests) ----
pay.test.enabled=true

# ---- target service (standalone docker compose test environment) ----
pay.base-url=https://127.0.0.1:18002
# token for /test/pay/* (config-test.yaml: pay.test.token)
pay.test-token=pay-test-token
# server-side key for /internal/pay/* (config-test.yaml: pay.internal.api-key)
pay.internal-key=pay-test-internal-key
# executor token for /internal/pay/timeout/execute (config-test.yaml: pay.internal.executor-token)
pay.executor-token=pay-test-executor-token

# ---- HTTP client (load-test concurrency/timeouts/connection pool) ----
# connect timeout in milliseconds
http.connect-timeout-ms=2000
# per-request timeout in milliseconds
http.request-timeout-ms=10000
# HttpClient selector/callback threads (separate from perf.threads)
http.client-threads=32
# HTTP version: HTTP_1_1 (default, easier to observe connection reuse) or HTTP_2
http.version=HTTP_1_1
# test environment uses a self-signed certificate; true = trust all (test only)
http.tls-insecure=true
# disable JDK HttpClient hostname verification (needed for self-signed/aliases)
http.disable-hostname-verification=true
# connection pool limit (0 = JDK default/unlimited); maps to jdk.httpclient.connectionPoolSize
http.max-connections=0
# keep-alive timeout in seconds (0 = JDK default); maps to jdk.httpclient.keepalive.timeout
http.keep-alive-seconds=0
# retries per request on connection/timeout errors (0 = disabled; retries are reported separately)
http.max-retries=0

# ---- service metrics (actuator / Prometheus) ----
# sample CPU/heap/GC/Hikari/Tomcat metrics during the load phase
metrics.enabled=true
# scrape interval in seconds
metrics.interval-seconds=5
# fresh TCP/TLS connection probes before the load phase (connect + handshake timings)
metrics.connection-probe-samples=3

# ---- security tests ----
security.enabled=true

# ---- performance tests (disabled by default; set true to run load test) ----
perf.enabled=true
# scenario: read / write / mixed / user-write / cache-miss / hot-key
#   read       = public products + internal membership
#   write      = test-entry create + mock pay
#   mixed      = 2 reads + 1 write
#   user-write = real user path create (X-Uid) + mock confirm
#   user-read  = real user path order list (X-Uid) + order detail
#   cache-miss = random non-existent order numbers (404 expected; cache penetration)
#   hot-key    = same existing order from all clients (cache breakdown)
perf.scenario=user-write
# number of load-test worker threads (increase gradually to find the knee)
perf.threads=50
# warmup seconds (0 = skip; warmup samples are discarded)
perf.warmup-seconds=30
# warmup threads (default 1; avoid saturating the service immediately)
perf.warmup-threads=30
# measurement duration in seconds
perf.duration-seconds=120
# allowed error rate (non-2xx / timeout / exception); test fails above this
perf.max-error-rate=1.0
# warn when valid samples are below this value (p99.9 needs ~10k+ samples)
perf.min-samples=1000
# progress log interval in seconds (prints requests/errors/rps during the run)
perf.log-interval-seconds=10
# max number of error samples logged per phase (aggregate counts are always complete)
perf.max-logged-errors=10
# latency thresholds in milliseconds (0 = do not check)
perf.threshold-p50-ms=100
perf.threshold-p99-ms=300
perf.threshold-p999-ms=800
# fail the test when a threshold is exceeded; false = report only
perf.assert-thresholds=false
# minimum QPS target (0 = disabled)
perf.min-qps=0
# minimum OPS target, successful HTTP operations/sec (0 = disabled)
perf.min-ops=0
# p95 latency threshold in milliseconds (0 = disabled)
perf.threshold-p95-ms=250
# p99.99 latency threshold in milliseconds (0 = disabled)
perf.threshold-p9999-ms=2000
# availability target percentage (99.9 / 99.99; 0 = disabled)
perf.availability-target=99.9
# optional concurrency ramp for saturation, e.g. 10,20,50,100 (empty = single run)
perf.ramp-threads=50,80,100,120
# duration of each ramp step in seconds
perf.ramp-step-seconds=30
# extra request-body padding bytes for the write scenario (buffer/body-limit testing)
perf.payload-padding-bytes=0