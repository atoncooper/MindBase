<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>app-task 控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a73e8'/%3E%3Cpath d='M9 16l5 5 9-10' stroke='white' stroke-width='3.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div id="app">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="7" fill="#1a73e8"/><path d="M9 16l5 5 9-10" stroke="white" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="brand-text">
        <div class="brand-title">app-task</div>
        <div class="brand-sub">任务调度控制台</div>
      </div>
    </div>
    <nav class="nav">
      <a class="nav-item" data-route="#/" href="#/">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        <span>仪表盘</span>
      </a>
      <a class="nav-item" data-route="#/tasks" href="#/tasks">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 5h18v3H3V5zm0 5h18v3H3v-3zm0 5h18v3H3v-3z"/></svg>
        <span>任务管理</span>
      </a>
      <a class="nav-item" data-route="#/logs" href="#/logs">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM8 12H4V8h4v4zm12 0h-8V8h8v4zm0 4H4v-2h16v2z"/></svg>
        <span>执行日志</span>
      </a>
      <a class="nav-item" data-route="#/scripts" href="#/scripts">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0 4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
        <span>Lua 脚本</span>
      </a>
      <a class="nav-item" data-route="#/emails" href="#/emails">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
        <span>邮件队列</span>
      </a>
      <a class="nav-item" data-route="#/users" href="#/users" id="nav-users" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        <span>账户</span>
      </a>
    </nav>
    <div class="sidebar-foot">
      <div id="svc-status" class="svc-status">
        <span class="dot"></span><span id="svc-status-text">连接中…</span>
      </div>
      <div class="svc-version" id="svc-version"></div>
    </div>
  </aside>

  <!-- 主区域 -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-title" id="page-title">仪表盘</div>
      <div class="topbar-actions">
        <span class="user-chip" id="current-user" title="当前登录账户"></span>
        <label class="switch-label" title="每 10 秒自动刷新当前页面">
          <input type="checkbox" id="auto-refresh">
          <span class="switch"></span>
          <span>自动刷新</span>
        </label>
        <button class="btn" id="btn-refresh">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          <span>刷新</span>
        </button>
        <button class="btn" id="btn-logout" title="清除登录会话并返回登录界面">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
          <span>退出</span>
        </button>
      </div>
    </header>
    <main id="main" class="content">
      <div class="loading">加载中…</div>
    </main>
  </div>
</div>

<!-- 任务创建弹窗 -->
<div id="task-modal" class="overlay">
  <div class="modal wide">
    <div class="modal-head">
      <h2>新建任务</h2>
      <button class="icon-btn modal-close" data-close="task-modal">&times;</button>
    </div>
    <form id="task-form" class="form-grid">
      <label>uid（属主）<input type="number" name="uid" value="0" step="1"></label>
      <label>任务类型
        <select name="task_type">
          <option value="http">http</option>
          <option value="lua">lua</option>
        </select>
      </label>
      <label>executor_url<input type="text" name="executor_url" placeholder="http://exec:9000/run"></label>
      <label class="check"><input type="checkbox" name="async"> 异步（202 + 回调）</label>
      <label>cron 表达式<input type="text" name="cron_expr" placeholder="5 段，如 0 23 * * *（留空=一次性）"></label>
      <label>触发时间<input type="datetime-local" name="trigger_time"></label>
      <label>max_retry<input type="number" name="max_retry" value="0" step="1" min="0"></label>
      <label>weight<input type="number" name="weight" value="1" step="1" min="1"></label>
      <label class="span2">payload（JSON，透传给执行器）
        <textarea name="payload" rows="6" spellcheck="false" placeholder='{"key": "value"}'></textarea>
      </label>
      <div class="modal-actions span2">
        <button type="button" class="btn" data-close="task-modal">取消</button>
        <button type="submit" class="btn primary">创建任务</button>
      </div>
    </form>
  </div>
</div>

<!-- 脚本编辑弹窗 -->
<div id="script-modal" class="overlay">
  <div class="modal wide">
    <div class="modal-head">
      <h2 id="script-modal-title">新建脚本</h2>
      <button class="icon-btn modal-close" data-close="script-modal">&times;</button>
    </div>
    <form id="script-form" class="form-grid">
      <label>script_id<input type="text" name="script_id" required maxlength="64" placeholder="如 notify_quiz"></label>
      <label>名称<input type="text" name="name" required maxlength="128"></label>
      <label>描述<input type="text" name="description" maxlength="512"></label>
      <label class="check"><input type="checkbox" name="enabled" checked> 启用</label>
      <label class="span2">Lua 源码（上传即编译为新版本，立即生效）
        <textarea name="source" rows="14" spellcheck="false" class="mono"></textarea>
      </label>
      <div class="modal-actions span2">
        <button type="button" class="btn" data-close="script-modal">取消</button>
        <button type="submit" class="btn primary" id="script-save-btn">保存脚本</button>
      </div>
    </form>
  </div>
</div>

<!-- 添加账户弹窗（仅 admin） -->
<div id="user-modal" class="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2>添加账户</h2>
      <button class="icon-btn modal-close" data-close="user-modal">&times;</button>
    </div>
    <form id="user-form" class="form-grid">
      <label>用户名<input type="text" name="username" required minlength="2" maxlength="64" placeholder="如 zhang"></label>
      <label>角色
        <select name="role">
          <option value="member">member</option>
          <option value="admin">admin</option>
        </select>
      </label>
      <label class="span2">密码（至少 8 位）<input type="password" name="password" required minlength="8" maxlength="128"></label>
      <div class="modal-actions span2">
        <button type="button" class="btn" data-close="user-modal">取消</button>
        <button type="submit" class="btn primary">创建</button>
      </div>
    </form>
  </div>
</div>

<!-- 修改密码弹窗（仅 admin） -->
<div id="pwd-modal" class="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="pwd-modal-title">修改密码</h2>
      <button class="icon-btn modal-close" data-close="pwd-modal">&times;</button>
    </div>
    <form id="pwd-form" class="form-grid">
      <label class="span2">新密码（至少 8 位）
        <input type="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password">
      </label>
      <div class="modal-actions span2">
        <button type="button" class="btn" data-close="pwd-modal">取消</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="/assets/app.js"></script>
</body>
</html>
