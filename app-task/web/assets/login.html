<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · app-task 控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a73e8'/%3E%3Cpath d='M9 16l5 5 9-10' stroke='white' stroke-width='3.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --primary: #1a73e8; --primary-dark: #1765cc;
  --bg: #f1f3f4; --surface: #ffffff; --border: #dadce0;
  --text: #202124; --text-2: #5f6368; --red: #d93025;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  font-size: 14px; color: var(--text); background: var(--bg);
  display: flex; align-items: center; justify-content: center;
}
.card {
  width: 360px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 36px 32px 28px;
  box-shadow: 0 1px 3px rgba(60,64,67,.15), 0 1px 2px rgba(60,64,67,.1);
}
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.brand-title { font-size: 15px; font-weight: 600; }
.brand-sub { font-size: 12px; color: var(--text-2); }
h1 { font-size: 20px; margin-bottom: 6px; }
.hint { color: var(--text-2); font-size: 13px; line-height: 1.6; margin-bottom: 18px; }
input {
  width: 100%; height: 40px; padding: 0 12px; font-size: 14px;
  border: 1px solid var(--border); border-radius: 6px; outline: none;
}
input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(26,115,232,.15); }
button {
  width: 100%; height: 40px; margin-top: 16px; font-size: 14px; font-weight: 500;
  color: #fff; background: var(--primary); border: none; border-radius: 6px;
  cursor: pointer;
}
button:hover { background: var(--primary-dark); }
button:disabled { opacity: .6; cursor: default; }
.err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="7" fill="#1a73e8"/><path d="M9 16l5 5 9-10" stroke="white" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div>
      <div class="brand-title">app-task</div>
      <div class="brand-sub">任务调度控制台</div>
    </div>
  </div>
  <h1>登录控制台</h1>
  <p class="hint">请输入管理员账户（连续失败会被限流）。默认账户：admin</p>
  <form id="login-form">
    <input type="text" id="username" placeholder="用户名" autocomplete="username" autofocus style="margin-bottom:10px">
    <input type="password" id="password" placeholder="密码" autocomplete="current-password">
    <button type="submit" id="btn">登录</button>
    <div id="err" class="err"></div>
  </form>
</main>
<script>
'use strict';
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) { err.textContent = '请输入用户名和密码'; return; }
  btn.disabled = true;
  err.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (res.status === 429) throw new Error('尝试过于频繁，请 1 分钟后再试');
    if (res.status === 401) throw new Error('用户名或密码不正确');
    if (!res.ok) throw new Error('登录失败：HTTP ' + res.status);
    location.href = '/'; // session cookie is set; the console page serves only to sessions
  } catch (ex) {
    err.textContent = ex.message;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
