# =============================================================================
# app-ts 分层配置（仓库默认值）
# 加载顺序（后者覆盖前者）：default.yaml → config.yaml(可选) → local.yaml(个人, gitignored) → 环境变量(最高)
# 环境变量命名规则：段__键（camelCase 自动转 SNAKE），如 milvus.address → MILVUS__ADDRESS
# 敏感值用 ${VAR} 占位符引用 .env（支持 ${VAR:默认值}）；.env 只放密钥/连接串。
# 红线：换 embedding 模型 = Milvus 全量重建；timezone 变更 = Milvus 分区命名漂移。
# =============================================================================

server:
  host: 0.0.0.0
  # 8000 = the port the retired Python backend owned; app-ts inherits it
  port: 8000
  # 内部全链路 HTTPS（阶段二）：enabled=true 时 Fastify 以 TLS 直服同一端口
  # （证书由 compose 挂载 secrets/certs/app-ts → /app/certs:ro）。
  # 环境变量覆盖：SERVER__TLS__ENABLED / SERVER__TLS__CERT / SERVER__TLS__KEY
  tls:
    enabled: false
    cert: /app/certs/server.crt
    key: /app/certs/server.key

redis:
  # 事件订阅（bili:page_ready → 视频分P向量化）。留空 = 不订阅（离线运行）。
  url: ${REDIS__URL:}

appBili:
  # 获取域服务（Go）：ASR 委派 + 用户收藏夹 scope 只读（internal M2M）
  # 内部全链路 HTTPS：app-user:8006 为 TLS 监听，按 compose DNS 名校验证书
  baseUrl: https://app-user:8006
  apiKey: ${APISIX_CONSUMER_KEY}
  timeoutMs: 30000
  cacheTtlMs: 30000

appTask:
  # app-task 调度服务（任务注册 /internal/task 回调 /internal/email/send；经 APISIX key-auth）
  # 内部全链路 HTTPS：APISIX 9443 TLS 监听（9080 明文口不再使用）
  baseUrl: https://apisix:9443
  apiKey: ${APISIX_CONSUMER_KEY}
  timeoutMs: 15000

appAuth:
  # 认证服务内部用户查询（/internal/auth/user/{uid}，apikey 守卫）
  # 内部全链路 HTTPS：app-user:8006 为 TLS 监听
  baseUrl: https://app-user:8006
  apiKey: ${APISIX_CONSUMER_KEY}
  timeoutMs: 5000

appUserSettings:
  # app-user settings 监听口（8015）：Coding Plan 内部 M2M
  # GET /internal/settings/coding-plan/{uid}（apikey 守卫；Coding Plan 属设置域）
  # 内部全链路 HTTPS：app-user:8006 为 TLS 监听
  baseUrl: https://app-user:8006
  apiKey: ${APISIX_CONSUMER_KEY}
  timeoutMs: 5000

appCloud:
  # 云盘文档智能读取（/internal/cloud/summary，apikey 守卫）；uid 只经 X-Uid
  # 与查询参数下发，永不出现在 LLM 可写参数里
  # 内部全链路 HTTPS：app-cloud:8007 本身为 TLS 监听（阶段二）
  baseUrl: https://app-cloud:8007
  apiKey: ${APISIX_CONSUMER_KEY}
  timeoutMs: 8000

taskQuiz:
  # 定时出题：agent 对话（/task-quiz/chat）+ 注册（/task-quiz/register）
  # + app-task 执行器回调（/internal/quiz/generate-llm|status）
  enabled: true
  sourceDatabase: mind_base          # 共享 Mongo 库（app-content quiz 面读取同一集合）
  docCollection: task_quiz_questions
  # 内部全链路 HTTPS：经 APISIX 9443 TLS 监听
  executorUrl: https://apisix:9443/internal/quiz/generate-llm
  genRetries: 3

minio:
  # 技能 zip 存储（skills/{uid}/{skill_id}.zip；空 endpoint = skills 关闭）
  endpoint: http://minio:9000
  # 聊天图片展示 URL 的前缀 base（/minio-proxy/ 由 nginx 代理到 minio:9000 并
  # 回写 Host，签名按内网 endpoint 计算）；空 = 同源相对路径（生产 nginx 即同源）
  publicEndpoint: ""
  accessKey: ${MINIO__ACCESS_KEY:}
  secretKey: ${MINIO__SECRET_KEY:}
  bucket: ${MINIO__BUCKET:drive-videos}
  secure: false

skills:
  enabled: true
  storeApiUrl: https://api.github.com
  storeTopic: mindbase-skill
  storeApiKey: ${SKILL_STORE_API_KEY:}

vectorize:
  # 视频分P向量化管线（bili:page_ready 消费 + /vec/page/*）
  enabled: true
  concurrency: 2          # 同时跑管线任务的分P数
  asrTimeoutMs: 720000    # 委派 app-user ASR 的总超时（转写 + 轮询余量）
  pollIntervalMs: 3000

aiGateway:
  # OpenAI 兼容面（LLM / embedding）；nativeBaseURL 由 baseUrl 派生（去尾 /v1 加 /api/v1）
  # 内部全链路 HTTPS：higress 8443 TLS（阶段二 TLS 前置/自身 TLS）。保留环境变量
  # 占位逻辑：AI_GATEWAY__BASE_URL 覆盖（loader 亦按同名 env 覆盖该叶子）
  baseUrl: ${AI_GATEWAY__BASE_URL:https://higress:8443/v1}
  apiKey: ${AI_GATEWAY__API_KEY}

llm:
  # 主对话模型（经 Higress 网关路由）。GLM-5.3-flash 支持视觉（图片消息）；
  # 旧默认 qwen3-max 为纯文本模型，收到图片只会回「无法看到图片」。
  model: z-ai/glm-5.3-flash
  # 出题等后台结构化输出任务。2026-10-12：qwen3-max 被 OpenRouter 下线（404 deprecation，
  # 曾导致出题全批次失败「有效题目数量为 0」），全部 LLM 统一收敛到 GLM-5.3-flash。
  # 注意：GLM-5.3-flash 是思考型模型，reasoning 消耗输出预算，调用侧需给足 max tokens。
  quizModel: z-ai/glm-5.3-flash
  temperature: 0.7

embedding:
  model: text-embedding-v4
  dimension: 1024
  batchSize: 10

rerank:
  enabled: true
  model: gte-rerank-v2
  timeoutMs: 30000
  topN: 30
  minRelevanceScore: 0

milvus:
  address: milvus:19530
  token: ${MILVUS__TOKEN}
  # app-ts 独立新库，与 Python/Go 后端数据隔离
  database: mind_base_ts
  collection: bilibili_videos
  # 云盘 collection（与视频 collection 并行检索；需独立灌库）
  cloudCollection: cloud_drive
  # hybrid 检索（BM25 sparse + dense，RRF 融合；Milvus 2.5+；切换会改 schema）
  hybridSearch: false
  dimension: 1024
  indexType: IVF_FLAT
  metricType: COSINE
  nlist: 1024
  nprobe: 16
  useMonthlyPartitions: false
  # Milvus gRPC over TLS (server-side TLS enforced; certs issued by the shared dev CA)
  ssl: ${MILVUS__SSL:-false}
  # dev CA path for verifying the Milvus server cert (docker: /app/certs/dev-ca.crt)
  tlsRootCert: ${MILVUS__TLS__ROOT_CERT:-}
  # SNI / cert SAN to verify against (cert SANs carry the docker service alias)
  tlsServerName: ${MILVUS__TLS__SERVER_NAME:-milvus}

mongo:
  uri: ${MONGO__URI}
  database: mind_base_ts
  timeoutMs: 5000
  # Mongo 适配器实现：mikro = MikroORM（EntitySchema，学术 evidence 试点），
  # driver = 直接 mongodb 驱动。MikroORM 初始化失败会自动回退到 driver。
  orm: ${MONGO__ORM:mikro}
  sessionsCollection: chat_sessions
  messagesCollection: chat_messages

kg:
  # false = 不注册 kg_search 工具与 /knowledge/kg/* 路由（app-kg 未部署时优雅降级）
  enabled: true
  # 实体向量 collection（app-ts 独立库 mind_base_ts 内；与 Python 的 mind_base.kg_entities 互不相通）
  collectionName: kg_entities
  # 抽取模型（经 Higress 网关，purpose=kg）；与全局统一 GLM-5.3-flash
  extractModel: z-ai/glm-5.3-flash
  # 成本护栏：单分P 送 LLM 的正文上限
  maxTextChars: 8000
  seedTopN: 5
  linkScoreThreshold: 0.55
  maxHops: 2
  expandLimitPerHop: 50
  evidenceLimit: 100
  concurrency: 2
  pageBatchSize: 50
  # ASR 正文源 = Python 后端的 Mongo 库（跨库只读——源数据归 bili 域所有）
  sourceDatabase: mind_base
  sourceCollection: asr_documents
  # 云盘知识点：单次构建最多处理的文档数（分页拉取到该上限即停止）
  cloudMaxDocs: 200
  # 云盘文档列表分页大小（app-cloud /internal/cloud/kg/documents 单页上限 100）
  cloudListPageSize: 50

toolsStub:
  # false = 不注册 list_videos/get_video_summaries（VideoMetaRepository 还是内存假数据；
  # 视频知识库回灌 + 真元数据接入后再开）
  videoMeta: false

appPay:
  # 会员档位查询（app-pay 经 APISIX key-auth 内部路由 /internal/pay/*；
  # 对齐 app-cloud quota.go 的消费模式：TTL 缓存 + fail-open free）
  # 内部全链路 HTTPS：经 APISIX 9443 TLS 监听
  baseUrl: https://apisix:9443/internal/pay
  apiKey: ${APISIX_CONSUMER_KEY}
  timeoutMs: 2000
  # 成功档位缓存 TTL（实际按 ±15% 抖动过期，错峰回源避免缓存雪崩）
  cacheTtlMs: 60000
  # 回源失败（网络/非 200/未配置 key）的短缓存 TTL：支付服务恢复后最多 10s
  # 即回到权威档位；不能沿用 60s，否则支付成功后 60s 内仍按 free 档可见/限额。
  failureCacheTtlMs: 10000

appQuiz:
  # app-content（quiz 面）存储写面（经 APISIX key-auth 内部路由 /internal/quiz/*）
  # 内部全链路 HTTPS：经 APISIX 9443 TLS 监听
  baseUrl: https://apisix:9443/internal/quiz
  apiKey: ${APISIX_CONSUMER_KEY}
  timeoutMs: 15000

kgGrpc:
  # false = KG 能力整体关闭（app-kg 未部署时不注册工具与路由）
  enabled: true
  # app-kg（Go）gRPC 数据面
  target: app-kg:8013
  # 共享 proto 契约（运行时加载，无代码生成）
  protoPath: proto/kg/v1/kg.proto
  timeoutMs: 15000
  # 出站 gRPC TLS（阶段二）：enabled=true → credentials.createSsl(caFile) 校验证书；
  # false → createInsecure()（本地明文开发默认）。
  # 环境变量覆盖：KG_GRPC__TLS__ENABLED / KG_GRPC__TLS__CA_FILE
  tls:
    enabled: false
    caFile: /etc/ssl/certs/ca-certificates.crt

contentMcp:
  # 内容域 MCP 合并服务 app-content-mcp（plan/1.0.20）：board 6 + note 4 + quiz 2
  # 共 12 个工具走同一个 /mcp 端点（单 module / 单镜像 / 单容器 / 单端口 8019）。
  # false = 三域工具全部不注册（app-content-mcp 未部署时优雅降级：笔记保存、
  # quiz 落库、board 工具均不可用；无直连回落）。
  enabled: true
  # app-content-mcp streamable-http 端点（容器内由 CONTENT_MCP__URL 覆盖为
  # https://app-content-mcp:8019/mcp；该服务已开 TLS）
  url: https://app-content-mcp:8019/mcp
  # 服务模式 apikey（uid 走请求头 X-Uid，永不进 LLM 参数）
  apiKey: ${CONTENT_MCP__API_KEY}
  # 外部宿主模式（与 apiKey 二选一）
  bearerToken: ${CONTENT_MCP__BEARER_TOKEN}
  timeoutMs: 30000
  # 桥接工具输出送入 LLM 上下文的截断上限（board 文档体量大）
  maxContentChars: 8000
  # /chat/board/complete 的模型覆盖（留空 = llm.model）
  completionModel: ${CONTENT_MCP__COMPLETION_MODEL:}

sandbox:
  # 代码执行沙箱控制层（app-sandbox，plan/1.0.18 §十）。false = run_code 使用
  # NoopCodeExecution 诚实降级（不联网，明确告知代码未实际运行）。
  # 环境变量覆盖（loader 的 SECTION__KEY 机制）：SANDBOX__ENABLED /
  # SANDBOX__BASE_URL / SANDBOX__API_KEY / SANDBOX__TIMEOUT_MS / SANDBOX__POLL_INTERVAL_MS
  enabled: false
  # app-sandbox 控制层基址：经 APISIX key-auth 内部路由 /internal/sandbox/*（网关重写
  # 为 /* 后到达 app-sandbox:8017，见 plan §四）
  # 内部全链路 HTTPS：经 APISIX 9443 TLS 监听
  baseUrl: https://apisix:9443/internal/sandbox
  # M2M 共享 key：apikey 供 APISIX key-auth、X-API-Key 供 app-sandbox 自校验
  apiKey: ${APISIX_CONSUMER_KEY}
  # 本地总预算（创建 + 轮询）；单次执行预算由 run_code 的 timeoutMs 传给沙箱
  timeoutMs: 60000
  # 执行状态轮询间隔
  pollIntervalMs: 500

tempFiles:
  # AI 解析文档的本地临时文件（下载 → 本地临时文件 → 解析 → 整个 agent 回合结束
  # 由程序删除；工具/模型没有任何删除接口）。目录结构：
  #   <dir>/u-<sha256(uid|anon)[:16]>/turn-<requestId>/<uuid>.<ext>
  # 原始文件名只作展示，绝不拼进路径；目录 0700、文件 0600。
  # 预算与 fd 上限：单轮文件数/字节、单文件大小、全局文件数、并发写入数；
  # 启动 + 定期 sweep 清理崩溃残留（仅程序生命周期可删）。
  # 环境变量覆盖：TEMP_FILES__*（loader 自动派生）或 TEMPFILES__*（别名，二者都支持）。
  enabled: true
  # 空 = os.tmpdir()/mindbase-agent；容器内 /tmp 必须可写（tmpfs/noexec 均可）。
  dir: ""
  maxFilesPerTurn: 4                 # 单轮最多 4 个临时文件
  maxBytesPerTurn: 67108864          # 单轮最多 64MB
  maxFileBytes: 20971520             # 单文件最多 20MB（与文档解析上限一致）
  maxGlobalFiles: 32                 # 全进程同时存在的临时文件数上限（防 fd 耗尽）
  maxConcurrentWrites: 8             # 全进程同时写入的临时文件数上限
  staleTtlMs: 21600000               # 残留目录过期时间 6h（远大于单轮时长）
  sweepIntervalMs: 600000            # 定期 sweep 间隔 10min（0 = 关闭定时器）

search:
  defaultK: 8

web:
  # 单页抓取大小上限（字节）与重定向跳数
  maxBytes: 2097152
  maxRedirects: 5
  userAgent: "MindBaseBot/0.1 (knowledge-base assistant)"
  # 礼貌间隔：同宿主两次请求的最小间隔（真实等待；0 = 关闭）
  perHostIntervalMs: 1000
  # 联网搜索源（web_search 工具引擎链：tavily → searxng → baidu → bing）。
  # 数据中心 IP 裸爬会被百度风控/Bing 降级——生产建议配置其一：
  #   TAVILY_API_KEY  注册 tavily.com（免费 1000 次/月）；
  #   SEARXNG_URL     自托管 SearXNG（需开启 json format）。
  searchTavilyApiKey: ${TAVILY_API_KEY:}
  searchSearxngUrl: ${SEARXNG_URL:}
  # DeepSeek 官方网页搜索/抓取 API（https://api-docs.deepseek.com/zh-cn/guides/search）。
  # 默认由 DeepSeek 提供：web_search 引擎链首位；fetch_webpage 官方代抓（云端渲染返回
  # Markdown），DeepSeek 不可用/失败时才回退自研抓取（SSRF 防护/礼貌限速/站内链接）。
  # 计费：¥5/1000 次成功请求（失败/空结果不计费）；限速 Search 100 QPS / Fetch 25 QPS。
  deepseekApiKey: ${DEEPSEEK_API_KEY:}
  deepseekApiBaseUrl: https://api.deepseek.com
  deepseekFetchPrimary: true

tools:
  # 模型未传 timeoutMs 时的默认预算
  defaultTimeoutMs: 60000
  # 钳制下限（防 0/极小值滥用）
  minTimeoutMs: 1000
  # 钳制上限（manager 永不接受超过 1 小时）
  maxTimeoutMs: 3600000
  # 全局并发工具执行上限（保护 Milvus/Mongo/网关不被并发请求打挂）
  maxConcurrent: 8
  # 有界排队：等槽位超过该时长即快速失败（浅队列，不做深排队）
  queueWaitMs: 5000
  # 工具级熔断：连续失败/超时达到阈值即开闸
  breakerThreshold: 5
  breakerCooldownMs: 30000

agent:
  maxSteps: 10
  # 按 agent 覆盖 ReAct 步数（未列出的用 maxSteps）；对齐桌面端：note 5 / code 4 /
  # quiz 12 / board 6。学术能力已并入 main agent，不再有 academic 子 agent。
  maxStepsByAgent:
    note: 5
    code: 4
    quiz: 12
    board: 6
  routingTimeoutMs: 3000
  circuitFailureThreshold: 3
  circuitCooldownMs: 30000
  # 可重试错误（超时/限流/5xx）触发的整轮重试次数（reset 帧后重新生成）
  turnRetries: 1
  # 同一工具+同参数在一轮内第 N 次调用被拒绝（防绕圈烧 token）
  toolRepeatLimit: 3
  # 整轮硬超时（毫秒）：LLM 流卡死时兜底中止，避免会话锁与请求永久挂起。
  # 30 分钟：普通问答远用不到，但给长任务（沙箱/长委托）留足余量。
  turnTimeoutMs: 1800000
  # Planner/Supervisor DAG（主 agent 产计划 → 拓扑执行 → 自定义 ReAct agent 节点）。
  plan:
    enabled: true
    maxAgents: 6
    maxNodes: 12
    maxConcurrency: 3
    customAgentMaxSteps: 6
    nodeTimeoutMs: 600000
    # 节点验收失败后带 critique 重跑一次；0 = 不反思
    reflectAttempts: 1
    reflectTimeoutMs: 15000
    # 自定义 agent 只能派发一层，禁止递归生成 agent
    maxDepth: 1
    allowedTools:
      - vector_search
      - list_videos
      - get_video_summaries
      - web_search
      - fetch_webpage
      - cloud_doc_summary
      - cloud_semantic_search
      - save_note
      - list_notes
      - get_note
      - kg_search

scheduling:
  # 问答 turn 级加权排队（与 tools.maxConcurrent 的工具级闸门分层：本段限制
  # "同时执行的轮数"，满员后按会员权重排队，等待超时报错结束本轮）
  enabled: true
  # 全局同时执行的问答轮数上限
  maxConcurrent: 5
  # 排队上限：队满立即拒绝（不排队，直接报"系统繁忙"）
  queueMaxSize: 100
  # 排队等待上限：超过即报错结束本轮（须小于网关/代理的读超时）
  queueTimeoutMs: 60000
  # 会员权重（SVIP > VIP > free），同级按先后顺序；tier 由 utils/membership.ts
  # 实时解析（app-pay /internal/pay/membership/{uid}，60s TTL 缓存 + fail-open free）
  tierWeights: { free: 0, vip: 100, svip: 200, promax: 300 }
  # 防饿死：每等待该时长，有效权重 +agingStep（低权重长等者可越过晚到的高权重者）
  agingWindowMs: 30000
  agingStep: 10
  # 流式排队进度帧（type=queue）下发间隔
  queueFrameIntervalMs: 2000

chunk:
  targetSize: 750
  minSize: 300
  maxSize: 900
  overlap: 100

log:
  # 逻辑服务名（每条日志的 service 字段；容器内可用 LOG__SERVICE 覆盖）
  service: app-ts
  level: info
  # stdout 始终输出 JSON 行（容器日志采集）；fileEnabled=true 时再写文件
  fileEnabled: true
  # 文件 sink 目录/文件名（容器内由 compose 注入 LOG__DIR=/app/logs）
  dir: logs
  fileName: app-ts.log
  # rotating-file-stream：按大小/时间轮转 + gzip 压缩 + 保留上限
  # （env：LOG__ROTATION__{ENABLED,SIZE,INTERVAL,MAX_FILES,COMPRESS}）
  rotation:
    enabled: true
    size: 20M
    interval: 1d
    maxFiles: 14
    compress: gzip
  # 访问日志（onResponse 结构化记录）与慢请求阈值
  # （env：LOG__ACCESS_LOG__{ENABLED,SLOW_REQUEST_MS}）
  accessLog:
    enabled: true
    slowRequestMs: 3000

rateLimit:
  # /chat/ask/stream 每 IP 滑动窗口限流（LLM 端点昂贵）
  windowMs: 60000
  max: 20

quota:
  # ── 统一 AI 额度（token 口径，不是条数）────────────────────────────────
  # 产品参照 Codex / Claude Code / Kimi / 豆包：
  #   · 三层窗口：滚动 5 小时 + 自然日 + 自然月（上海时区）；
  #   · 所有 AI 能力共享一个额度池；聊天按真实 usage，其他能力按估算扣减；
  #   · 额度单位 = 标准 token，按模型单价归一（贵模型每个真实 token 扣更多）；
  #   · 订阅价值放大：¥48 VIP ≈ ¥480 等值（默认 planBonus=10）；SVIP ¥148、ProMax ¥248。
  # 失败方向：Redis 不可用 → 放行（可用性优先）；app-pay 不可用 → tier=free（防超卖）。
  enabled: true
  # 标准 token 参考价（元/百万 token）；模型权重 = 模型单价 / 该值
  referencePricePerMTok: 10
  # 订阅权益倍率：额度价值 = 价格 × planBonus（1 = 不放大；10 = 48 元档给 480 元等值）
  planBonus: 10
  # 5 小时滚动窗口：60 个 5 分钟桶求和（误差 ≤ bucketMinutes）
  fiveHourMinutes: 300
  bucketMinutes: 5
  # 各档 token 预算（标准 token）。monthly 缺省可由 priceYuan 推导，显式写出便于运营直接调。
  plans:
    free:
      priceYuan: 0
      monthlyTokens: 300000      # ≈ ¥3 等值
      dailyTokens: 30000         # ≈ ¥0.3/日；约 80 个 GLM Flash 轻量轮次
      fiveHourTokens: 6000
    vip:
      priceYuan: 48
      monthlyTokens: 48000000    # 48 × 10 / 10 = 4800 万标准 token ≈ ¥480 等值
      dailyTokens: 1600000       # ≈ ¥16/日
      fiveHourTokens: 320000     # ≈ ¥3.2/5h
    svip:
      priceYuan: 148
      monthlyTokens: 148000000   # 148 × 10 / 10 = 1.48 亿标准 token ≈ ¥1,480 等值
      dailyTokens: 4933333       # ≈ ¥49.3/日
      fiveHourTokens: 986667     # ≈ ¥9.9/5h
    promax:
      priceYuan: 248
      monthlyTokens: 248000000   # 248 × 10 / 10 = 2.48 亿标准 token ≈ ¥2,480 等值
      dailyTokens: 8266667       # ≈ ¥82.7/日
      fiveHourTokens: 1653333    # ≈ ¥16.5/5h
  # 仅保留两类「非用量」的按次口径；AI 能力不再有 per-kind 每日条数限额。
  limits:
    coding_plan: { free: 0, vip: 100, svip: 300, promax: 600 }   # 用户自带套餐每日轮次上限（不占平台 token）
    task_quiz_active: { free: 2, vip: 10, svip: 30, promax: 60 } # 活跃定时任务存量上限（不是消耗）
  # 当日额度使用率 → L1 省流（按 token 百分比；free 前 50% 全量）
  degradeAtPercent: { free: 50, vip: 80, svip: 90, promax: 95 }
  # L1 省流的单轮输出 token 预算（截断思考与长答；0 = 不设限）
  l1MaxOutputTokens: 2048
  # 成本软阈值（微元 1e-6 元）→ L1；0 = 关闭（token 窗口是主口径）
  costSoftMicroYuan: { free: 0, vip: 0, svip: 0, promax: 0 }
  # 成本熔断（兜底）：token 窗口之外的最后一道闸；默认关闭以免早于额度触发
  costGuardEnabled: false
  costGuardMicroYuan: { free: 3000000, vip: 480000000, svip: 1480000000, promax: 2480000000 }  # ¥3 / ¥480 / ¥1,480 / ¥2,480
  # 双账本对账周期（毫秒；0 = 关闭）：业务面 ai_usage_daily vs 网关面 ai_gateway_usage
  reconIntervalMs: 21600000
  # 模型单价（元/百万 token）：成本账本 + 额度权重共用。
  # ⚠️ 除默认模型外为示意价，运营应按网关/供应商实际结算价校准；
  #    未列出的模型回退默认模型价（成本不中断，权重按默认模型）。
  prices:
    "z-ai/glm-5.3-flash": { input: 0.188, output: 6.48 }
    "z-ai/glm-5.3": { input: 0.5, output: 12 }
    "openai/gpt-6.1-terra": { input: 1.5, output: 20 }
    "openai/gpt-6.1-sol": { input: 2.5, output: 30 }
    "openai/gpt-6.1-terra-pro": { input: 5, output: 60 }
    "anthropic/claude-sonnet-5.5": { input: 2, output: 25 }
    "google/gemini-4-carbon": { input: 1, output: 15 }
    "deepseek/deepseek-v4.1-flash": { input: 0.2, output: 2 }
    "qwen/qwen3.8-max-prime": { input: 1.2, output: 18 }
    "moonshotai/kimi-k3.1-pro": { input: 1.5, output: 20 }
    "x-ai/grok-4.7": { input: 1.5, output: 20 }
  # 显式额度权重覆盖（缺省 = 单价 / referencePricePerMTok）；只影响扣额度，不影响成本账本。
  modelWeights: {}
  # 非聊天 AI 操作的估算标准 token 消耗（一次操作扣多少；共享同一 token 池）
  kindTokenCost:
    chat_images: 2000
    generate: 8000
    grade: 3000
    kg_build: 30000
    vectorize: 600
    ocr: 1500
    board: 2500
    academic_analysis: 12000
    academic_validation: 6000
    academic_export: 2000
    academic_experiment: 30000
    coding_plan: 0
    task_quiz_active: 0
  # 平台代付之外的模型（Coding Plan）；列表中的模型同样按 external 处理（零额度/零成本），
  # 聊天请求里的 req.model 也会在解析命中时单独标记。
  externalModels: []
  # 成本账本集合：业务面日聚合 + 网关面原始上报（每日对账）
  usageDailyCollection: ai_usage_daily
  gatewayUsageCollection: ai_gateway_usage
  # /internal/ai-usage 可选共享令牌（X-Usage-Token；空 = 不校验，仅内网可达）
  gatewayUsageToken: ${QUOTA__GATEWAY_USAGE_TOKEN:}

academic:
  # 学术/科研能力（plan/1.0.17）：academic 子 agent + 项目/文献/稿件工具。
  # false = 工具与 agent 均不注册（graceful degradation）
  enabled: true
  # 临时实验数据/代码/结果保留天数；论文/文献永久保留
  retentionTempDays: 180
  retentionSweepMs: 21600000
  # 后台科研实验执行器（plan/1.0.21 W6）：并发/排队/去重/自动回调上限。
  # 项目自动推进：仅做门禁同步/自动推进/建议通知，不调用 LLM。
  autopilot:
    enabled: true
    intervalMs: 900000
  experiments:
    maxConcurrent: 2
    maxQueued: 20
    # 同项目 + 同语言 + 同代码 hash 在该窗口内视为重复提交
    dedupeWindowMs: 600000
    # 每用户每日自动回调 AI 次数上限（0 = 不限）
    callbackDailyLimit: 30
  literature:
    # 文献检索外部源；Crossref 优先、OpenAlex 兜底、arXiv 供预印本检索
    crossrefBaseUrl: https://api.crossref.org
    openalexBaseUrl: https://api.openalex.org
    arxivBaseUrl: https://export.arxiv.org
    timeoutMs: 15000
    # 礼貌池联系人（Crossref/OpenAlex 建议填写邮箱；空 = 不附加 mailto 参数）
    mailto: ${ACADEMIC__LITERATURE__MAILTO:}
    # 单次检索返回上限（客户端内部钳制 1-25）
    maxResults: 10

prompts:
  dir: prompts

context:
  # 超出近期窗口的完成消息达到该数量才触发压缩
  compressThreshold: 4
  recentKeep: 6

langsmith:
  # LangSmith 追踪（AI SDK OTel 遥测 → OTLP 导出）。密钥缺失 = 追踪整体关闭（零开销）。
  # 与 Python 后端共用同一组 LANGSMITH_* 变量；注意 span 会携带 prompt/补全内容到 LangSmith（外部 SaaS）。
  apiKey: ${LANGSMITH_API_KEY}
  projectName: ${LANGSMITH_PROJECT:MindBase-ts}
  baseUrl: ${LANGSMITH_ENDPOINT:https://api.smith.langchain.com}

timezone:
  name: Asia/Shanghai

openrouter:
  modelsUrl: https://openrouter.ai/api/v1/models
  refreshHours: 24
  timeoutMs: 10000
  # Higress 改名模型的本地能力覆盖（JSON 字符串）：{"local-name":{"vision":true}}
  overridesJson: "{}"

ocr:
  # 图片解析兜底开关。错题图片出题：模型确认支持视觉时原图直读（不走 OCR）；
  # 能力未知/文本档模型/超张数上限时才回落 OCR 转写——因此保持开启。
  # 会话文档的图片上传必须经 OCR 转写（正文要进 embedding 索引，纯文本必需）。
  # false 时 DisabledOcr 对图片硬拒「OCR 未启用」。
  enabled: true
  # 视觉转写模型（网关 chat + 图片 part）；GLM-5.3-flash 支持视觉，与全局统一
  model: z-ai/glm-5.3-flash
  prompt: 请提取图片中的全部文字内容，按原始阅读顺序输出，不要添加任何解释或评论。
  maxImageBytes: 10485760
  timeoutMs: 60000