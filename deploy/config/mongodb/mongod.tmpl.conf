# =============================================================================
# MongoDB 7 — 生产模板（entrypoint-autosize.sh 渲染为 /tmp/mongod.conf）
# =============================================================================
# __WT_CACHE_GB__ 由脚本按容器 cgroup 内存上限推导；TLS 段由 MONGO_TLS 控制。
# 凭据：root 用户由 MONGO_INITDB_ROOT_USERNAME/PASSWORD（.env）首次初始化创建，
#       本文件不含任何口令；日志走容器 stdout（平台采集/轮转）。

storage:
  dbPath: /data/db
  # MongoDB 7 removed storage.journal.enabled (journaling is always on for WiredTiger).
  engine: wiredTiger
  wiredTiger:
    engineConfig:
      cacheSizeGB: __WT_CACHE_GB__
      journalCompressor: snappy
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 1000
  compression:
    compressors: snappy,zstd
# __TLS_BEGIN__
  tls:
    mode: requireTLS
    certificateKeyFile: /tls/server.pem
    CAFile: /tls/ca.crt
    allowConnectionsWithoutCertificates: true
    disabledProtocols: TLS1_0,TLS1_1
# __TLS_END__

security:
  authorization: enabled
  javascriptEnabled: false

operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 100

processManagement:
  timeZoneInfo: /usr/share/zoneinfo
  fork: false
