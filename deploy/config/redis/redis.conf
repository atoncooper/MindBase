# =============================================================================
# Redis 7 — root compose（TLS 业务端口 6379 + 明文 6380 供 MinIO 事件通知）
# =============================================================================
# 挂载：/usr/local/etc/redis/redis.conf；口令由 .env 注入：
#   redis-server /usr/local/etc/redis/redis.conf --requirepass "$REDIS_PASSWORD"
# 校验：redis-cli --tls ... CONFIG GET maxmemory / INFO persistence 应无 [ERR]；
#      启动日志出现 "Ready to accept connections" 即配置被接受。
# 说明：Redis 7（alpine）官方镜像以非 root redis 用户运行，/data 必须可写。

# --- 网络 / 进程 ------------------------------------------------------------
port 6380
tls-port 6379
bind 0.0.0.0
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
supervised no
pidfile ""
loglevel notice
logfile ""
databases 16
always-show-logo no
set-proc-title yes
proc-title-template "{title} {listen-addr} {server-mode}"
maxclients 10000

# --- 客户端安全 -------------------------------------------------------------
# 运维/调试类危险命令在容器内保持关闭（需要时用 CONFIG SET 临时打开并审计）。
enable-protected-configs no
enable-debug-command no
enable-module-command no

# --- 持久化 -----------------------------------------------------------------
dir /data
dbfilename dump.rdb
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# --- 内存(memory) -----------------------------------------------------------
# maxmemory / maxmemory-policy 由 entrypoint-autosize.sh 按容器内存上限计算并通过
# 命令行注入（noeviction：会话/配额预占宁可写失败也不静默驱逐）。

# --- 可观测 / 事件 ----------------------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100
notify-keyspace-events Ex
hz 10
dynamic-hz yes

# --- TLS（业务链路 rediss://）-----------------------------------------------
tls-cert-file /certs/server.crt
tls-key-file /certs/server.key
tls-ca-cert-file /certs/dev-ca.crt
# 只做服务端认证：客户端不要求证书（内部服务用 CA + 主机名校验）。
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
tls-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
tls-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
tls-prefer-server-ciphers yes
tls-session-caching yes
tls-session-cache-size 20480
tls-session-cache-timeout 300
