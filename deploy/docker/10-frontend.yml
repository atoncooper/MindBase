# 前端（Next.js）—— server1
#   docker compose --env-file ../../.env -f 10-frontend.yml up -d
name: mb-frontend

services:
  frontend:
    image: atoncooper/mind-base-frontend:latest
    build:
      context: ../../frontendv2
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* 是构建期内联的，必须走 build args
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_APISIX_HOST: nginx:80
        MINIO_PROXY_DEST: http://nginx:80
    container_name: mind-base-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - NEXT_PUBLIC_APISIX_HOST=nginx:80
      - MINIO_PROXY_DEST=http://nginx:80
      - SHARE_DOMAIN=${SHARE_DOMAIN:-}
      - SHARE_PUBLIC_IP=${SHARE_PUBLIC_IP:-}
    restart: unless-stopped
    networks:
      - mind-base-overlay

networks:
  mind-base-overlay:
    external: true
    name: mind-base-overlay

