# etcd（APISIX 元数据 + Milvus 依赖）—— server1
#   docker compose --env-file ../../.env -f 11-etcd.yml up -d
name: mb-etcd

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: mind-base-etcd
    # 服务端参数在 deploy/config/etcd/etcd.conf.yml。
    command: ["etcd", "--config-file=/etc/etcd/etcd.conf.yml"]
    volumes:
      - etcd_data:/etcd
      - ../../secrets/certs/etcd:/certs:ro
      - ../../deploy/config/etcd/etcd.conf.yml:/etc/etcd/etcd.conf.yml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=https://127.0.0.1:2379", "--cacert=/certs/dev-ca.crt", "--cert=/certs/server.crt", "--key=/certs/server.key", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mind-base-overlay

# ⚠️ 复用旧栈(/MindBase)的数据卷，etcd 里的元数据不丢。
#    若 docker volume ls 显示的名字不同，把 name 改成实际值。
volumes:
  etcd_data:
    external: true
    name: mindbase_etcd_data

networks:
  mind-base-overlay:
    external: true
    name: mind-base-overlay

