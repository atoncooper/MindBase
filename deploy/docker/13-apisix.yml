# APISIX 业务网关 —— server1（不暴露宿主端口，入口只有 nginx）
#   docker compose --env-file ../../.env -f 13-apisix.yml up -d
name: mb-apisix

services:
  apisix:
    image: atoncooper/mind-base-apisix:latest
    pull_policy: never
    build:
      context: ../../apisix
      dockerfile: Dockerfile
    container_name: mind-base-apisix
    ports:
      - "127.0.0.1:19180:9180"
    volumes:
      - ../../apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ../../apisix/apisix.yaml.template:/usr/local/apisix/conf/apisix.yaml.template:ro
      - ../../apisix/render-config.sh:/usr/local/apisix/conf/render-config.sh:ro
      # app-content board 域 dev-CA（apisix 信任 server2 上 app-content:8004 的 HTTPS upstream；
      # 宿主统一在 secrets/certs/app-content，容器内路径仍叫 certs/board）
      - ../../secrets/certs/app-content:/usr/local/apisix/conf/certs/board:ro
      # 9443/9180 TLS leaf + etcd mTLS 客户端证书
      - ../../secrets/certs/apisix:/usr/local/apisix/conf/certs/apisix:ro
      - ../../secrets/certs/etcd:/usr/local/apisix/conf/certs/etcd:ro
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - NO_PROXY=etcd,app-task,app-content,minio,mysql,mongo,redis,apisix,frontend,nginx,higress,app-user,app-cloud,app-kg,app-ts,app-pay,app-content-mcp,localhost,127.0.0.1
      - no_proxy=etcd,app-task,app-content,minio,mysql,mongo,redis,apisix,frontend,nginx,higress,app-user,app-cloud,app-kg,app-ts,app-pay,app-content-mcp,localhost,127.0.0.1
      - APISIX_CONSUMER_KEY=${APISIX_CONSUMER_KEY:?err_APISIX_CONSUMER_KEY_not_set_in_.env}
      - PAY_READONLY_KEY=${PAY_READONLY_KEY:-}
      - PAY_OPS_KEY=${PAY_OPS_KEY:-}
      # 允许为空：docker compose down/config 不应因缺密钥失败；容器 entrypoint 会在启动时强制校验。
      - APISIX_ADMIN_KEY=${APISIX_ADMIN_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':2382 .* 0A ' /proc/net/tcp || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - mind-base-overlay

networks:
  mind-base-overlay:
    external: true
    name: mind-base-overlay

