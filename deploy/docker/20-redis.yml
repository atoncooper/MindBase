# Redis（限流/验证码/事件桥/board 读缓存）—— server2
#   docker compose --env-file ../../.env -f 20-redis.yml up -d
name: mb-redis

services:
  redis:
    image: redis:7-alpine
    container_name: mind-base-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    # 生产标准：静态配置 + 按 cgroup 内存自动 maxmemory；密码仍由 .env 注入。
    entrypoint: ["/bin/sh", "/opt/mindbase/entrypoint-autosize.sh"]
    mem_limit: 1g
    cpus: 1.0
    environment:
      - REDIS_CONF=/usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ../../deploy/config/redis/redis.plain.conf:/usr/local/etc/redis/redis.conf:ro
      - ../../deploy/config/redis/entrypoint-autosize.sh:/opt/mindbase/entrypoint-autosize.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mind-base}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mind-base-overlay

volumes:
  redis_data: {}

networks:
  mind-base-overlay:
    external: true
    name: mind-base-overlay

