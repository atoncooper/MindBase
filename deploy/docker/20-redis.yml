# Redis（限流/验证码/事件桥/board 读缓存）—— server2
#   docker compose --env-file ../../.env -f 20-redis.yml up -d
name: mb-redis

services:
  redis:
    image: redis:7-alpine
    container_name: mind-base-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-mind-base}
      --notify-keyspace-events Ex
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mind-base}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mind-base-overlay

volumes:
  redis_data: {}

networks:
  mind-base-overlay:
    external: true
    name: mind-base-overlay

