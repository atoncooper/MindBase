# Neo4j（KG 图存储）—— server2
#   docker compose --env-file ../../.env -f 22-neo4j.yml up -d
name: mb-neo4j

services:
  neo4j:
    image: neo4j:5-community
    container_name: mind-base-neo4j
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-mind-base}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - mind-base-overlay

volumes:
  neo4j_data: {}
  neo4j_logs: {}

networks:
  mind-base-overlay:
    external: true
    name: mind-base-overlay

