# app-content 内容域服务（Go：app-note + app-quiz + app-board 三服务合并为单进程）—— server2
#   单进程/单端口 8004（HTTPS）：/board、/notes、/quiz、/tasks 与 /internal/*
#   全部挂同一个 listener（证书用 server1 拷来的同一套 dev-CA），业务流量经 APISIX/nginx。
#   原 32-app-note.yml / 33-app-quiz.yml / 37-app-board.yml 已合并为本文件，
#   env 为三套旧 env 的并集（APPBOARD__ / APPNOTE__ / APPQUIZ__ + 共享 env）。
#   docker compose --env-file ../../.env -f 30-app-content.yml up -d
name: mb-app-content

services:
  app-content:
    image: atoncooper/mind-base-app-content:latest
    pull_policy: missing
    container_name: mind-base-app-content
    env_file:
      - ../../.env
    environment:
      # ============ 统一数据源（8004，HTTPS-only） ============
      # ⚠️ 原版写死 @mysql:3306，两机部署必须指向外部主库
      - CONTENT__DATABASE__MYSQL__URL=${RDBMS__URL:?err_RDBMS__URL_not_set_in_.env}
      - CONTENT__DATABASE__MONGO__URI=${MONGO__URI:-mongodb://admin:mind-base@mongo:27017/?authSource=admin}
      - CONTENT__DATABASE__MONGO__DATABASE=mind_base
      - CONTENT__DATABASE__MONGO__BOARD_DATABASE=MindBase
      - CONTENT__DATABASE__REDIS__URL=${REDIS__URL:?err_REDIS__URL_not_set_in_.env}
      - "CONTENT__DATABASE__REDIS__KEY_PREFIX=mind-base:"
      - CONTENT__LOG__OUTPUT=both
      # 证书用 server1 拷来的同一套 dev-CA（cert-gen 产物），/app/certs 只读挂载
      - CONTENT__SERVER__TLS__ENABLED=true
      - CONTENT__SERVER__TLS__CERT_DIR=/app/certs
      - CONTENT__SERVER__TLS__CERT=/app/certs/server.crt
      - CONTENT__SERVER__TLS__KEY=/app/certs/server.key
      # 服务间 M2M 共享密钥（/internal/* 二次校验；与 server1 APISIX consumer key 同值）
      - CONTENT__INTERNAL_API_KEY=${APISIX_CONSUMER_KEY:?err_APISIX_CONSUMER_KEY_not_set_in_.env}
    ports:
      # 单端口（TLS）仅绑回环；对外入口只有 nginx / APISIX。
      - "127.0.0.1:${APP_CONTENT_PORT:-8004}:8004"
    volumes:
      - app_content_logs:/app/logs
      # board TLS 证书目录（cert-gen 产物，与 server1 apisix 信任的是同一套证书；
      # 目录名沿用历史 app-board/certs —— 即“保留 board TLS 证书卷/secret”）
      - ../../app-board/certs:/app/certs
    restart: unless-stopped
    networks:
      - mind-base-overlay

volumes:
  app_content_logs: {}

networks:
  mind-base-overlay:
    external: true
    name: mind-base-overlay
