# app-note 笔记服务（Go）—— server2
#   docker compose --env-file ../../.env -f 32-app-note.yml up -d
name: mb-app-note

services:
  app-note:
    image: atoncooper/mind-base-app-note:latest
    pull_policy: missing
    container_name: mind-base-app-note
    env_file:
      - ../../.env
    environment:
      - APPNOTE__RDBMS__URL=${RDBMS__URL:?err_RDBMS__URL_not_set_in_.env}
      - MONGO__URI=${MONGO__URI:-mongodb://admin:mind-base@mongo:27017/?authSource=admin}
      - APPNOTE__LOG__OUTPUT=both
    ports:
      - "127.0.0.1:${APP_NOTE_PORT:-8008}:8008"
    volumes:
      - app_note_logs:/app/logs
    restart: unless-stopped
    networks:
      - mind-base-overlay

volumes:
  app_note_logs: {}

networks:
  mind-base-overlay:
    external: true
    name: mind-base-overlay

