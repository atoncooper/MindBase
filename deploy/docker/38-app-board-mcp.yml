# app-board-mcp（把白板/导图暴露为 MCP 工具，app-ts 依赖）—— server2
#   docker compose --env-file ../../.env -f 38-app-board-mcp.yml up -d
name: mb-app-board-mcp

services:
  app-board-mcp:
    image: atoncooper/mind-base-app-board-mcp:latest
    pull_policy: missing
    container_name: mind-base-app-board-mcp
    environment:
      - BOARDMCP__UPSTREAM__BASE_URL=http://apisix:9080     # server1（overlay）
      - BOARDMCP__UPSTREAM__API_KEY=${APISIX_CONSUMER_KEY:?err_APISIX_CONSUMER_KEY_not_set_in_.env}
      - BOARDMCP__UPSTREAM__UID=${BOARD_MCP_UID:-}
      - BOARDMCP__SERVER__AUTH_TOKEN=${BOARD_MCP_AUTH_TOKEN:-}
      - BOARDMCP__SERVER__SERVICE_API_KEY=${APISIX_CONSUMER_KEY:?err_APISIX_CONSUMER_KEY_not_set_in_.env}
      - BOARDMCP__SERVER__TLS__ENABLED=${BOARD_MCP_TLS_ENABLED:-false}
      - BOARDMCP__SERVER__TLS__CERT_DIR=/app/certs
      - BOARDMCP__SERVER__TLS__CERT_FILE=/app/certs/server.crt
      - BOARDMCP__SERVER__TLS__KEY_FILE=/app/certs/server.key
      - BOARDMCP__LOG__OUTPUT=both
      - BOARDMCP__LOG__FILE=/app/logs/app-board-mcp.log
    ports:
      - "127.0.0.1:8005:8005"
    volumes:
      - app_board_mcp_logs:/app/logs
      - ../../mcp/app-board-mcp/certs:/app/certs
    restart: unless-stopped
    networks:
      - mind-base-overlay

volumes:
  app_board_mcp_logs: {}

networks:
  mind-base-overlay:
    external: true
    name: mind-base-overlay

