# app-pay 交易/会员（Spring Boot，HTTPS-only，证书从 server1 拷贝）—— server2
#   docker compose --env-file ../../.env -f 42-app-pay.yml up -d
# DB：本机 app-pay-mysql（application-docker.yaml 指向 app-pay-mysql:3306，密钥走 .env 占位符）
name: mb-app-pay

services:
  app-pay:
    image: atoncooper/mind-base-app-pay:latest
    pull_policy: missing
    container_name: mind-base-app-pay
    env_file:
      - ../../.env
    command: ["--spring.profiles.active=docker"]
    ports:
      - "127.0.0.1:${APP_PAY_PORT:-8002}:8002"   # 仅回环，须经 APISIX 访问
    volumes:
      - app_pay_logs:/app/logs
      - ../../app-pay/certs:/app/certs:ro         # 缺证书启动自检直接拒绝
    restart: unless-stopped
    networks:
      - mind-base-overlay

volumes:
  app_pay_logs: {}

networks:
  mind-base-overlay:
    external: true
    name: mind-base-overlay

