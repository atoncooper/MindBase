# Strategic-merge patch：kustomization.yaml 的 target.kind=StatefulSet
# 选中全部数据 StatefulSet，本文件的 metadata.name 仅为占位（官方用法）。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: unused
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: ip-172-31-38-145   # database 节点
      tolerations:
        - key: dedicated
          operator: Equal
          value: database
          effect: NoSchedule
