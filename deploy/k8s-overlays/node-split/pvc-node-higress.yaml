# higress：Deployment + 独立 PVC（RWO，/data，strategy Recreate），
# 与数据层同钉 database 节点（AI 网关配置持久化不漂移）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: higress
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: ip-172-31-38-145
      tolerations:
        - key: dedicated
          operator: Equal
          value: database
          effect: NoSchedule
