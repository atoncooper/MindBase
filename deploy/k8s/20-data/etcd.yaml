# etcd v3.5 — Milvus metadata store (APISIX runs standalone, no etcd needed).
apiVersion: v1
kind: Service
metadata:
  name: etcd
  labels:
    app: etcd
spec:
  clusterIP: None
  selector:
    app: etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
spec:
  serviceName: etcd
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.14
          imagePullPolicy: IfNotPresent
          command:
            - etcd
            - -advertise-client-urls=http://etcd:2379
            - -listen-client-urls=http://0.0.0.0:2379
            - -data-dir=/etcd
          env:
            - name: ETCD_AUTO_COMPACTION_MODE
              value: revision
            - name: ETCD_AUTO_COMPACTION_RETENTION
              value: "1000"
            - name: ETCD_QUOTA_BACKEND_BYTES
              value: "4294967296"
            - name: ETCD_SNAPSHOT_COUNT
              value: "50000"
          ports:
            - containerPort: 2379
          volumeMounts:
            - name: data
              mountPath: /etcd
          startupProbe:
            exec:
              command: ["etcdctl", "endpoint", "health"]
            periodSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["etcdctl", "endpoint", "health"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["etcdctl", "endpoint", "health"]
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        # storageClassName: local-path   # ← 运维按需指定；缺省用集群默认 SC
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
