# etcd v3.5 — Milvus metadata store (APISIX runs standalone, no etcd needed).
apiVersion: v1
kind: Service
metadata:
  name: etcd
  labels:
    app: etcd
spec:
  clusterIP: None
  selector:
    app: etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
spec:
  serviceName: etcd
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.14
          imagePullPolicy: IfNotPresent
          # 服务端参数在 deploy/config/etcd/etcd.plain.conf.yml（ConfigMap etcd-conf）。
          command: ["etcd", "--config-file=/etc/etcd/etcd.conf.yml"]
          ports:
            - containerPort: 2379
          volumeMounts:
            - name: data
              mountPath: /etcd
            - name: etcd-conf
              mountPath: /etc/etcd/etcd.conf.yml
              subPath: etcd.conf.yml
              readOnly: true
          startupProbe:
            exec:
              command: ["etcdctl", "endpoint", "health"]
            periodSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["etcdctl", "endpoint", "health"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["etcdctl", "endpoint", "health"]
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: etcd-conf
          configMap:
            name: etcd-conf
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        # storageClassName: local-path   # ← 运维按需指定；缺省用集群默认 SC
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
