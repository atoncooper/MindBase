# MinIO — app object storage (cloud drive / code artifacts) AND Milvus
# object backend. Redis event notifications drive the cloud-drive pipeline.
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app: minio
spec:
  clusterIP: None
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: minio
          image: atoncooper/mind-base-minio:latest
          # :latest 必须配 Always（与 30-apps 其余镜像一致）——IfNotPresent 会让
          # rollout restart 拉不到新构建；生产钉 digest 见 kustomization.yaml images 块
          imagePullPolicy: Always
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - configMapRef:
                name: mindbase-defaults
            - secretRef:
                name: mindbase-env
          env:
            - name: MINIO_NOTIFY_REDIS_ENABLE_clouddrive
              value: "on"
            - name: MINIO_NOTIFY_REDIS_FORMAT_clouddrive
              value: access
            - name: MINIO_NOTIFY_REDIS_ADDRESS_clouddrive
              value: redis:6379
            - name: MINIO_NOTIFY_REDIS_PASSWORD_clouddrive
              valueFrom:
                configMapKeyRef: { name: mindbase-defaults, key: REDIS_PASSWORD }
            - name: MINIO_NOTIFY_REDIS_KEY_clouddrive
              value: minio:events:clouddrive
            - name: MINIO_NOTIFY_REDIS_EVENTS_clouddrive
              value: put,delete,completemultipartupload
            - name: MINIO_API_ABORT_INCOMPLETE_MULTIPART_UPLOAD_DAYS
              value: "1"
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        # storageClassName: local-path   # ← 运维按需指定；缺省用集群默认 SC
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
