# MinIO — app object storage (cloud drive / code artifacts) AND Milvus
# object backend. Redis event notifications drive the cloud-drive pipeline.
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app: minio
spec:
  clusterIP: None
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-11-07T00-52-20Z
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: MINIO_ACCESS_KEY }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: MINIO_SECRET_KEY }
            # Plan 0021: Redis event notification + abandoned upload cleanup
            - name: MINIO_NOTIFY_REDIS_ENABLE_clouddrive
              value: "on"
            - name: MINIO_NOTIFY_REDIS_FORMAT_clouddrive
              value: access
            - name: MINIO_NOTIFY_REDIS_ADDRESS_clouddrive
              value: redis:6379
            - name: MINIO_NOTIFY_REDIS_PASSWORD_clouddrive
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: REDIS_PASSWORD }
            - name: MINIO_NOTIFY_REDIS_KEY_clouddrive
              value: minio:events:clouddrive
            - name: MINIO_NOTIFY_REDIS_EVENTS_clouddrive
              value: put,delete,completemultipartupload
            - name: MINIO_API_ABORT_INCOMPLETE_MULTIPART_UPLOAD_DAYS
              value: "1"
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
