# Main application MySQL (mind_base) — schema seeded from db/system.sql
# Credentials come from the mindbase-env Secret (MYSQL_ROOT_PASSWORD /
# MYSQL_USER / MYSQL_PASSWORD — sourced from .env).
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  clusterIP: None          # headless: StatefulSet identity + stable DNS
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysql
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      # InnoDB 优雅关停（刷脏/关 binlog）可能超过默认 30s
      terminationGracePeriodSeconds: 60
      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          envFrom:
            - configMapRef:
                name: mindbase-defaults
            - secretRef:
                name: mindbase-env
          env:
            - name: MYSQL_DATABASE
              value: mind_base
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          # startupProbe 门控启动期（首次启动含 system.sql 种子导入，预算 180s）；
          # 通过后 readiness/liveness 立即接管，不再需要 initialDelaySeconds 硬编码
          startupProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h localhost -u root -p$(MYSQL_ROOT_PASSWORD)"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h localhost -u root -p$(MYSQL_ROOT_PASSWORD)"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h localhost -u root -p$(MYSQL_ROOT_PASSWORD)"]
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: init-sql
          configMap:
            name: mysql-init-sql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        # storageClassName: local-path   # ← 运维按需指定；缺省用集群默认 SC
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
