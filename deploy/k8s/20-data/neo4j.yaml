# Neo4j 5 community — Knowledge Graph store (optional at runtime: the
# backend degrades gracefully when it is down or kg.enabled=false).
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  labels:
    app: neo4j
spec:
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # RWO PVC 单副本 Deployment：滚动更新时新 pod 在异节点挂不上旧卷会卡死，用 Recreate
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: neo4j
          image: neo4j:5-community
          imagePullPolicy: IfNotPresent
          env:
            # $(VAR) 依赖必须先定义后引用；口令取 defaults ConfigMap
            # （与 app-kg 的 KG__PASSWORD 默认值同源）
            - name: NEO4J_PASSWORD
              valueFrom:
                configMapKeyRef: { name: mindbase-defaults, key: NEO4J_PASSWORD }
            - name: NEO4J_AUTH
              value: neo4j/$(NEO4J_PASSWORD)
          ports:
            - containerPort: 7474
            - containerPort: 7687
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
          # 首次启动含系统库初始化，预算 180s
          startupProbe:
            httpGet:
              path: /
              port: 7474
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /
              port: 7474
            periodSeconds: 15
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: 7474
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: 500m, memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: neo4j-data
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-data
spec:
  # storageClassName: local-path   # ← 运维按需指定；缺省用集群默认 SC
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
