# Redis 7 — cache (/1) + task queue (/2) + minio events. Keyspace expiry
# notifications are required by the stack (quiz / rate limiting).
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          # 生产标准：静态配置 + 按 Pod cgroup 内存自动 maxmemory（entrypoint）。
          command: ["/bin/sh", "/opt/mindbase/entrypoint-autosize.sh"]
          env:
            - name: REDIS_CONF
              value: /usr/local/etc/redis/redis.conf
            # 命令行/探针的 $(REDIS_PASSWORD) 只能引用 env 列表内变量（envFrom 不可见）；
            # 固定取 defaults ConfigMap，与各客户端 REDIS__URL 默认值同源
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: REDIS_PASSWORD }
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
            - name: redis-conf
              mountPath: /usr/local/etc/redis/redis.conf
              subPath: redis.conf
              readOnly: true
            - name: redis-conf
              mountPath: /opt/mindbase/entrypoint-autosize.sh
              subPath: entrypoint.sh
              readOnly: true
          startupProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
            periodSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 512Mi }
      volumes:
        - name: redis-conf
          configMap:
            name: redis-conf
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        # storageClassName: local-path   # ← 运维按需指定；缺省用集群默认 SC
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
