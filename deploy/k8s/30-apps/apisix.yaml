# APISIX 3.11 — business API gateway (standalone mode, routes declarative in
# apisix.yaml). Cluster-internal only: nginx -> apisix -> backend; exposing
# 9080 would let clients bypass nginx SSL/cache/rate-limiting.
# The entrypoint override unsets proxy vars (host proxy injection once broke
# internal etcd traffic) and builds the ssl_trusted_certificate CA bundle
# including the app-board dev CA (upstream tls_verify trust anchor).
apiVersion: v1
kind: Service
metadata:
  name: apisix
  labels:
    app: apisix
spec:
  selector:
    app: apisix
  ports:
    - name: http
      port: 9080
      targetPort: 9080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
spec:
  # standalone data_plane is stateless (routes declared in the ConfigMap) — 2 replicas remove the business-gateway single point
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: apisix
  template:
    metadata:
      labels:
        app: apisix
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: apisix
      # standalone data_plane：不依赖 etcd（config.yaml role=data_plane 跳过 init_etcd）
      containers:
        - name: apisix
          image: apache/apisix:3.11.0-debian
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              unset HTTP_PROXY http_proxy HTTPS_PROXY https_proxy
              if [ -f /usr/local/apisix/conf/certs/board/dev-ca.crt ]; then
                cat /etc/ssl/certs/ca-certificates.crt /usr/local/apisix/conf/certs/board/dev-ca.crt > /tmp/ca-bundle.crt
              else
                cp /etc/ssl/certs/ca-certificates.crt /tmp/ca-bundle.crt
              fi
              exec /docker-entrypoint.sh docker-start
          env:
            - name: HTTP_PROXY
              value: ""
            - name: HTTPS_PROXY
              value: ""
            - name: http_proxy
              value: ""
            - name: https_proxy
              value: ""
            - name: NO_PROXY
              value: etcd,app-ts,app-task,app-board,minio,mysql,mongo,redis,apisix,frontend,nginx,higress,localhost,127.0.0.1
            - name: no_proxy
              value: etcd,app-ts,app-task,app-board,minio,mysql,mongo,redis,apisix,frontend,nginx,higress,localhost,127.0.0.1
          ports:
            - containerPort: 9080
          volumeMounts:
            - name: config
              mountPath: /usr/local/apisix/conf/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /usr/local/apisix/conf/apisix.yaml
              subPath: apisix.yaml
              readOnly: true
            - name: board-ca
              mountPath: /usr/local/apisix/conf/certs/board
              readOnly: true
          startupProbe:
            tcpSocket:
              port: 9080
            periodSeconds: 5
            failureThreshold: 15
          readinessProbe:
            tcpSocket:
              port: 9080
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 9080
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
      volumes:
        - name: config
          configMap:
            name: apisix-config
        - name: board-ca
          secret:
            secretName: app-board-certs
            items:
              - key: dev-ca.crt
                path: dev-ca.crt
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apisix
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: apisix
