# APISIX 3.20 — traditional + etcd (Admin API / embedded Dashboard enabled).
#
# etcd is the config source of truth; routes/upstreams/consumers/ssls are
# managed through the Admin API (HTTPS :9180) or the embedded Dashboard UI.
# apisix/apisix.yaml.template is rendered by the derived image entrypoint and
# used by apisix-sync to seed an EMPTY etcd and to keep ssls/consumers
# (certificate / internal-key rotation) in sync. It is NOT the runtime source.
#
# Prerequisites (see deploy/k8s/README.md):
#   secret mindbase-env: APISIX_CONSUMER_KEY, APISIX_ADMIN_KEY, PAY_* optional
#                        (Admin source IPs live in apisix/config.k8s.yaml)
#   secret apisix-tls   : server.crt, server.key, dev-ca.crt
#                        (9443 + 9180 TLS; dev-ca.crt is the shared CA used by
#                         apisix-sync to verify the Admin API)
#   secret app-board-certs: dev-ca.crt
# The cluster etcd is shared with Milvus (plain HTTP, cluster-internal); APISIX
# uses it as its config store. Moving it to mTLS is a separate Milvus-touching
# migration.
#
# Admin API/UI is never exposed publicly: the apisix-admin Service is
# ClusterIP; use kubectl port-forward / VPN. If a LoadBalancer is required,
# add loadBalancerSourceRanges with your exact admin source IPs.
apiVersion: v1
kind: Service
metadata:
  name: apisix
  labels:
    app: apisix
spec:
  selector:
    app: apisix
  ports:
    - name: http
      port: 9080
      targetPort: 9080
    - name: https
      port: 9443
      targetPort: 9443
---
apiVersion: v1
kind: Service
metadata:
  name: apisix-admin
  labels:
    app: apisix
spec:
  type: ClusterIP
  selector:
    app: apisix
  ports:
    - name: admin-https
      port: 9180
      targetPort: 9180
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
spec:
  # etcd-backed and stateless; 2 replicas remove the business-gateway single point.
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: apisix
  template:
    metadata:
      labels:
        app: apisix
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: apisix
      containers:
        - name: apisix
          image: atoncooper/mind-base-apisix:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: APISIX_CONSUMER_KEY
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: APISIX_CONSUMER_KEY }
            - name: PAY_READONLY_KEY
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: PAY_READONLY_KEY, optional: true }
            - name: PAY_OPS_KEY
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: PAY_OPS_KEY, optional: true }
            - name: APISIX_ADMIN_KEY
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: APISIX_ADMIN_KEY }
            - name: HTTP_PROXY
              value: ""
            - name: HTTPS_PROXY
              value: ""
            - name: http_proxy
              value: ""
            - name: https_proxy
              value: ""
            - name: NO_PROXY
              value: etcd,app-ts,app-task,app-content,minio,mysql,mongo,redis,apisix,frontend,nginx,higress,localhost,127.0.0.1
            - name: no_proxy
              value: etcd,app-ts,app-task,app-content,minio,mysql,mongo,redis,apisix,frontend,nginx,higress,localhost,127.0.0.1
          ports:
            - name: http
              containerPort: 9080
            - name: https
              containerPort: 9443
            - name: admin
              containerPort: 9180
          volumeMounts:
            # Template + config + render script at the stock APISIX paths, so
            # the derived image entrypoint needs no path env vars.
            - name: config
              mountPath: /usr/local/apisix/conf/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /usr/local/apisix/conf/apisix.yaml.template
              subPath: apisix.yaml.template
              readOnly: true
            - name: config
              mountPath: /usr/local/apisix/conf/render-config.sh
              subPath: render-config.sh
              readOnly: true
            - name: board-ca
              mountPath: /usr/local/apisix/conf/certs/board
              readOnly: true
            - name: apisix-tls
              mountPath: /usr/local/apisix/conf/certs/apisix
              readOnly: true
          startupProbe:
            tcpSocket:
              port: 9080
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: 9080
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 9080
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
      volumes:
        - name: config
          configMap:
            name: apisix-config
        - name: board-ca
          secret:
            secretName: app-board-certs
            items:
              - key: dev-ca.crt
                path: dev-ca.crt
        - name: apisix-tls
          secret:
            secretName: apisix-tls
            items:
              - key: server.crt
                path: server.crt
              - key: server.key
                path: server.key
              - key: dev-ca.crt
                path: dev-ca.crt
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apisix
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: apisix
