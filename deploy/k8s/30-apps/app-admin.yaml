# app-admin — unified admin console API (port 8016; Go + Gin).
# Cluster-internal only (mirrors compose loopback binding): access with
# `kubectl -n mind-base port-forward svc/app-admin 8016:8016`.
# Direct-connects the shared bilirag MySQL (same as app-user/app-cloud):
# read-only users/rbac/cloud metadata + the ONLY write is the four moderation
# columns on cloud_shares (never is_revoked; never AutoMigrate shared tables).
# Payment ops (merged from the retired app-pay-admin, 2026-11-03): a SECOND
# GORM connection reads app_pay (orders/memberships/events/callbacks/SKU) and
# the only fund write is the membership grant; refund review goes through the
# app-pay internal endpoints (pay-ops key). Unset pay_rdbms.url => /api/pay/*
# returns 503 while the rest of the console keeps working.
apiVersion: v1
kind: Service
metadata:
  name: app-admin
  labels:
    app: app-admin
spec:
  selector:
    app: app-admin
  ports:
    - name: http
      port: 8016
      targetPort: 8016
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-admin
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: app-admin
  template:
    metadata:
      labels:
        app: app-admin
    spec:
      initContainers:
        - name: wait-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 3; done"]
        - name: wait-app-cloud
          # app-cloud owns the cloud_shares moderation columns (idempotent ALTER
          # runs in its db.Migrate); wait for it to have started once.
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z app-cloud 8007; do echo waiting for app-cloud; sleep 3; done"]
      containers:
        - name: app-admin
          image: atoncooper/mind-base-app-admin:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: mindbase-defaults
            - secretRef:
                name: mindbase-env
          env:
            # Seed console account (insert-once; first login forces a password
            # change). Override in .env: APPADMIN__SEED__USERNAME/PASSWORD.
            - name: APPADMIN__SEED__USERNAME
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: APPADMIN__SEED__USERNAME, optional: true }
            - name: APPADMIN__SEED__PASSWORD
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: APPADMIN__SEED__PASSWORD, optional: true }
            # Sandbox admin proxy: app-admin reads app-sandbox /internal/admin/*
            # server-side; the token is the same shared value as
            # SANDBOX__ADMIN__TOKEN (empty = sandbox pages return 503).
            - name: APPADMIN__SANDBOX_ADMIN__BASE_URL
              value: http://app-sandbox:8017
            - name: APPADMIN__SANDBOX_ADMIN__TOKEN
              valueFrom:
                secretKeyRef:
                  name: mindbase-env
                  key: SANDBOX_ADMIN_TOKEN
                  optional: true
            # Payment ops (second GORM connection to app_pay). URL falls back to
            # the mindbase-defaults value; unset/empty => /api/pay/* 503.
            - name: APPADMIN__PAY_RDBMS__URL
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: APPADMIN__PAY_RDBMS__URL, optional: true }
            # Refund review calls app-pay internal endpoints through the APISIX
            # pay-ops consumer; empty key hides the whole refund-review group.
            - name: APPADMIN__PAY__OPS__BASE_URL
              value: "http://apisix:9080"
            - name: APPADMIN__PAY__OPS__KEY
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: PAY_OPS_KEY, optional: true }
            # Fund audit JSONL hash chain (grants / refund confirmations, 365d).
            - name: APPADMIN__PAY__AUDIT_FILE
              value: /app/logs/pay-audit.jsonl
            - name: APPADMIN__LOG__OUTPUT
              value: "both"
          ports:
            - containerPort: 8016
          volumeMounts:
            - name: logs
              mountPath: /app/logs
          startupProbe:
            httpGet: { path: /health, port: 8016 }
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: { path: /health, port: 8016 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8016 }
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
      volumes:
        - name: logs
          emptyDir: {}
