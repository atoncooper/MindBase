# app-auth — identity & auth authority (Go + Gin; forward-auth backend) (port 8006).
# Env parity with docker-compose.yml service 'app-auth'; secrets come from the
# mindbase-env Secret (created once via kubectl create secret from .env).
apiVersion: v1
kind: Service
metadata:
  name: app-auth
  labels:
    app: app-auth
spec:
  selector:
    app: app-auth
  ports:
    - name: http
      port: 8006
      targetPort: 8006
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-auth
  template:
    metadata:
      labels:
        app: app-auth
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306 && nc -z redis 6379; do echo waiting for mysql/redis; sleep 3; done"]
      containers:
        - name: app-auth
          image: atoncooper/mind-base-app-auth:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: mindbase-env
          env:
            - name: APPAUTH__RDBMS__URL
              value: "mysql+aiomysql://$(MYSQL_USER):$(MYSQL_PASSWORD)@mysql:3306/mind_base"
            - name: REDIS__URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/1"
            - name: SECURITY__API_KEY_ENCRYPTION_KEY
              value: "$(SECURITY__API_KEY_ENCRYPTION_KEY)"
            - name: SECURITY__API_KEY_ENCRYPTION_KEY_FILE
              value: "/run/secrets/api_key_encryption_key"
            - name: APPAUTH__WORKER_ID
              value: "2"
            - name: APPAUTH__LOG__OUTPUT
              value: "both"
          ports:
            - containerPort: 8006
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: enc-key
              mountPath: /run/secrets
              readOnly: true

          readinessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: logs
          emptyDir: {}
        - name: enc-key
          secret:
            secretName: api-key-encryption-key

