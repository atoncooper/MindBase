# app-bili — bilibili acquisition authority (Go + Gin; favorites/ASR/build; ffmpeg in image) (port 8010).
# Env parity with docker-compose.yml service 'app-bili'; secrets come from the
# mindbase-env Secret (created once via kubectl create secret from .env).
apiVersion: v1
kind: Service
metadata:
  name: app-bili
  labels:
    app: app-bili
spec:
  selector:
    app: app-bili
  ports:
    - name: http
      port: 8010
      targetPort: 8010
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-bili
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-bili
  template:
    metadata:
      labels:
        app: app-bili
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306 && nc -z mongo 27017; do echo waiting for mysql/mongo; sleep 3; done"]
      containers:
        - name: app-bili
          image: atoncooper/mind-base-app-bili:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: mindbase-env
          env:
            - name: APPBILI__RDBMS__URL
              value: "mysql+aiomysql://$(MYSQL_USER):$(MYSQL_PASSWORD)@mysql:3306/mind_base"
            - name: MONGO__URI
              value: "$(MONGO__URI)"
            - name: REDIS__URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/1"
            - name: AI_GATEWAY__API_KEY
              value: "$(AI_GATEWAY__API_KEY)"
            - name: AI_GATEWAY__BASE_URL
              value: "http://higress:8080/v1"
            - name: SECURITY__API_KEY_ENCRYPTION_KEY
              value: "$(SECURITY__API_KEY_ENCRYPTION_KEY)"
            - name: SECURITY__API_KEY_ENCRYPTION_KEY_FILE
              value: "/run/secrets/api_key_encryption_key"
            - name: APPBILI__INTERNAL__API_KEY
              value: "$(APISIX_CONSUMER_KEY)"
            - name: APPBILI__LOG__OUTPUT
              value: "both"
          ports:
            - containerPort: 8010
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: enc-key
              mountPath: /run/secrets
              readOnly: true

          readinessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: logs
          emptyDir: {}
        - name: enc-key
          secret:
            secretName: api-key-encryption-key

