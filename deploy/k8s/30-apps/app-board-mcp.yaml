# app-board-mcp — BOARDMCP MCP server (Go + mcp-go; agent tool surface) (port 8005).
# Env parity with docker-compose.yml service 'app-board-mcp'; secrets come from the
# mindbase-env Secret (created once via kubectl create secret from .env).
apiVersion: v1
kind: Service
metadata:
  name: app-board-mcp
  labels:
    app: app-board-mcp
spec:
  selector:
    app: app-board-mcp
  ports:
    - name: http
      port: 8005
      targetPort: 8005
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-board-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-board-mcp
  template:
    metadata:
      labels:
        app: app-board-mcp
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z apisix 9080; do echo waiting for apisix; sleep 3; done"]
      containers:
        - name: app-board-mcp
          image: atoncooper/mind-base-app-board-mcp:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: mindbase-defaults
            - secretRef:
                name: mindbase-env
          env:
            # $(VAR) 只能引用 env 列表内变量（envFrom 不可见）——先取源值再派生；
            # ⚠️ optional secretKeyRef 的键在 Secret 缺失时变量整体省略，下游 $(VAR) 会
            # 原样保留成字面量（历史事故：BOARDMCP__UPSTREAM__UID="$(BOARD_MCP_UID)"）。
            # 可选键一律直接 valueFrom 到目标名；只有必选键（APISIX_CONSUMER_KEY）允许 $(VAR) 派生
            - name: APISIX_CONSUMER_KEY
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: APISIX_CONSUMER_KEY }
            - name: BOARD_MCP_UID
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: BOARD_MCP_UID, optional: true }
            - name: BOARD_MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: BOARD_MCP_AUTH_TOKEN, optional: true }
            - name: BOARDMCP__UPSTREAM__BASE_URL
              value: "http://apisix:9080"
            - name: BOARDMCP__UPSTREAM__API_KEY
              value: "$(APISIX_CONSUMER_KEY)"
            - name: BOARDMCP__UPSTREAM__UID
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: BOARD_MCP_UID, optional: true }
            - name: BOARDMCP__SERVER__AUTH_TOKEN
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: BOARD_MCP_AUTH_TOKEN, optional: true }
            - name: BOARDMCP__SERVER__SERVICE_API_KEY
              value: "$(APISIX_CONSUMER_KEY)"
            - name: BOARDMCP__LOG__OUTPUT
              value: "both"
            - name: BOARDMCP__LOG__FILE
              value: "/app/logs/app-board-mcp.log"
          ports:
            - containerPort: 8005
          volumeMounts:
            - name: logs
              mountPath: /app/logs

          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: logs
          emptyDir: {}

