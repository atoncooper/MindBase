# app-board — Go mind-map/whiteboard content service (port 8004, HTTPS-only).
# Shares the main app's MySQL/Mongo; Redis read-cache on DB /2.
# TLS certs come from the app-board-certs Secret (generated once by
# app-board/scripts locally); apisix mounts dev-ca.crt from the same Secret
# as its upstream TLS trust anchor.
# Cluster-internal only: reached via APISIX forward-auth, never exposed.
apiVersion: v1
kind: Service
metadata:
  name: app-board
  labels:
    app: app-board
spec:
  selector:
    app: app-board
  ports:
    - name: https
      port: 8004
      targetPort: 8004
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-board
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-board
  template:
    metadata:
      labels:
        app: app-board
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306 && nc -z mongo 27017 && nc -z redis 6379; do echo waiting for mysql/mongo/redis; sleep 3; done"]
      containers:
        - name: app-board
          image: ghcr.io/atoncooper/mind-base-app-board:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: mindbase-env
          env:
            # Redis read cache on DB /2 (main app uses /1); degrades to
            # direct DB reads when Redis is down
            - name: APPBOARD__REDIS__URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379/2
            - name: APPBOARD__RDBMS__URL
              value: mysql+aiomysql://$(MYSQL_USER):$(MYSQL_PASSWORD)@mysql:3306/mind_base
            - name: APPBOARD__MONGO__URI
              value: $(MONGO__URI)
            - name: APPBOARD__MONGO__DB_NAME
              value: MindBase
            - name: APPBOARD__LOG__OUTPUT
              value: both
            # Explicit cert files from the Secret (no in-pod auto-generation,
            # so the apisix trust anchor is deterministic)
            - name: APPBOARD__SERVER__TLS__ENABLED
              value: "true"
            - name: APPBOARD__SERVER__TLS__CERT
              value: /app/certs/server.crt
            - name: APPBOARD__SERVER__TLS__KEY
              value: /app/certs/server.key
          ports:
            - containerPort: 8004
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: tls
              mountPath: /app/certs
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8004
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 512Mi }
      volumes:
        - name: logs
          emptyDir: {}
        - name: tls
          secret:
            secretName: app-board-certs
