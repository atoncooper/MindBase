# app-cloud — cloud-drive authority (Go + Gin; quota/share/trash/workspaces/vector pipeline) (port 8007).
# Env parity with docker-compose.yml service 'app-cloud'; secrets come from the
# mindbase-env Secret (created once via kubectl create secret from .env).
apiVersion: v1
kind: Service
metadata:
  name: app-cloud
  labels:
    app: app-cloud
spec:
  selector:
    app: app-cloud
  ports:
    - name: http
      port: 8007
      targetPort: 8007
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-cloud
spec:
  # 多实例强化已完成（Redis 租约锁后台任务 / cloud_vector_tasks outbox 认领 /
  # Lua 配额预留 / cloud_quota 计数自愈 / 下载上限条件更新）——上方 Service 已
  # 做负载均衡，可安全调大 replicas。
  replicas: 1
  selector:
    matchLabels:
      app: app-cloud
  template:
    metadata:
      labels:
        app: app-cloud
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306 && nc -z minio 9000 && nc -z redis 6379 && nc -z milvus 19530; do echo waiting for mysql/minio/redis/milvus; sleep 3; done"]
      containers:
        - name: app-cloud
          image: atoncooper/mind-base-app-cloud:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: mindbase-env
          env:
            - name: APPCLOUD__RDBMS__URL
              value: "mysql+aiomysql://$(MYSQL_USER):$(MYSQL_PASSWORD)@mysql:3306/mind_base"
            - name: REDIS__URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/1"
            - name: MONGO__URI
              value: "$(MONGO__URI)"
            - name: MINIO__ACCESS_KEY
              value: "$(MINIO_ACCESS_KEY)"
            - name: MINIO__SECRET_KEY
              value: "$(MINIO_SECRET_KEY)"
            - name: APISIX_CONSUMER_KEY
              value: "$(APISIX_CONSUMER_KEY)"
            - name: AI_GATEWAY__API_KEY
              value: "$(AI_GATEWAY__API_KEY)"
            - name: AI_GATEWAY__BASE_URL
              value: "http://higress:8080/v1"
            - name: MILVUS__URI
              value: "http://milvus:19530"
            - name: APPCLOUD__LOG__OUTPUT
              value: "both"
          ports:
            - containerPort: 8007
          volumeMounts:
            - name: logs
              mountPath: /app/logs

          readinessProbe:
            httpGet:
              path: /health
              port: 8007
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8007
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: logs
          emptyDir: {}

