# app-cloud — cloud-drive authority (Go + Gin; quota/share/trash/workspaces/vector pipeline) (port 8007).
# Env parity with docker-compose.yml service 'app-cloud'; secrets come from the
# mindbase-env Secret (created once via kubectl create secret from .env).
apiVersion: v1
kind: Service
metadata:
  name: app-cloud
  labels:
    app: app-cloud
spec:
  selector:
    app: app-cloud
  ports:
    - name: http
      port: 8007
      targetPort: 8007
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-cloud
spec:
  # Multi-instance hardening complete (Redis-leased background jobs /
  # cloud_vector_tasks outbox claiming / atomic Lua quota reserve + post-reserve
  # recheck / cloud_quota counter self-healing / conditional download caps /
  # shared attest secret / complete-time size verification) — the Service above
  # load-balances; default 2 replicas.
  # Before scaling: N x rdbms.max_open_conns(10) must stay below
  # mysql max_connections x 60%.
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: app-cloud
  template:
    metadata:
      labels:
        app: app-cloud
    spec:
      # Spread replicas across nodes (ScheduleAnyway: does not block scheduling when nodes are scarce)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: app-cloud
      # Matches app-side graceful shutdown (10s HTTP + 8s pipeline worker grace)
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306 && nc -z minio 9000 && nc -z redis 6379 && nc -z milvus 19530; do echo waiting for mysql/minio/redis/milvus; sleep 3; done"]
      containers:
        - name: app-cloud
          image: atoncooper/mind-base-app-cloud:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: mindbase-defaults
            - secretRef:
                name: mindbase-env
          env:
            # AI_GATEWAY__* / 凭证类经 envFrom（mindbase-defaults 兜底 + .env 覆盖）
            - name: MILVUS__URI
              value: "http://milvus:19530"
            - name: APPCLOUD__LOG__OUTPUT
              value: "both"
            # 提取码静态加密密钥（与 app-auth 同一 Secret；密钥不进数据库）
            - name: SECURITY__API_KEY_ENCRYPTION_KEY_FILE
              value: "/run/secrets/api_key_encryption_key"
          ports:
            - containerPort: 8007
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: enc-key
              mountPath: /run/secrets
              readOnly: true

          # startupProbe 门控启动期（60s 预算），通过后 readiness/liveness 立即接管
          startupProbe:
            httpGet:
              path: /health
              port: 8007
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: 8007
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8007
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: logs
          emptyDir: {}
        - name: enc-key
          secret:
            secretName: api-key-encryption-key
---
# Keep at least one replica during rollouts / node maintenance.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app-cloud
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: app-cloud
---
# CPU 60% autoscaling. Requires metrics-server: without it the HPA stays idle
# and replicas hold at the Deployment count (>= 2); it engages once installed.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app-cloud
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app-cloud
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

