# app-content — consolidated content-domain service (Go + Gin).
# Consolidated from the former app-board / app-note / app-quiz Deployments: ONE
# workload, ONE Service, ONE HTTPS listener (8004). All domains share the port:
# /board, /notes, /quiz, /tasks and /internal/*; external path semantics unchanged.
# Board TLS certs come from the app-board-certs Secret (generated once by
# scripts/gen-certs.sh locally; the directory/secret keep their historical
# "app-board" name — the cert volume/secret is preserved across the cutover);
# apisix mounts dev-ca.crt from the same Secret as its upstream TLS trust anchor.
# Cluster-internal only: reached via APISIX forward-auth, never exposed.
# Env parity with docker-compose.yml service 'app-content' (union of the three
# old services' env); shared secrets come from the mindbase-env Secret.
apiVersion: v1
kind: Service
metadata:
  name: app-content
  labels:
    app: app-content
spec:
  selector:
    app: app-content
  ports:
    - name: https
      port: 8004
      targetPort: 8004
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-content
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: app-content
  template:
    metadata:
      labels:
        app: app-content
    spec:
      # Run as the image's nonroot UID and make the emptyDir log volume group-
      # writable for it (k8s emptyDir does NOT inherit image directory ownership
      # the way a docker named volume does — without fsGroup lumberjack file
      # logging would fail silently here).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Union of the three old wait-deps: shared MySQL (board/note/quiz),
        # Mongo (board docs / note content / quiz questions), Redis
        # (board read cache + quiz share cache).
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306 && nc -z mongo 27017 && nc -z redis 6379; do echo waiting for mysql/mongo/redis; sleep 3; done"]
      containers:
        - name: app-content
          image: atoncooper/mind-base-app-content:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: mindbase-defaults
            - secretRef:
                name: mindbase-env
          env:
            # 统一数据源来自 mindbase-defaults（CONTENT__DATABASE__*：一个 MySQL
            # 池 / 一个 Mongo client / 一个 Redis client）；.env 同名键可覆盖。
            # /internal/* M2M 二次校验（与 APISIX consumer key 同值，fail-closed）
            - name: CONTENT__INTERNAL_API_KEY
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: APISIX_CONSUMER_KEY }
            - name: CONTENT__LOG__OUTPUT
              value: "both"
            # Explicit cert files from the Secret (no in-pod auto-generation,
            # so the apisix trust anchor is deterministic)
            - name: CONTENT__SERVER__TLS__ENABLED
              value: "true"
            - name: CONTENT__SERVER__TLS__CERT
              value: /app/certs/server.crt
            - name: CONTENT__SERVER__TLS__KEY
              value: /app/certs/server.key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: https
              containerPort: 8004
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: tls
              mountPath: /app/certs
              readOnly: true

          # 单端口/单探针：startup 验证 HTTPS listener + TLS 证书已加载；
          # readiness/liveness 打同一个 /health（任一域 MySQL 不可达 → 503
          # 拉出 Endpoints；Mongo/Redis 降级不摘节点）。
          startupProbe:
            httpGet:
              path: /health
              port: 8004
              scheme: HTTPS
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
              scheme: HTTPS
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
              scheme: HTTPS
            periodSeconds: 30
          # 旧三服务 limits 之和（board 250m + note 500m + quiz 500m / 3×512Mi）
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 1250m, memory: 1536Mi }
      volumes:
        - name: logs
          emptyDir: {}
        - name: tls
          secret:
            secretName: app-board-certs