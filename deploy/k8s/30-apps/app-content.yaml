# app-content — consolidated content-domain service (board 8004 / note 8008 / quiz 8011; Go + Gin).
# Consolidated from the former app-board / app-note / app-quiz Deployments: one
# workload, one Service, three listener ports. Path/port semantics are unchanged —
# 8004 = board (HTTPS-only, mind maps & whiteboards), 8008 = notes, 8011 = quiz.
# Board TLS certs come from the app-board-certs Secret (generated once by
# scripts/gen-certs.sh locally; the directory/secret keep their historical
# "app-board" name — the cert volume/secret is preserved across the cutover);
# apisix mounts dev-ca.crt from the same Secret as its upstream TLS trust anchor.
# Cluster-internal only: reached via APISIX forward-auth, never exposed.
# Env parity with docker-compose.yml service 'app-content' (union of the three
# old services' env); shared secrets come from the mindbase-env Secret.
apiVersion: v1
kind: Service
metadata:
  name: app-content
  labels:
    app: app-content
spec:
  selector:
    app: app-content
  ports:
    - name: https
      port: 8004
      targetPort: 8004
    - name: http-note
      port: 8008
      targetPort: 8008
    - name: http-quiz
      port: 8011
      targetPort: 8011
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-content
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: app-content
  template:
    metadata:
      labels:
        app: app-content
    spec:
      initContainers:
        # Union of the three old wait-deps: shared MySQL (board/note/quiz),
        # Mongo (board docs / note content / quiz questions), Redis
        # (board read cache + quiz share cache).
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306 && nc -z mongo 27017 && nc -z redis 6379; do echo waiting for mysql/mongo/redis; sleep 3; done"]
      containers:
        - name: app-content
          image: atoncooper/mind-base-app-content:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: mindbase-defaults
            - secretRef:
                name: mindbase-env
          env:
            # 连接串来自 mindbase-defaults（APPBOARD__REDIS__URL=/2 读缓存、
            # APPBOARD__RDBMS__URL、APPBOARD__MONGO__URI、APPNOTE__/APPQUIZ__RDBMS__URL）；
            # .env 同名键可覆盖。
            - name: APPBOARD__MONGO__DB_NAME
              value: MindBase
            - name: APPBOARD__LOG__OUTPUT
              value: "both"
            # Explicit cert files from the Secret (no in-pod auto-generation,
            # so the apisix trust anchor is deterministic)
            - name: APPBOARD__SERVER__TLS__ENABLED
              value: "true"
            - name: APPBOARD__SERVER__TLS__CERT
              value: /app/certs/server.crt
            - name: APPBOARD__SERVER__TLS__KEY
              value: /app/certs/server.key
            - name: APPNOTE__LOG__OUTPUT
              value: "both"
            - name: APPQUIZ__LOG__OUTPUT
              value: "both"
          ports:
            - name: https
              containerPort: 8004
            - name: http-note
              containerPort: 8008
            - name: http-quiz
              containerPort: 8011
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: tls
              mountPath: /app/certs
              readOnly: true

          # startupProbe 门控启动期（60s 预算）：打 board 的 HTTPS 监听口，验证
          # TLS 证书已加载（kubelet 探针不校验证书；与 APISIX https_verify_certificate:false
          # 同姿态）。通过后 readiness/liveness 接管——打 note 的 /health（MySQL
          # 不可达 → 503 拉出 Endpoints；Mongo 降级不摘节点，语义同旧 app-note）。
          startupProbe:
            httpGet:
              path: /health
              port: 8004
              scheme: HTTPS
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: 8008
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8008
            periodSeconds: 30
          # 旧三服务 limits 之和（board 250m + note 500m + quiz 500m / 3×512Mi）
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 1250m, memory: 1536Mi }
      volumes:
        - name: logs
          emptyDir: {}
        - name: tls
          secret:
            secretName: app-board-certs
