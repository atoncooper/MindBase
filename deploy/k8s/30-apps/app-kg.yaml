# app-kg — KG graph storage (Go + gRPC :8013; health :8014; Neo4j Cypher + video.kg_* bookkeeping) (port 8013).
# Env parity with docker-compose.yml service 'app-kg'; secrets come from the
# mindbase-env Secret (created once via kubectl create secret from .env).
apiVersion: v1
kind: Service
metadata:
  name: app-kg
  labels:
    app: app-kg
spec:
  selector:
    app: app-kg
  ports:
    - name: grpc
      port: 8013
      targetPort: 8013
    - name: health
      port: 8014
      targetPort: 8014
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-kg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-kg
  template:
    metadata:
      labels:
        app: app-kg
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306 && nc -z neo4j 7687; do echo waiting for mysql/neo4j; sleep 3; done"]
      containers:
        - name: app-kg
          image: atoncooper/mind-base-app-kg:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: mindbase-defaults
            - secretRef:
                name: mindbase-env
          env:
            - name: KG__URI
              value: "bolt://neo4j:7687"
            - name: APPKG__LOG__OUTPUT
              value: "both"
          ports:
            - containerPort: 8013
            - containerPort: 8014
          volumeMounts:
            - name: logs
              mountPath: /app/logs

          readinessProbe:
            httpGet:
              path: /health
              port: 8014
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8014
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: logs
          emptyDir: {}

