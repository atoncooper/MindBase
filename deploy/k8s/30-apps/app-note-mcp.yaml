# app-note-mcp — NOTEMCP MCP server (Go + mcp-go; agent tool surface) (port 8009).
# Env parity with docker-compose.yml service 'app-note-mcp'; secrets come from the
# mindbase-env Secret (created once via kubectl create secret from .env).
apiVersion: v1
kind: Service
metadata:
  name: app-note-mcp
  labels:
    app: app-note-mcp
spec:
  selector:
    app: app-note-mcp
  ports:
    - name: http
      port: 8009
      targetPort: 8009
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-note-mcp
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: app-note-mcp
  template:
    metadata:
      labels:
        app: app-note-mcp
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z apisix 9080; do echo waiting for apisix; sleep 3; done"]
      containers:
        - name: app-note-mcp
          image: atoncooper/mind-base-app-note-mcp:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: mindbase-defaults
            - secretRef:
                name: mindbase-env
          env:
            # ⚠️ optional secretKeyRef 的键在 Secret 缺失时变量整体省略，下游 $(VAR) 会
            # 原样保留成字面量（历史事故：NOTEMCP__UPSTREAM__UID="$(NOTE_MCP_UID)"）。
            # 可选键一律直接 valueFrom 到目标名；只有必选键（APISIX_CONSUMER_KEY）允许 $(VAR) 派生
            - name: APISIX_CONSUMER_KEY
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: APISIX_CONSUMER_KEY }
            - name: NOTE_MCP_UID
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: NOTE_MCP_UID, optional: true }
            - name: NOTE_MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: NOTE_MCP_AUTH_TOKEN, optional: true }
            - name: NOTEMCP__UPSTREAM__BASE_URL
              value: "http://apisix:9080"
            - name: NOTEMCP__UPSTREAM__API_KEY
              value: "$(APISIX_CONSUMER_KEY)"
            - name: NOTEMCP__UPSTREAM__UID
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: NOTE_MCP_UID, optional: true }
            - name: NOTEMCP__SERVER__AUTH_TOKEN
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: NOTE_MCP_AUTH_TOKEN, optional: true }
            - name: NOTEMCP__SERVER__SERVICE_API_KEY
              value: "$(APISIX_CONSUMER_KEY)"
            - name: NOTEMCP__LOG__OUTPUT
              value: "both"
            - name: NOTEMCP__LOG__FILE
              value: "/app/logs/app-note-mcp.log"
          ports:
            - containerPort: 8009
          volumeMounts:
            - name: logs
              mountPath: /app/logs

          # startupProbe 门控启动期（60s 预算），通过后 readiness/liveness 立即接管
          startupProbe:
            httpGet:
              path: /health
              port: 8009
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: 8009
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8009
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: logs
          emptyDir: {}

