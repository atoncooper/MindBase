# app-note — notes authority (Go + Gin; CRUD/anchors/revisions/share) (port 8008).
# Env parity with docker-compose.yml service 'app-note'; secrets come from the
# mindbase-env Secret (created once via kubectl create secret from .env).
apiVersion: v1
kind: Service
metadata:
  name: app-note
  labels:
    app: app-note
spec:
  selector:
    app: app-note
  ports:
    - name: http
      port: 8008
      targetPort: 8008
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-note
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: app-note
  template:
    metadata:
      labels:
        app: app-note
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306 && nc -z mongo 27017; do echo waiting for mysql/mongo; sleep 3; done"]
      containers:
        - name: app-note
          image: atoncooper/mind-base-app-note:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: mindbase-defaults
            - secretRef:
                name: mindbase-env
          env:
            - name: APPNOTE__LOG__OUTPUT
              value: "both"
          ports:
            - containerPort: 8008
          volumeMounts:
            - name: logs
              mountPath: /app/logs

          # startupProbe 门控启动期（60s 预算），通过后 readiness/liveness 立即接管
          startupProbe:
            httpGet:
              path: /health
              port: 8008
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: 8008
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8008
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: logs
          emptyDir: {}

