# app-quiz-mcp — QUIZMCP MCP server (Go + mcp-go; agent tool surface) (port 8012).
# Env parity with docker-compose.yml service 'app-quiz-mcp'; secrets come from the
# mindbase-env Secret (created once via kubectl create secret from .env).
apiVersion: v1
kind: Service
metadata:
  name: app-quiz-mcp
  labels:
    app: app-quiz-mcp
spec:
  selector:
    app: app-quiz-mcp
  ports:
    - name: http
      port: 8012
      targetPort: 8012
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-quiz-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-quiz-mcp
  template:
    metadata:
      labels:
        app: app-quiz-mcp
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z apisix 9080; do echo waiting for apisix; sleep 3; done"]
      containers:
        - name: app-quiz-mcp
          image: atoncooper/mind-base-app-quiz-mcp:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: mindbase-env
          env:
            - name: QUIZMCP__UPSTREAM__BASE_URL
              value: "http://apisix:9080"
            - name: QUIZMCP__UPSTREAM__API_KEY
              value: "$(APISIX_CONSUMER_KEY)"
            - name: QUIZMCP__UPSTREAM__UID
              value: "$(QUIZ_MCP_UID)"
            - name: QUIZMCP__SERVER__AUTH_TOKEN
              value: "$(QUIZ_MCP_AUTH_TOKEN)"
            - name: QUIZMCP__SERVER__SERVICE_API_KEY
              value: "$(APISIX_CONSUMER_KEY)"
            - name: QUIZMCP__LOG__OUTPUT
              value: "both"
            - name: QUIZMCP__LOG__FILE
              value: "/app/logs/app-quiz-mcp.log"
          ports:
            - containerPort: 8012
          volumeMounts:
            - name: logs
              mountPath: /app/logs

          readinessProbe:
            httpGet:
              path: /health
              port: 8012
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8012
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: logs
          emptyDir: {}

