# app-quiz — quiz storage authority (Go + Gin; history/wrong-answers/export/share/task detail+answer) (port 8011).
# Env parity with docker-compose.yml service 'app-quiz'; secrets come from the
# mindbase-env Secret (created once via kubectl create secret from .env).
apiVersion: v1
kind: Service
metadata:
  name: app-quiz
  labels:
    app: app-quiz
spec:
  selector:
    app: app-quiz
  ports:
    - name: http
      port: 8011
      targetPort: 8011
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-quiz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-quiz
  template:
    metadata:
      labels:
        app: app-quiz
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306 && nc -z mongo 27017 && nc -z redis 6379; do echo waiting for mysql/mongo/redis; sleep 3; done"]
      containers:
        - name: app-quiz
          image: atoncooper/mind-base-app-quiz:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: mindbase-env
          env:
            - name: APPQUIZ__RDBMS__URL
              value: "mysql+aiomysql://$(MYSQL_USER):$(MYSQL_PASSWORD)@mysql:3306/mind_base"
            - name: MONGO__URI
              value: "$(MONGO__URI)"
            - name: APPQUIZ__LOG__OUTPUT
              value: "both"
          ports:
            - containerPort: 8011
          volumeMounts:
            - name: logs
              mountPath: /app/logs

          readinessProbe:
            httpGet:
              path: /health
              port: 8011
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8011
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: logs
          emptyDir: {}

