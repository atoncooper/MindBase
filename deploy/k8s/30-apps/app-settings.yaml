# app-settings — user preferences/wallpaper (Go + Gin; BYOK retired) (port 8015).
# Env parity with docker-compose.yml service 'app-settings'; secrets come from the
# mindbase-env Secret (created once via kubectl create secret from .env).
apiVersion: v1
kind: Service
metadata:
  name: app-settings
  labels:
    app: app-settings
spec:
  selector:
    app: app-settings
  ports:
    - name: http
      port: 8015
      targetPort: 8015
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-settings
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-settings
  template:
    metadata:
      labels:
        app: app-settings
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306 && nc -z minio 9000; do echo waiting for mysql/minio; sleep 3; done"]
      containers:
        - name: app-settings
          image: atoncooper/mind-base-app-settings:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: mindbase-env
          env:
            - name: APPSETTINGS__RDBMS__URL
              value: "mysql+aiomysql://$(MYSQL_USER):$(MYSQL_PASSWORD)@mysql:3306/mind_base"
            - name: MINIO__ENDPOINT
              value: "http://minio:9000"
            - name: MINIO__ACCESS_KEY
              value: "$(MINIO_ACCESS_KEY)"
            - name: MINIO__SECRET_KEY
              value: "$(MINIO_SECRET_KEY)"
            - name: MINIO__BUCKET
              value: "$(MINIO_BUCKET)"
            - name: APPSETTINGS__LOG__OUTPUT
              value: "both"
          ports:
            - containerPort: 8015
          volumeMounts:
            - name: logs
              mountPath: /app/logs

          readinessProbe:
            httpGet:
              path: /health
              port: 8015
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8015
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: logs
          emptyDir: {}

