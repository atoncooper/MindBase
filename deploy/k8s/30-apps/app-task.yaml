# app-task — Go quiz task executor (port 8001). Uses its OWN MySQL instance
# (schema by db.Migrate); reaches the main app through APISIX.
apiVersion: v1
kind: Service
metadata:
  name: app-task
  labels:
    app: app-task
spec:
  selector:
    app: app-task
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-task
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-task
  template:
    metadata:
      labels:
        app: app-task
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z app-task-mysql 3306 && nc -z apisix 9080; do echo waiting for app-task-mysql/apisix; sleep 3; done"]
      containers:
        - name: app-task
          image: ghcr.io/atoncooper/mind-base-app-task:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: mindbase-env
          env:
            # Own database: independent MySQL instance (schema by db.Migrate)
            - name: APPTASK__RDBMS__URL
              value: mysql+aiomysql://$(APPTASK_MYSQL_USER):$(APPTASK_MYSQL_PASSWORD)@app-task-mysql:3306/app_task
            # Main app via APISIX gateway
            - name: APPTASK__APP__BASE_URL
              value: http://apisix:9080
            - name: APPTASK__APP__CONSUMER_KEY
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: APISIX_CONSUMER_KEY }
            # app-pay timeout-delegation callback CA (lazy-loaded; fallback
            # polling takes over when app-pay is not deployed)
            - name: APPTASK__HTTP_EXECUTOR__CA_FILE
              value: /app/pay-certs/ca.crt
            - name: APPTASK__TIMEZONE
              value: Asia/Shanghai
            - name: APPTASK__LOG__OUTPUT
              value: both
          ports:
            - containerPort: 8001
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: pay-ca
              mountPath: /app/pay-certs
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 512Mi }
      volumes:
        - name: logs
          emptyDir: {}
        - name: pay-ca
          secret:
            secretName: app-pay-tls
            items:
              - key: ca.crt
                path: ca.crt
