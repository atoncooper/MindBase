# app-task — Go quiz task executor (port 8001). Uses its OWN MySQL instance
# (schema by db.Migrate); reaches the main app through APISIX.
apiVersion: v1
kind: Service
metadata:
  name: app-task
  labels:
    app: app-task
spec:
  selector:
    app: app-task
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-task
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-task
  template:
    metadata:
      labels:
        app: app-task
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z app-task-mysql 3306 && nc -z apisix 9080; do echo waiting for app-task-mysql/apisix; sleep 3; done"]
      containers:
        - name: app-task
          image: atoncooper/app-task:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: mindbase-defaults
            - secretRef:
                name: mindbase-env
          env:
            # 独立库 URL 来自 mindbase-defaults（.env 的 APPTASK__RDBMS__URL 可覆盖）
            # Main app via APISIX gateway
            - name: APPTASK__APP__BASE_URL
              value: http://apisix:9080
            # 网关作用域执行器鉴权：派发到 apisix 的任务自动附 apikey 头
            - name: APISIX_CONSUMER_KEY
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: APISIX_CONSUMER_KEY }
            - name: APPTASK__APP__CONSUMER_KEY
              value: "$(APISIX_CONSUMER_KEY)"
            - name: APPTASK__HTTP_EXECUTOR__GATEWAY_HOSTS
              value: apisix:9080
            - name: APPTASK__HTTP_EXECUTOR__GATEWAY_API_KEY
              value: "$(APISIX_CONSUMER_KEY)"
            - name: NO_PROXY
              value: localhost,127.0.0.1,::1,apisix,app-auth,app-pay,app-pay-admin,app-cloud,app-board,app-board-mcp,app-task-mysql,mysql,mongo,redis,minio,higress,.local,.svc,.internal
            # app-pay timeout-delegation callback CA (lazy-loaded; fallback
            # polling takes over when app-pay is not deployed)
            - name: APPTASK__HTTP_EXECUTOR__CA_FILE
              value: /app/pay-certs/ca.crt
            - name: APPTASK__TIMEZONE
              value: Asia/Shanghai
            - name: APPTASK__LOG__OUTPUT
              value: both
          ports:
            - containerPort: 8001
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: pay-ca
              mountPath: /app/pay-certs
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 512Mi }
      volumes:
        - name: logs
          emptyDir: {}
        - name: pay-ca
          secret:
            secretName: app-pay-tls
            items:
              - key: ca.crt
                path: ca.crt
