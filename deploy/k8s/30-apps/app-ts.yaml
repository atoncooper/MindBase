# app-ts — AI domain service (chat/agent/RAG/KG AI/vectorizer/quiz AI/task-quiz/blindspot/skills) (port 8000).
# Env parity with docker-compose.yml service 'app-ts'; secrets come from the
# mindbase-env Secret (created once via kubectl create secret from .env).
apiVersion: v1
kind: Service
metadata:
  name: app-ts
  labels:
    app: app-ts
spec:
  selector:
    app: app-ts
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-ts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-ts
  template:
    metadata:
      labels:
        app: app-ts
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mongo 27017 && nc -z redis 6379 && nc -z minio 9000 && nc -z app-bili 8010 && nc -z app-auth 8006 && nc -z app-kg 8013; do echo waiting for mongo/redis/minio/app-bili/app-auth/app-kg; sleep 3; done"]
      containers:
        - name: app-ts
          image: atoncooper/mind-base-app-ts:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: mindbase-env
          env:
            - name: SERVER__HOST
              value: "0.0.0.0"
            - name: REDIS__URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/1"
            - name: APP_BILI_BASE_URL
              value: "http://app-bili:8010"
            - name: APP_TASK_BASE_URL
              value: "http://apisix:9080"
            - name: APP_AUTH_BASE_URL
              value: "http://app-auth:8006"
            - name: QUIZ_EXECUTOR_URL
              value: "http://apisix:9080/internal/quiz/generate-llm"
            - name: MINIO__ENDPOINT
              value: "http://minio:9000"
            - name: MINIO__ACCESS_KEY
              value: "$(MINIO_ACCESS_KEY)"
            - name: MINIO__SECRET_KEY
              value: "$(MINIO_SECRET_KEY)"
            - name: MINIO__BUCKET
              value: "$(MINIO_BUCKET)"
            - name: OCR__ENABLED
              value: "true"
            - name: OCR__MODEL
              value: "qwen-vl-ocr"
            - name: MONGO__URI
              value: "$(MONGO__URI)"
            - name: AI_GATEWAY__BASE_URL
              value: "http://higress:8080/v1"
            - name: AI_GATEWAY__API_KEY
              value: "$(AI_GATEWAY__API_KEY)"
            - name: APP_PAY_BASE_URL
              value: "http://apisix:9080/internal/pay"
            - name: APP_QUIZ_BASE_URL
              value: "http://apisix:9080/internal/quiz"
            - name: KGGRPC__TARGET
              value: "app-kg:8013"
            - name: KGGRPC__PROTO_PATH
              value: "/app/proto/kg/v1/kg.proto"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: logs
              mountPath: /app/logs

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 1Gi }
      volumes:
        - name: logs
          emptyDir: {}

