# app-ts — AI domain service (chat/agent/RAG/KG AI/vectorizer/quiz AI/task-quiz/blindspot/skills) (port 8000).
# Env parity with docker-compose.yml service 'app-ts'; secrets come from the
# mindbase-env Secret (created once via kubectl create secret from .env).
apiVersion: v1
kind: Service
metadata:
  name: app-ts
  labels:
    app: app-ts
spec:
  selector:
    app: app-ts
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-ts
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: app-ts
  template:
    metadata:
      labels:
        app: app-ts
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mongo 27017 && nc -z redis 6379 && nc -z minio 9000 && nc -z app-bili 8010 && nc -z app-auth 8006 && nc -z app-kg 8013; do echo waiting for mongo/redis/minio/app-bili/app-auth/app-kg; sleep 3; done"]
      containers:
        - name: app-ts
          image: atoncooper/mind-base-app-ts:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: mindbase-defaults
            - secretRef:
                name: mindbase-env
          env:
            - name: SERVER__HOST
              value: "0.0.0.0"
            - name: APP_BILI_BASE_URL
              value: "http://app-bili:8010"
            - name: APP_TASK_BASE_URL
              value: "http://apisix:9080"
            - name: APP_AUTH_BASE_URL
              value: "http://app-auth:8006"
            - name: QUIZ_EXECUTOR_URL
              value: "http://apisix:9080/internal/quiz/generate-llm"
            # .env 覆盖 AI_GATEWAY__BASE_URL 需 patch 此处（显式 env 优先于 envFrom）
            - name: AI_GATEWAY__BASE_URL
              value: "http://higress:8080/v1"
            - name: OCR__ENABLED
              value: "true"
            # GLM-5.3-flash vision-capable（qwen3-max 已被上游下线，勿改回）
            - name: OCR__MODEL
              value: "z-ai/glm-5.3-flash"
            - name: APP_PAY_BASE_URL
              value: "http://apisix:9080/internal/pay"
            - name: APP_QUIZ_BASE_URL
              value: "http://apisix:9080/internal/quiz"
            # env 名必须是 KG_GRPC__（KGGRPC__ 会被 loader 静默忽略 → gRPC 回落
            # 127.0.0.1 → KG 图存储 memory 降级、数据不持久化）
            - name: KG_GRPC__TARGET
              value: "app-kg:8013"
            - name: KG_GRPC__PROTO_PATH
              value: "/app/proto/kg/v1/kg.proto"
            # stdout-only：镜像 /app/logs 属主未修复前文件日志 EACCES 会崩进程
            - name: LOG__FILEENABLED
              value: "false"
            # MCP 桥（note/quiz/board）：凭证走服务模式 X-Api-Key（= APISIX_CONSUMER_KEY）
            - name: APISIX_CONSUMER_KEY
              valueFrom:
                secretKeyRef: { name: mindbase-env, key: APISIX_CONSUMER_KEY }
            - name: NOTE_MCP__URL
              value: "http://app-note-mcp:8009/mcp"
            - name: NOTE_MCP__API_KEY
              value: "$(APISIX_CONSUMER_KEY)"
            - name: QUIZ_MCP__URL
              value: "http://app-quiz-mcp:8012/mcp"
            - name: QUIZ_MCP__API_KEY
              value: "$(APISIX_CONSUMER_KEY)"
            - name: BOARD_MCP__URL
              value: "http://app-board-mcp:8005/mcp"
            - name: BOARD_MCP__API_KEY
              value: "$(APISIX_CONSUMER_KEY)"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: logs
              mountPath: /app/logs

          # startupProbe 门控启动期（60s 预算），通过后 readiness/liveness 立即接管
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 1Gi }
      volumes:
        - name: logs
          emptyDir: {}

