# nginx — SSL termination + routing (same nginx.conf/locations.conf as
# compose, mounted from ConfigMaps). The entry Service is LoadBalancer —
# on local clusters (Docker Desktop / kind / k3s) this binds the node port;
# on cloud providers it provisions a LB. Video/wallpaper caches are
# emptyDir (rebuildable); TLS certs come from the nginx-tls Secret.
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  # Entry is stateless (caches are per-pod emptyDir, TLS from a Secret) — 2 replicas remove the ingress single point
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: nginx
      initContainers:
        - name: wait-upstreams
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z frontend 3000 && nc -z app-ts 8000 && nc -z apisix 9080 && nc -z minio 9000; do echo waiting for frontend/app-ts/apisix/minio; sleep 3; done"]
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          # nginx.conf 的 resolver 写死了 Docker 内嵌 DNS 127.0.0.11（compose 专用）。
          # K8s 下启动时改写为本 Pod resolv.conf 的集群 DNS，再以改写后的副本启动，
          # 变量 proxy_pass（$apisix_upstream/$frontend_upstream/$minio_upstream）才能解析。
          command: ["/bin/sh", "-c"]
          args:
            - |
              NS=$(awk '/^nameserver/{print $2; exit}' /etc/resolv.conf)
              cp /etc/nginx/nginx.conf /tmp/nginx.conf
              sed -i "s/127\.0\.0\.11/${NS}/g" /tmp/nginx.conf
              exec nginx -g 'daemon off;' -c /tmp/nginx.conf
          ports:
            - containerPort: 80
            - containerPort: 443
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/locations.conf
              subPath: locations.conf
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/certs
              readOnly: true
            - name: certbot-www
              mountPath: /var/www/certbot
            - name: video-cache
              mountPath: /var/cache/nginx/video
            - name: wallpaper-cache
              mountPath: /var/cache/nginx/wallpaper
          startupProbe:
            httpGet:
              path: /
              port: 80
              scheme: HTTP
            periodSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: 80
              scheme: HTTP
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: conf
          configMap:
            name: nginx-conf
        - name: tls
          secret:
            secretName: nginx-tls
        - name: certbot-www
          emptyDir: {}
        - name: video-cache
          emptyDir: {}
        - name: wallpaper-cache
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginx
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: nginx
