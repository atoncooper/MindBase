# Warm pool of Python sandbox Pods used by the lifecycle server.
# The server allocates from this Pool when app-sandbox sends
# runtime.opensandbox.poolRef=pool-python (extensions.poolRef).
# Images are pinned to the OpenSandbox release versions; the execd installer
# must match the execd version used by the lifecycle server.
apiVersion: sandbox.opensandbox.io/v1alpha1
kind: Pool
metadata:
  name: pool-python
  namespace: opensandbox
  labels:
    app.kubernetes.io/part-of: mind-base
    app.kubernetes.io/component: sandbox-pool
spec:
  template:
    metadata:
      labels:
        app: mind-base-python-sandbox
    spec:
      volumes:
        - name: sandbox-storage
          emptyDir: {}
        - name: opensandbox-bin
          emptyDir: {}
        - name: sandbox-logs
          emptyDir: {}
      initContainers:
        - name: task-executor-installer
          image: sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/task-executor:v0.1.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              cp /workspace/server /opt/opensandbox/task-executor &&
              chmod +x /opt/opensandbox/task-executor
          volumeMounts:
            - name: opensandbox-bin
              mountPath: /opt/opensandbox
        - name: execd-installer
          image: sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/execd:release-1.2.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              cp ./execd /opt/opensandbox/execd &&
              cp ./bootstrap.sh /opt/opensandbox/bootstrap.sh &&
              chmod +x /opt/opensandbox/execd &&
              chmod +x /opt/opensandbox/bootstrap.sh
          volumeMounts:
            - name: opensandbox-bin
              mountPath: /opt/opensandbox
      containers:
        - name: sandbox
          image: sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/code-interpreter:v1.1.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              /opt/opensandbox/task-executor \
                -listen-addr=0.0.0.0:5758 \
                -log-dir=/tmp
          env:
            - name: SANDBOX_MAIN_CONTAINER
              value: main
            - name: EXECD_ENVS
              value: /opt/opensandbox/.env
            - name: EXECD
              value: /opt/opensandbox/execd
          volumeMounts:
            - name: sandbox-storage
              mountPath: /var/lib/sandbox
            - name: opensandbox-bin
              mountPath: /opt/opensandbox
            - name: sandbox-logs
              mountPath: /workspace/logs
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
  capacitySpec:
    bufferMin: 1
    bufferMax: 3
    poolMin: 1
    poolMax: 10
