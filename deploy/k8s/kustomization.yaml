# MindBase — Kubernetes deployment (kustomize base)
# Apply:  kubectl apply -k deploy/k8s
# Prereqs (secrets, one-time, from local files that are NOT committed):
#   kubectl -n mind-base create secret generic mindbase-env --from-env-file=.env
#   kubectl -n mind-base create secret generic api-key-encryption-key \
#     --from-file=api_key_encryption_key=secrets/api_key_encryption_key
#   kubectl -n mind-base create secret generic nginx-tls \
#     --from-file=fullchain.pem=secrets/certs/nginx/fullchain.pem \
#     --from-file=privkey.pem=secrets/certs/nginx/privkey.pem
#   kubectl -n mind-base create secret generic app-pay-tls \
#     --from-file=pay.crt=app-pay/certs/pay.crt --from-file=pay.key=app-pay/certs/pay.key \
#     --from-file=ca.crt=app-pay/certs/ca.crt
#   kubectl -n mind-base create secret generic app-board-certs \
#     --from-file=dev-ca.crt=secrets/certs/app-content/dev-ca.crt \
#     --from-file=server.crt=secrets/certs/app-content/server.crt \
#     --from-file=server.key=secrets/certs/app-content/server.key
#   # Optional (TLS for app-content-mcp; the pod mounts it as an OPTIONAL Secret):
#   kubectl -n mind-base create secret generic app-content-mcp-certs \
#     --from-file=dev-ca.crt=secrets/certs/app-content-mcp/dev-ca.crt \
#     --from-file=server.crt=secrets/certs/app-content-mcp/server.crt \
#     --from-file=server.key=secrets/certs/app-content-mcp/server.key
# See README.md for the full manual.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mind-base

# mindbase-defaults：compose ${VAR:-default} 的兜底值（dev 凭据与连接串，本就公开于 git）。
# 所有工作负载 envFrom 顺序 = [mindbase-defaults, mindbase-env]——同名键以 .env
# （mindbase-env Secret）为准，等价 compose 的 .env 覆盖语义；kustomize hash 变更自动滚动。
configMapGenerator:
  # mindbase-defaults：compose ${VAR:-default} 的**非密钥**兜底值。
  # 所有工作负载 envFrom 顺序 = [mindbase-defaults, mindbase-env]——同名键以 .env
  # （mindbase-env Secret）为准，等价 compose 的 .env 覆盖语义。
  # ⚠️ 安全边界：密码/API key/含凭据 DSN 一律不进本 ConfigMap（历史问题已修），
  # 只放用户名、库名、前缀、endpoint、可信代理网段等非敏感默认值；
  # RDBMS__URL / MONGO__URI / REDIS__URL / 各 `*_PASSWORD` 由 mindbase-env Secret 提供。
  - name: mindbase-defaults
    literals:
      - MYSQL_USER=mind_base
      - MONGO_USER=admin
      - CONTENT__DATABASE__MONGO__DATABASE=mind_base
      - CONTENT__DATABASE__MONGO__BOARD_DATABASE=MindBase
      - "CONTENT__DATABASE__REDIS__KEY_PREFIX=mind-base:"
      - MINIO__ENDPOINT=http://minio:9000
      - MINIO__BUCKET=drive-videos
      # Pod CIDR of the cluster (UI Nginx -> API): trusted for X-Forwarded-*.
      - APPADMIN__SECURITY__TRUSTED_PROXIES=10.0.0.0/8
      - APPTASK_MYSQL_USER=app_task
      - PAY_MYSQL_USER=app_pay
      - AI_GATEWAY__BASE_URL=http://higress:8080/v1

# NOTE: mysql-init-sql / apisix-config / nginx-conf / mysql-conf / mongo-conf /
# redis-conf / etcd-conf ConfigMaps are NOT generated here — their source files
# live outside this directory (db/, apisix/, nginx/, deploy/config/), which
# kustomize's load restrictor forbids referencing. Create them once with kubectl
# from those files (deploy/config ones are documented in deploy/config/README.md)
# — see README.md §1.

resources:
  - 00-namespace.yaml
  - 20-data/mysql.yaml
  - 20-data/mysql-extras.yaml
  - 20-data/mongo.yaml
  - 20-data/redis.yaml
  - 20-data/etcd.yaml
  - 20-data/minio.yaml
  - 20-data/milvus.yaml
  - 20-data/neo4j.yaml
  - 30-apps/app-ts.yaml
  - 30-apps/app-user.yaml
  - 30-apps/app-cloud.yaml
  - 30-apps/app-content.yaml
  - 30-apps/app-kg.yaml
  - 30-apps/app-content-mcp.yaml
  - 30-apps/app-task.yaml
  - 30-apps/app-pay.yaml
  - 30-apps/app-admin.yaml
  - 30-apps/app-sandbox.yaml
  - 30-apps/frontend.yaml
  - 30-apps/apisix.yaml
  # - 30-apps/higress.yaml   # Higress 跑在独立服务器(106.53.220.71)，不随集群部署；恢复时取消注释
  - 30-apps/nginx.yaml

# 数据层节点分工（README §7）：component 常驻启用，把 9 个带 PVC 的数据 workload
# 钉到 database1/database2（tolerations 配套 dedicated=database 污点）；不想钉节点时注释掉本行
components:
  - components/node-split

# ── 运维旋钮：镜像版本集中覆盖（kustomize images transformer）──────────────
# 缺省用各清单内 tag；升级/回滚时取消注释改 newTag（生产建议加 digest 钉死），
# 无需逐个改 30-apps/*.yaml。name 填清单里的镜像名（不带 tag）。
# images:
#   - name: atoncooper/mind-base-app-ts
#     newTag: latest          # ← 改成具体版本号或注释 digest: sha256:...
#   - name: atoncooper/mind-base-app-pay
#     newTag: latest
#   - name: atoncooper/mind-base-minio
#     newTag: latest
#   - name: milvusdb/milvus
#     newTag: v2.6.22
#   - name: mysql
#     newTag: "8.4"
