# MindBase — Kubernetes deployment (kustomize base)
# Apply:  kubectl apply -k deploy/k8s
# Prereqs (secrets, one-time, from local files that are NOT committed):
#   kubectl -n mind-base create secret generic mindbase-env --from-env-file=.env
#   kubectl -n mind-base create secret generic api-key-encryption-key \
#     --from-file=api_key_encryption_key=secrets/api_key_encryption_key
#   kubectl -n mind-base create secret generic nginx-tls \
#     --from-file=fullchain.pem=nginx/certs/fullchain.pem \
#     --from-file=privkey.pem=nginx/certs/privkey.pem
#   kubectl -n mind-base create secret generic app-pay-tls \
#     --from-file=pay.crt=app-pay/certs/pay.crt --from-file=pay.key=app-pay/certs/pay.key \
#     --from-file=ca.crt=app-pay/certs/ca.crt
#   kubectl -n mind-base create secret generic app-board-certs \
#     --from-file=dev-ca.crt=app-board/certs/dev-ca.crt \
#     --from-file=server.crt=app-board/certs/server.crt \
#     --from-file=server.key=app-board/certs/server.key
# See README.md for the full manual.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mind-base

# mindbase-defaults：compose ${VAR:-default} 的兜底值（dev 凭据与连接串，本就公开于 git）。
# 所有工作负载 envFrom 顺序 = [mindbase-defaults, mindbase-env]——同名键以 .env
# （mindbase-env Secret）为准，等价 compose 的 .env 覆盖语义；kustomize hash 变更自动滚动。
configMapGenerator:
  - name: mindbase-defaults
    literals:
      - MYSQL_USER=mind_base
      - MYSQL_PASSWORD=mind-base
      - MYSQL_ROOT_PASSWORD=root123
      - MONGO_USER=admin
      - MONGO_PASSWORD=mind-base
      - MONGO__URI=mongodb://admin:mind-base@mongo:27017/?authSource=admin
      - APPBOARD__MONGO__URI=mongodb://admin:mind-base@mongo:27017/?authSource=admin
      - REDIS_PASSWORD=mind-base
      - REDIS__URL=redis://:mind-base@redis:6379/1
      - APPBOARD__REDIS__URL=redis://:mind-base@redis:6379/2
      - NEO4J_PASSWORD=mind-base
      - KG__PASSWORD=mind-base
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO__ENDPOINT=http://minio:9000
      - MINIO__ACCESS_KEY=minioadmin
      - MINIO__SECRET_KEY=minioadmin
      - MINIO__BUCKET=drive-videos
      - RDBMS__URL=mysql+aiomysql://mind_base:mind-base@mysql:3306/mind_base
      - APPAUTH__RDBMS__URL=mysql+aiomysql://mind_base:mind-base@mysql:3306/mind_base
      - APPCLOUD__RDBMS__URL=mysql+aiomysql://mind_base:mind-base@mysql:3306/mind_base
      - APPNOTE__RDBMS__URL=mysql+aiomysql://mind_base:mind-base@mysql:3306/mind_base
      - APPQUIZ__RDBMS__URL=mysql+aiomysql://mind_base:mind-base@mysql:3306/mind_base
      - APPKG__RDBMS__URL=mysql+aiomysql://mind_base:mind-base@mysql:3306/mind_base
      - APPSETTINGS__RDBMS__URL=mysql+aiomysql://mind_base:mind-base@mysql:3306/mind_base
      - APPBILI__RDBMS__URL=mysql+aiomysql://mind_base:mind-base@mysql:3306/mind_base
      - APPBOARD__RDBMS__URL=mysql+aiomysql://mind_base:mind-base@mysql:3306/mind_base
      - APPTASK__RDBMS__URL=mysql+aiomysql://app_task:app-task@app-task-mysql:3306/app_task
      - PAYADMIN__RDBMS__URL=mysql+aiomysql://app_pay:app-pay@app-pay-mysql:3306/app_pay
      - APPTASK_MYSQL_ROOT_PASSWORD=root123
      - APPTASK_MYSQL_USER=app_task
      - APPTASK_MYSQL_PASSWORD=app-task
      - PAY_MYSQL_ROOT_PASSWORD=root123
      - PAY_MYSQL_USER=app_pay
      - PAY_MYSQL_PASSWORD=app-pay
      - AI_GATEWAY__BASE_URL=http://higress:8080/v1

# NOTE: mysql-init-sql / apisix-config / nginx-conf ConfigMaps are NOT
# generated here — their source files live at the repo root (db/, apisix/,
# nginx/), which kustomize's load restrictor forbids referencing (and
# kubectl ≥1.36 rejects loadRestrictions: LoadRestrictionsNone). Create them
# once with kubectl, exactly like the secrets — see README.md §1.

resources:
  - 00-namespace.yaml
  - 20-data/mysql.yaml
  - 20-data/mysql-extras.yaml
  - 20-data/mongo.yaml
  - 20-data/redis.yaml
  - 20-data/etcd.yaml
  - 20-data/minio.yaml
  - 20-data/milvus.yaml
  - 20-data/neo4j.yaml
  - 30-apps/app-ts.yaml
  - 30-apps/app-auth.yaml
  - 30-apps/app-cloud.yaml
  - 30-apps/app-note.yaml
  - 30-apps/app-bili.yaml
  - 30-apps/app-quiz.yaml
  - 30-apps/app-kg.yaml
  - 30-apps/app-settings.yaml
  - 30-apps/app-board.yaml
  - 30-apps/app-board-mcp.yaml
  - 30-apps/app-note-mcp.yaml
  - 30-apps/app-quiz-mcp.yaml
  - 30-apps/app-task.yaml
  - 30-apps/app-pay.yaml
  - 30-apps/app-pay-admin.yaml
  - 30-apps/frontend.yaml
  - 30-apps/apisix.yaml
  - 30-apps/higress.yaml
  - 30-apps/nginx.yaml
