# MindBase — Kubernetes deployment (kustomize base)
# Apply:  kubectl apply -k deploy/k8s
# Prereqs (secrets, one-time, from local files that are NOT committed):
#   kubectl -n mind-base create secret generic mindbase-env --from-env-file=.env
#   kubectl -n mind-base create secret generic api-key-encryption-key \
#     --from-file=api_key_encryption_key=secrets/api_key_encryption_key
#   kubectl -n mind-base create secret generic nginx-tls \
#     --from-file=fullchain.pem=nginx/certs/fullchain.pem \
#     --from-file=privkey.pem=nginx/certs/privkey.pem
#   kubectl -n mind-base create secret generic app-pay-tls \
#     --from-file=pay.crt=app-pay/certs/pay.crt --from-file=pay.key=app-pay/certs/pay.key \
#     --from-file=ca.crt=app-pay/certs/ca.crt
#   kubectl -n mind-base create secret generic app-board-certs \
#     --from-file=dev-ca.crt=app-board/certs/dev-ca.crt \
#     --from-file=server.crt=app-board/certs/server.crt \
#     --from-file=server.key=app-board/certs/server.key
# See README.md for the full manual.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mind-base

# NOTE: mysql-init-sql / apisix-config / nginx-conf ConfigMaps are NOT
# generated here — their source files live at the repo root (db/, apisix/,
# nginx/), which kustomize's load restrictor forbids referencing (and
# kubectl ≥1.36 rejects loadRestrictions: LoadRestrictionsNone). Create them
# once with kubectl, exactly like the secrets — see README.md §1.

resources:
  - 00-namespace.yaml
  - 20-data/mysql.yaml
  - 20-data/mysql-extras.yaml
  - 20-data/mongo.yaml
  - 20-data/redis.yaml
  - 20-data/etcd.yaml
  - 20-data/minio.yaml
  - 20-data/milvus.yaml
  - 20-data/neo4j.yaml
  - 30-apps/app-ts.yaml
  - 30-apps/app-auth.yaml
  - 30-apps/app-cloud.yaml
  - 30-apps/app-note.yaml
  - 30-apps/app-bili.yaml
  - 30-apps/app-quiz.yaml
  - 30-apps/app-kg.yaml
  - 30-apps/app-settings.yaml
  - 30-apps/app-board.yaml
  - 30-apps/app-board-mcp.yaml
  - 30-apps/app-note-mcp.yaml
  - 30-apps/app-quiz-mcp.yaml
  - 30-apps/app-task.yaml
  - 30-apps/app-pay.yaml
  - 30-apps/app-pay-admin.yaml
  - 30-apps/frontend.yaml
  - 30-apps/apisix.yaml
  - 30-apps/higress.yaml
  - 30-apps/nginx.yaml
