# ================================================================
# MindBase — Infrastructure StatefulSets
# ================================================================
# MySQL 8.4 + Redis 7 + MongoDB 7 + MinIO object storage.
# Each runs as a single-replica StatefulSet with persistent storage.
# For production HA, increase replicas and configure replication.
# ================================================================

---
# ==============================================================
# MySQL 8.4
# ==============================================================
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: mindbase
  labels:
    app: mysql
    app.kubernetes.io/part-of: mindbase
spec:
  clusterIP: None                     # headless — StatefulSet pods get stable DNS
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: mindbase
  labels:
    app: mysql
    app.kubernetes.io/part-of: mindbase
spec:
  serviceName: mysql
  replicas: 1                         # single-node; for HA use MySQL Operator / Galera
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mindbase-secrets
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: "mind_base"
            - name: MYSQL_USER
              value: "mind_base"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mindbase-secrets
                  key: mysql-password
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
                - -u
                - root
                - -p$(MYSQL_ROOT_PASSWORD)
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
                - -u
                - root
                - -p$(MYSQL_ROOT_PASSWORD)
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: mindbase
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: mindbase-fast
        resources:
          requests:
            storage: 50Gi

---
# ==============================================================
# Redis 7
# ==============================================================
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: mindbase
  labels:
    app: redis
    app.kubernetes.io/part-of: mindbase
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: mindbase
  labels:
    app: redis
    app.kubernetes.io/part-of: mindbase
spec:
  serviceName: redis
  replicas: 1                         # single-node; use Redis Sentinel / Cluster for HA
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
          args:
            - --requirepass
            - $(REDIS_PASSWORD)
            - --maxmemory
            - "512mb"
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - "900"
            - "1"
            - --save
            - "300"
            - "10"
            - --notify-keyspace-events
            - Ex
          ports:
            - containerPort: 6379
              name: redis
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mindbase-secrets
                  key: redis-password
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          readinessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - $(REDIS_PASSWORD)
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - $(REDIS_PASSWORD)
                - ping
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: mindbase
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: mindbase-fast
        resources:
          requests:
            storage: 20Gi

---
# ==============================================================
# MongoDB 7
# ==============================================================
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: mindbase
  labels:
    app: mongo
    app.kubernetes.io/part-of: mindbase
spec:
  clusterIP: None
  selector:
    app: mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: mindbase
  labels:
    app: mongo
    app.kubernetes.io/part-of: mindbase
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
              name: mongo
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "admin"
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mindbase-secrets
                  key: mongo-root-password
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - db.adminCommand('ping')
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - db.adminCommand('ping')
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: mindbase
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: mindbase-fast
        resources:
          requests:
            storage: 50Gi

---
# ==============================================================
# MinIO — Object Storage
# ==============================================================
# Used by:
#   - Milvus (vector index backing store)
#   - MindBase cloud drive (user file uploads)
#   - Iceberg data lake (warehouse)
#   - Spark / Flink (checkpointing + data I/O)
# ==============================================================
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: mindbase
  labels:
    app: minio
    app.kubernetes.io/part-of: mindbase
spec:
  clusterIP: None
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: mindbase
  labels:
    app: minio
    app.kubernetes.io/part-of: mindbase
spec:
  serviceName: minio
  replicas: 1                         # single-node; for HA use MinIO Operator (4+ nodes)
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-11-07T00-52-20Z
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: mindbase-secrets
                  key: minio-root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mindbase-secrets
                  key: minio-root-password
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: mindbase
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: mindbase-standard
        resources:
          requests:
            storage: 200Gi
