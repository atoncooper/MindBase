# ================================================================
# MindBase — Ingress
# ================================================================
# Requires: nginx-ingress or similar ingress controller.
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml
#
# For TLS, install cert-manager and add a Certificate resource.
# ================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mindbase
  namespace: mindbase
  labels:
    app.kubernetes.io/part-of: mindbase
  annotations:
    # Ingress class (nginx)
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    # SSE — disable buffering for chat streaming
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # CORS (optional, handled by backend)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    # TLS — uncomment when cert-manager is installed
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts:
  #       - mindbase.example.com
  #     secretName: mindbase-tls
  rules:
    - host: mindbase.example.com       # <-- change to your domain
      http:
        paths:
          # Health
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Swagger docs
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # MinIO console (admin)
          - path: /minio
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9001
          # Frontend — catch-all
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
