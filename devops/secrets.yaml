# ================================================================
# MindBase — Secrets (placeholders — fill before applying!)
# ================================================================
# NEVER commit real secrets. Generate with:
#   echo -n "your-value" | base64
#
# For production, use a secret manager:
#   - AWS Secrets Manager + External Secrets Operator
#   - HashiCorp Vault + vault-secrets-webhook
#   - Sealed Secrets (bitnami/sealed-secrets)
#   - SOPS + age (fluxcd/kustomize)
# ================================================================

apiVersion: v1
kind: Secret
metadata:
  name: mindbase-secrets
  namespace: mindbase
  labels:
    app.kubernetes.io/part-of: mindbase
type: Opaque
stringData:
  # ---- LLM / AI ----
  llm-api-key: "sk-CHANGE-ME"
  llm-base-url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  asr-api-key: ""
  # ---- Database ----
  mysql-root-password: "CHANGE-ME-root-password"
  mysql-password: "CHANGE-ME-user-password"
  mongo-root-password: "CHANGE-ME-mongo-password"
  redis-password: "CHANGE-ME-redis-password"
  # ---- Session & Security ----
  session-secret: "CHANGE-ME-48-char-random"
  api-key-encryption-key: "CHANGE-ME-32-byte-base64"
  # ---- MinIO ----
  minio-root-user: "minioadmin"
  minio-root-password: "CHANGE-ME-minio-password"
  # ---- Kafka (SASL/SCRAM) ----
  kafka-admin-user: "admin"
  kafka-admin-password: "CHANGE-ME-kafka-admin"
  kafka-client-user: "mindbase"
  kafka-client-password: "CHANGE-ME-kafka-client"
  # ---- LangSmith (optional) ----
  langsmith-api-key: ""
