# ================================================================
# MindBase — Storage Classes
# ================================================================
# Fast SSD-backed storage for databases and vector indices.
# Standard HDD-backed storage for object storage and logs.
#
# Adjust provisioner and parameters to match your cluster:
#   - AWS EBS:  kubernetes.io/aws-ebs  (gp3 / sc1)
#   - GCP PD:   kubernetes.io/gce-pd   (pd-ssd / pd-standard)
#   - Azure:    kubernetes.io/azure-disk
#   - On-prem:  use Longhorn / OpenEBS / local-path
# ================================================================

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: mindbase-fast
  labels:
    app.kubernetes.io/part-of: mindbase
provisioner: kubernetes.io/aws-ebs        # <-- change for your cloud
parameters:
  type: gp3
  fsType: ext4
reclaimPolicy: Retain                     # keep data after PVC deletion
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer   # wait until pod is scheduled

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: mindbase-standard
  labels:
    app.kubernetes.io/part-of: mindbase
provisioner: kubernetes.io/aws-ebs
parameters:
  type: gp3
  fsType: ext4
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
