# ================================================================
# MindBase — full-stack development / deployment
# ================================================================
# Stack: app-ts (AI/agent) + app-go services + app-pay + infra + apisix.
# The Python backend was retired (2026-10-06); every route targets
# app-ts / app-go services via APISIX.
#
# Image model (build local, publish remote):
#   - Every first-party service carries BOTH image: (the tag CI/CD publishes
#     to Docker Hub via .github/workflows/docker-build.yml) AND build: (local
#     source). 'docker compose up' therefore builds locally when the image is
#     absent and NEVER pulls first-party images from the registry;
#     'docker compose build' rebuilds them all offline.
#   - EXCEPTION atoncooper/app-task: remote pull ONLY — source
#     lives in the standalone repo (no local Dockerfile context).
#   - nginx/mysql/redis/mongo/milvus/neo4j/etcd/apisix/higress/... are upstream
#     third-party releases, pulled as-is.
# NOTE: services tagged with "" profile start by default, so plain
# `docker compose up` actually starts the FULL stack (incl. Milvus). Named
# profiles are additive only when no --profile is given; once you pass
# --profile X, "" services no longer auto-start. Profile membership below is
# set so every depends_on target is present in each profile its dependents
# run in.
#
# Full stack (app + infra + Milvus + apisix + app-task):  docker compose up -d
# Task-quiz only (app + apisix + app-task, no Milvus):    docker compose --profile task up -d
# + Milvus, no task-quiz:                                 docker compose --profile storage up -d
# App only (external DB):                                 docker compose --profile standalone up -d
# Everything + admin tools (redis-commander, mongo-express): docker compose --profile full up -d
# + Higress AI gateway (unified egress for AI requests):     docker compose --profile ai up -d

services:
  # ==============================================================
  # Application
  # ==============================================================

  frontend:
    profiles: ["", "standalone", "storage", "full", "task"]
    image: atoncooper/mind-base-frontend:latest
    pull_policy: never  # 本地构建产物;绝不拉 Hub——镜像缺失时先 docker compose build <服务>
    build:
      context: ./frontendv2
      dockerfile: Dockerfile
      # Build-time env consumed by next.config.ts rewrites(). NEXT_PUBLIC_* vars
      # are inlined at build time, so they must be passed here (runtime env has
      # no effect on them). Source lives in frontendv2/ (first-gen frontend/ removed).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_APISIX_HOST: nginx:80
        # rewrites 构建时固化，MinIO 同源代理目标必须是 build arg（非运行时 env）
        MINIO_PROXY_DEST: http://nginx:80
    container_name: mind-base-frontend
    # Port exposed for local access; in production nginx handles all traffic
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - NEXT_PUBLIC_APISIX_HOST=nginx:80
      # MinIO 同源代理目标（rewrites 在服务端运行时读取，非 NEXT_PUBLIC）
      - MINIO_PROXY_DEST=http://nginx:80
      # 分享链接对外地址（/api/share-base 运行时读取；空 = 公网IP探测 → 回退当前访问地址）
      - SHARE_DOMAIN=${SHARE_DOMAIN:-}
      - SHARE_PUBLIC_IP=${SHARE_PUBLIC_IP:-}
    restart: unless-stopped
    networks:
      - mind-base-net

  # ==============================================================
  # TLS certificate provisioning (one-shot init container)
  # ==============================================================
  # Runs scripts/gen-certs.sh on every `docker compose up` BEFORE the
  # TLS-consuming services start, so a fresh clone gets working certs/keys
  # with zero manual steps: nginx 443 (nginx exits without them), app-pay
  # (startup self-check refuses to boot without them), app-board /
  # app-board-mcp leaves, and the shared dev CA that APISIX + app-task trust.
  # Idempotent: valid files are reused, expiring ones re-signed.

  cert-gen:
    image: atoncooper/mind-base-certgen:latest
    pull_policy: never  # 本地构建产物;绝不拉 Hub——镜像缺失时先 docker compose build <服务>
    build:
      context: ./scripts
      dockerfile: certgen.Dockerfile
    container_name: mind-base-cert-gen
    environment:
      MB_CERT_NGINX_DIR: /out/nginx
      MB_CERT_APPBOARD_DIR: /out/app-board
      MB_CERT_MCP_DIR: /out/mcp
      MB_CERT_PAY_DIR: /out/pay
      # 分享域名（.env SHARE_DOMAIN）纳入 nginx 叶子证书 SAN，浏览器直开
      # https://<域名> 不再报证书域名不匹配
      MB_CERT_EXTRA_SAN: ${SHARE_DOMAIN:-}
    volumes:
      - ./nginx/certs:/out/nginx
      - ./app-board/certs:/out/app-board
      - ./mcp/app-board-mcp/certs:/out/mcp
      - ./app-pay/certs:/out/pay
    restart: "no"

  # ==============================================================
  # Reverse Proxy (Nginx) — SSL termination + routing
  # ==============================================================

  nginx:
    profiles: ["", "standalone", "storage", "full"]
    image: nginx:alpine
    container_name: mind-base-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/locations.conf:/etc/nginx/locations.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot
      - nginx_video_cache:/var/cache/nginx/video   # Plan 0021
      - nginx_wallpaper_cache:/var/cache/nginx/wallpaper   # wallpaper image cache
    depends_on:
      cert-gen:
        condition: service_completed_successfully
      frontend:
        condition: service_started
      # nginx proxies apisix + minio (direct proxy_pass in locations.conf).
      # Upstream hostnames resolve at request time now (resolver + variable
      # proxy_pass, see nginx.conf), so a missing container no longer crashes
      # startup — waiting here just avoids initial 502s until they are ready.
      apisix:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mind-base-net

  # ==============================================================
  # Infrastructure
  # ==============================================================

  mysql:
    image: mysql:8.4
    container_name: mind-base-mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=mind_base
      - MYSQL_USER=${MYSQL_USER:-mind_base}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-mind-base}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/system.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mind-base-net

  # app-task's OWN MySQL instance — app-task does not share a database with
  # the main app anymore (decoupled). Schema is created by app-task's db.Migrate.
  app-task-mysql:
    image: mysql:8.4
    container_name: mind-base-app-task-mysql
    profiles: ["", "task", "full"]
    environment:
      - MYSQL_ROOT_PASSWORD=${APPTASK_MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=app_task
      - MYSQL_USER=${APPTASK_MYSQL_USER:-app_task}
      - MYSQL_PASSWORD=${APPTASK_MYSQL_PASSWORD:-app-task}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - app_task_mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${APPTASK_MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mind-base-net

  # app-pay MySQL —— 交易/会员服务独立实例（Spring Boot）
  app-pay-mysql:
    image: mysql:8.4
    container_name: mind-base-app-pay-mysql
    # "pay-admin"：让 `--profile pay-admin up` 能连带拉起其依赖的 MySQL
    profiles: ["", "pay", "pay-admin", "full"]
    environment:
      - MYSQL_ROOT_PASSWORD=${PAY_MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=app_pay
      - MYSQL_USER=${PAY_MYSQL_USER:-app_pay}
      - MYSQL_PASSWORD=${PAY_MYSQL_PASSWORD:-app-pay}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 仅回环暴露供本地 IDE 调试；生产不暴露
      - "127.0.0.1:${PAY_MYSQL_PORT:-3307}:3306"
    volumes:
      - app_pay_mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${PAY_MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mind-base-net

  redis:
    image: redis:7-alpine
    container_name: mind-base-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-mind-base}
      --notify-keyspace-events Ex
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mind-base}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mind-base-net

  mongo:
    image: mongo:7
    container_name: mind-base-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-mind-base}
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mind-base-net

  milvus:
    image: milvusdb/milvus:v2.6.22
    container_name: mind-base-milvus
    profiles: ["", "storage", "full"]
    command: milvus run standalone
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_GRPC_PORT:-9091}:9091"
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - milvus_data:/var/lib/milvus
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - mind-base-net

  # Knowledge graph store (KG feature).
  # Optional at runtime: the AI stack degrades gracefully when it is down or
  # kg.enabled=false (kg_search tool simply won't register).
  neo4j:
    image: neo4j:5-community
    container_name: mind-base-neo4j
    profiles: ["", "storage", "full"]
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # Browser UI (dev/debug only)
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # Bolt protocol (app connects here)
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-mind-base}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - mind-base-net

  # Agent + RAG service (Node/Fastify) — the chat/agent/RAG face (chat cutover).
  # Build context is the repo ROOT: the image needs proto/kg/v1/kg.proto (gRPC)
  # and prompts/*.md. Own store = Mongo mind_base_ts (isolated from Python).
  app-ts:
    image: atoncooper/mind-base-app-ts:latest
    # missing（非 build）：registry 被 DNS 污染时 build 无法解析元数据；
    # 镜像已在本地（commit 修补过 /app/logs 属主），missing=不构建不拉取。
    # 网络恢复后改回 pull_policy: build 并 docker compose build app-ts。
    pull_policy: missing
    build:
      context: .
      dockerfile: app-ts/Dockerfile
    container_name: mind-base-app-ts
    profiles: ["", "ts", "full"]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SERVER__HOST=0.0.0.0
      # Redis event bridge (bili:page_ready -> per-page vectorization)
      - REDIS__URL=${REDIS__URL:-redis://:mind-base@redis:6379/1}
      # acquisition service (Go): ASR delegation + internal knowledge-scope reads
      - APP_BILI_BASE_URL=http://app-bili:8010
      # task-quiz flow: scheduler via APISIX + auth internal user lookup
      - APP_TASK_BASE_URL=http://apisix:9080
      - APP_AUTH_BASE_URL=http://app-auth:8006
      - QUIZ_EXECUTOR_URL=http://apisix:9080/internal/quiz/generate-llm
      # skills zip storage (shared bucket; empty endpoint = skills disabled)
      - MINIO__ENDPOINT=${MINIO__ENDPOINT:-http://minio:9000}
      - MINIO__ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO__SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO__BUCKET=${MINIO_BUCKET:-drive-videos}
      # OCR (image documents) — vision model via the Higress gateway; the model
      # name must be routed in the Higress console (dashscope qwen-vl-ocr)
      - OCR__ENABLED=${OCR__ENABLED:-true}
      - OCR__MODEL=${OCR__MODEL:-qwen-vl-ocr}
      - MONGO__URI=${MONGO__URI:-mongodb://admin:mind-base@mongo:27017/?authSource=admin}
      - AI_GATEWAY__BASE_URL=${AI_GATEWAY__BASE_URL:-http://higress:8080/v1}
      - AI_GATEWAY__API_KEY=${AI_GATEWAY__API_KEY:-}
      # membership tier (weighted admission) via APISIX key-auth internal route
      - APP_PAY_BASE_URL=http://apisix:9080/internal/pay
      # app-quiz storage writes for quiz AI orchestration (APISIX key-auth route)
      - APP_QUIZ_BASE_URL=http://apisix:9080/internal/quiz
      # gRPC data faces (kg graph + chat folder scope; same app-kg service)
      - KGGRPC__TARGET=app-kg:8013
      - KGGRPC__PROTO_PATH=/app/proto/kg/v1/kg.proto
      # milvus.address 的 env 名是 MILVUS__ADDRESS（MILVUS__URI 不是本服务
      # 的配置键,会被静默忽略回落 127.0.0.1——容器内即自身）;host:port
      # 不带 scheme（milvus-js SDK 约定）
      - MILVUS__ADDRESS=milvus:19530
      # stdout-only logging: the image's /app/logs is not pre-created with
      # node ownership (Dockerfile chown fix pending rebuild), and pino
      # aborts the process on EACCES when the file sink is enabled
      - LOG__FILEENABLED=false
    ports:
      # 8000 = the port the retired Python backend owned; app-ts inherits it.
      # (app-note keeps host 8008 — the clash that existed before the move.)
      - "127.0.0.1:${APP_TS_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - mind-base-net

  app-settings:
    image: atoncooper/mind-base-app-settings:latest
    pull_policy: never  # 本地构建产物;绝不拉 Hub——镜像缺失时先 docker compose build <服务>
    build:
      context: ./app-go/app-settings
      dockerfile: Dockerfile
    container_name: mind-base-app-settings
    profiles: ["", "settings", "full"]
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - APPSETTINGS__RDBMS__URL=${RDBMS__URL:-mysql+aiomysql://mind_base:mind-base@mysql:3306/mind_base}
      # wallpaper storage (shared bucket; empty endpoint = wallpaper 503)
      - MINIO__ENDPOINT=${MINIO__ENDPOINT:-http://minio:9000}
      - MINIO__ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO__SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO__BUCKET=${MINIO_BUCKET:-drive-videos}
      - APPSETTINGS__LOG__OUTPUT=both
    ports:
      - "127.0.0.1:${APP_SETTINGS_PORT:-8015}:8015"
    volumes:
      - app_settings_logs:/app/logs
    restart: unless-stopped
    networks:
      - mind-base-net

  # KG graph storage service (Go, gRPC) — Neo4j data access + video.kg_* MySQL
  # bookkeeping + scope resolution. Consumed by app-ts over mind-base-net;
  # not behind APISIX (internal service-to-service only). Owns NO tables:
  # it is the ONLY writer of the video.kg_status/kg_version columns.
  app-kg:
    image: atoncooper/mind-base-app-kg:latest
    pull_policy: never  # 本地构建产物;绝不拉 Hub——镜像缺失时先 docker compose build <服务>
    build:
      context: ./app-go/app-kg
      dockerfile: Dockerfile
    container_name: mind-base-app-kg
    profiles: ["", "kg", "full"]
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - APPKG__RDBMS__URL=${RDBMS__URL:-mysql+aiomysql://mind_base:mind-base@mysql:3306/mind_base}
      - KG__URI=${KG__URI:-bolt://neo4j:7687}
      - KG__PASSWORD=${NEO4J_PASSWORD:-mind-base}
      - APPKG__LOG__OUTPUT=both
    ports:
      - "127.0.0.1:${APP_KG_GRPC_PORT:-8013}:8013"
      - "127.0.0.1:${APP_KG_HEALTH_PORT:-8014}:8014"
    volumes:
      - app_kg_logs:/app/logs
    restart: unless-stopped
    networks:
      - mind-base-net

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: mind-base-etcd
    # APISIX (init_etcd) and Milvus both depend on etcd, so etcd must be
    # available in every profile where either runs: "", standalone, storage,
    # task, full.
    profiles: ["", "standalone", "storage", "task", "full"]
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      -data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mind-base-net

  minio:
    image: atoncooper/mind-base-minio:latest
    pull_policy: never  # 本地构建产物;绝不拉 Hub——镜像缺失时先 docker compose build <服务>
    # Upstream removed community MinIO from every distribution channel
    # (Docker Hub repo deleted, dl.min.io 410, GitHub repo archived as
    # source-only). We vendor the last upstream release that still published
    # prebuilt binaries — see scripts/minio.Dockerfile.
    build:
      context: ./scripts
      dockerfile: minio.Dockerfile
    container_name: mind-base-minio
    # nginx (proxy_pass) and Milvus both depend on minio; add standalone so
    # nginx's standalone profile doesn't break the dependency graph.
    profiles: ["", "standalone", "storage", "full"]
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
      # Plan 0021: Redis event notification + abandoned upload cleanup
      - MINIO_NOTIFY_REDIS_ENABLE_clouddrive=on
      - MINIO_NOTIFY_REDIS_FORMAT_clouddrive=access
      - MINIO_NOTIFY_REDIS_ADDRESS_clouddrive=redis:6379
      - MINIO_NOTIFY_REDIS_PASSWORD_clouddrive=${REDIS_PASSWORD:-mind-base}
      - MINIO_NOTIFY_REDIS_KEY_clouddrive=minio:events:clouddrive
      - MINIO_NOTIFY_REDIS_EVENTS_clouddrive=put,delete,completemultipartupload
      - MINIO_API_ABORT_INCOMPLETE_MULTIPART_UPLOAD_DAYS=1
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mind-base-net

  # ==============================================================
  # Optional tools
  # ==============================================================

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: mind-base-redis-ui
    profiles: ["tools", "full"]
    ports:
      - "${REDIS_UI_PORT:-8081}:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-mind-base}
    restart: unless-stopped
    networks:
      - mind-base-net

  mongo-express:
    image: mongo-express:latest
    container_name: mind-base-mongo-ui
    profiles: ["tools", "full"]
    ports:
      - "${MONGO_UI_PORT:-8082}:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_USER:-admin}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_PASSWORD:-mind-base}
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-mind-base}@mongo:27017/
      - ME_CONFIG_BASICAUTH=false
    restart: unless-stopped
    networks:
      - mind-base-net

  # ==============================================================
  # Task scheduling stack (profile=task)
  # Start: docker compose --profile task up -d
  #   apisix            - API gateway (standalone mode; init_etcd needs etcd,
  #                       which is included in the task profile)
  #   app-task          - task executor (Go + self-polling scheduler, no xxl-job)
  # ==============================================================

  apisix:
    image: apache/apisix:3.11.0-debian
    container_name: mind-base-apisix
    # nginx depends on apisix in "", standalone, storage, full; app-task needs
    # it in task. Share all of nginx's profiles plus task to cover both paths.
    profiles: ["", "standalone", "storage", "task", "full"]
    depends_on:
      cert-gen:
        condition: service_completed_successfully
      # init_etcd (run by the entrypoint) connects to etcd:2379; wait for it
      # to be healthy first so APISIX doesn't crash on startup.
      etcd:
        condition: service_healthy
    # No host port mapping: apisix must only be reachable inside mind-base-net
    # (nginx -> apisix -> app services). Exposing 9080 to the host lets external
    # clients bypass nginx (SSL/cache/rate-limit). To debug apisix directly,
    # `docker compose exec apisix ...` or temporarily re-add `ports: ["9080:9080"]`.
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      # app-board dev-CA（app-board 自动模式首次启动生成）：只读挂入，
      # entrypoint 将其与系统 CA 池拼成 ssl_trusted_certificate 的 ca-bundle.crt
      - ./app-board/certs:/usr/local/apisix/conf/certs/board:ro
    # APISIX's lua-http client honors HTTP_PROXY. The host's
    # ~/.docker/config.json injects HTTP_PROXY at runtime with higher priority
    # than compose environment, which misroutes internal etcd traffic to the
    # proxy and fails with "connection reset by peer". The compose environment
    # HTTP_PROXY= below is NOT enough (docker treats empty string as unset, so
    # config.json's default wins). Override the entrypoint to unset proxy vars
    # before exec'ing the original entrypoint - guarantees the APISIX process
    # env has no proxy regardless of config.json, making the fix self-contained.
    entrypoint: ["/bin/sh", "-c", "unset HTTP_PROXY http_proxy HTTPS_PROXY https_proxy; if [ -f /usr/local/apisix/conf/certs/board/dev-ca.crt ]; then cat /etc/ssl/certs/ca-certificates.crt /usr/local/apisix/conf/certs/board/dev-ca.crt > /tmp/ca-bundle.crt; else cp /etc/ssl/certs/ca-certificates.crt /tmp/ca-bundle.crt; fi; exec /docker-entrypoint.sh docker-start"]
    environment:
      # Belt-and-suspenders: also clear via environment (documents intent;
      # may not override config.json runtime injection on its own).
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - NO_PROXY=etcd,app-task,app-board,minio,mysql,mongo,redis,apisix,frontend,nginx,localhost,127.0.0.1
      - no_proxy=etcd,app-task,app-board,minio,mysql,mongo,redis,apisix,frontend,nginx,localhost,127.0.0.1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':2382 .* 0A ' /proc/net/tcp || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - mind-base-net

  # app-auth —— 身份认证服务（Go + Gin；接管 users/user_tokens/user_oauth 等
  # auth 表的 schema 所有权，共享主 bilirag MySQL；APISIX forward-auth 指向
  # /internal/auth/verify，/auth/* 用户端点也由它提供）
  app-auth:
    image: atoncooper/mind-base-app-auth:latest
    pull_policy: never  # 本地构建产物;绝不拉 Hub——镜像缺失时先 docker compose build <服务>
    build:
      context: ./app-go/app-auth
      dockerfile: Dockerfile
    container_name: mind-base-app-auth
    profiles: ["", "auth", "full"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Shared bilirag database (schema owner; CREATE-TABLE-IF-NOT-EXISTS only)
      - APPAUTH__RDBMS__URL=${RDBMS__URL:-mysql+aiomysql://mind_base:mind-base@mysql:3306/mind_base}
      # Redis: captcha store / login throttle / rate limits / wechat state
      - REDIS__URL=${REDIS__URL:-redis://:mind-base@redis:6379/1}
      # Shared secrets (same env names as the retired Python backend — one .env drives all)
      - SECURITY__API_KEY_ENCRYPTION_KEY=${SECURITY__API_KEY_ENCRYPTION_KEY:-}
      - SECURITY__API_KEY_ENCRYPTION_KEY_FILE=/run/secrets/api_key_encryption_key
      - EMAIL__ENABLED=${EMAIL__ENABLED:-false}
      - EMAIL__API_KEY=${EMAIL__API_KEY:-}
      - SMS__ENABLED=${SMS__ENABLED:-false}
      - SMS__ACCESS_KEY_ID=${SMS__ACCESS_KEY_ID:-}
      - SMS__ACCESS_KEY_SECRET=${SMS__ACCESS_KEY_SECRET:-}
      - SMS__SIGN_NAME=${SMS__SIGN_NAME:-}
      - SMS__TEMPLATE_CODE=${SMS__TEMPLATE_CODE:-}
      - WECHAT__ENABLED=${WECHAT__ENABLED:-false}
      - WECHAT__APP_ID=${WECHAT__APP_ID:-}
      - WECHAT__APP_SECRET=${WECHAT__APP_SECRET:-}
      - WECHAT__REDIRECT_URI=${WECHAT__REDIRECT_URI:-}
      # Snowflake worker id 2 (1 was the retired Python backend)
      - APPAUTH__WORKER_ID=2
      - APPAUTH__LOG__OUTPUT=both
    ports:
      - "127.0.0.1:${APP_AUTH_PORT:-8006}:8006"
    volumes:
      - app_auth_logs:/app/logs
      - ./secrets/api_key_encryption_key:/run/secrets/api_key_encryption_key:ro
    restart: unless-stopped
    networks:
      - mind-base-net

  # app-cloud —— 云盘服务（Go + Gin；接管 cloud_files/cloud_folders/cloud_shares
  # 的 schema 所有权，共享主 bilirag MySQL + MinIO bucket + Mongo；分块上传/配额/
  # 分享/回收站/解析向量化管线；nginx /cloud/ 直连本服务，身份经 auth_request 注入）
  app-cloud:
    image: atoncooper/mind-base-app-cloud:latest
    pull_policy: never  # 本地构建产物;绝不拉 Hub——镜像缺失时先 docker compose build <服务>
    build:
      context: ./app-go/app-cloud
      dockerfile: Dockerfile
    container_name: mind-base-app-cloud
    profiles: ["", "cloud", "full"]
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Shared bilirag database (schema owner; CREATE-TABLE-IF-NOT-EXISTS only)
      - APPCLOUD__RDBMS__URL=${RDBMS__URL:-mysql+aiomysql://mind_base:mind-base@mysql:3306/mind_base}
      - REDIS__URL=${REDIS__URL:-redis://:mind-base@redis:6379/1}
      - MONGO__URI=${MONGO__URI:-mongodb://admin:mind-base@mongo:27017/?authSource=admin}
      # MinIO (same bucket/keys as the previous Python implementation)
      - MINIO__ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO__SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO__PUBLIC_ENDPOINT=${MINIO__PUBLIC_ENDPOINT:-}
      - MINIO__PUBLIC_HOST=${MINIO_PUBLIC_HOST:-}
      # Storage quota tier lookup via APISIX key-auth -> app-pay
      - APISIX_CONSUMER_KEY=${APISIX_CONSUMER_KEY:-mindbase-internal-key-change-me}
      # Vector pipeline (Higress AI gateway; model/dim RED LINE = Milvus rebuild)
      - AI_GATEWAY__API_KEY=${AI_GATEWAY__API_KEY:-}
      - AI_GATEWAY__BASE_URL=${AI_GATEWAY__BASE_URL:-}
      - MILVUS__URI=${MILVUS__URI:-http://milvus:19530}
      - APPCLOUD__LOG__OUTPUT=both
      # 提取码静态加密密钥（与 app-auth 共用同一 secrets 文件；密钥不进数据库）
      - SECURITY__API_KEY_ENCRYPTION_KEY_FILE=/run/secrets/api_key_encryption_key
    ports:
      - "127.0.0.1:${APP_CLOUD_PORT:-8007}:8007"
    volumes:
      - app_cloud_logs:/app/logs
      - ./secrets/api_key_encryption_key:/run/secrets/api_key_encryption_key:ro
    restart: unless-stopped
    networks:
      - mind-base-net

  # app-note —— 笔记服务（Go + Gin；接管 notes/note_anchors/note_shares 的
  # schema 所有权，共享主 bilirag MySQL + Mongo（note_documents/note_revisions，
  # 零数据迁移）；APISIX /notes/* 用户路由 + /internal/note/* key-auth M2M
  # 路由（app-note-mcp 的 M2M 落库走此通道）；nginx /notes 透传 APISIX 无需改动）
  app-note:
    image: atoncooper/mind-base-app-note:latest
    pull_policy: never  # 本地构建产物;绝不拉 Hub——镜像缺失时先 docker compose build <服务>
    build:
      context: ./app-go/app-note
      dockerfile: Dockerfile
    container_name: mind-base-app-note
    profiles: ["", "note", "full"]
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Shared bilirag database (schema owner; CREATE-TABLE-IF-NOT-EXISTS only)
      - APPNOTE__RDBMS__URL=${RDBMS__URL:-mysql+aiomysql://mind_base:mind-base@mysql:3306/mind_base}
      - MONGO__URI=${MONGO__URI:-mongodb://admin:mind-base@mongo:27017/?authSource=admin}
      - APPNOTE__LOG__OUTPUT=both
    ports:
      - "127.0.0.1:${APP_NOTE_PORT:-8008}:8008"
    volumes:
      - app_note_logs:/app/logs
    restart: unless-stopped
    networks:
      - mind-base-net

  app-quiz:
    image: atoncooper/mind-base-app-quiz:latest
    pull_policy: never  # 本地构建产物;绝不拉 Hub——镜像缺失时先 docker compose build <服务>
    build:
      context: ./app-go/app-quiz
      dockerfile: Dockerfile
    container_name: mind-base-app-quiz
    profiles: ["", "quiz", "full"]
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Shared bilirag database (schema owner; CREATE-TABLE-IF-NOT-EXISTS only)
      - APPQUIZ__RDBMS__URL=${RDBMS__URL:-mysql+aiomysql://mind_base:mind-base@mysql:3306/mind_base}
      - MONGO__URI=${MONGO__URI:-mongodb://admin:mind-base@mongo:27017/?authSource=admin}
      - APPQUIZ__LOG__OUTPUT=both
    ports:
      - "127.0.0.1:${APP_QUIZ_PORT:-8011}:8011"
    volumes:
      - app_quiz_logs:/app/logs
    restart: unless-stopped
    networks:
      - mind-base-net

  app-task:
    # Published by the standalone repo (github.com/atoncooper/app-task) to Docker Hub.
    image: atoncooper/app-task:latest
    container_name: mind-base-app-task
    profiles: ["", "task", "full"]
    depends_on:
      apisix:
        condition: service_healthy
      app-task-mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Own database: independent MySQL instance (schema created by db.Migrate)
      - APPTASK__RDBMS__URL=mysql+aiomysql://${APPTASK_MYSQL_USER:-app_task}:${APPTASK_MYSQL_PASSWORD:-app-task}@app-task-mysql:3306/app_task
      # Main app via APISIX gateway
      - APPTASK__APP__BASE_URL=http://apisix:9080
      - APPTASK__APP__CONSUMER_KEY=${APISIX_CONSUMER_KEY:-mindbase-internal-key-change-me}
      # 网关作用域执行器鉴权：派发到 apisix 的任务（如定时出题
      # /internal/quiz/generate-llm 回调）自动附 apikey 头通过 key-auth；
      # 其他 executor_url 不携带密钥
      - APPTASK__HTTP_EXECUTOR__GATEWAY_HOSTS=apisix:9080
      - APPTASK__HTTP_EXECUTOR__GATEWAY_API_KEY=${APISIX_CONSUMER_KEY:-mindbase-internal-key-change-me}
      # app-pay 超时委托回调（executor_url=https://app-pay:8002/...）的证书校验 CA：
      # executor 惰性加载，纯调度栈（无 app-pay）不受影响；可用 PAY_EXECUTOR_CA_FILE 覆盖
      - APPTASK__HTTP_EXECUTOR__CA_FILE=${PAY_EXECUTOR_CA_FILE:-/app/pay-certs/ca.crt}
      # Email
      - APPTASK__EMAIL__API_KEY=${APPTASK_EMAIL_API_KEY:-}
      # Timezone
      - APPTASK__TIMEZONE=Asia/Shanghai
      # Logging: both writes to stdout AND /app/logs/app-task.log (rotated via lumberjack)
      - APPTASK__LOG__OUTPUT=both
      # 出站代理（可选）：ctx.http_* 与 http 任务派发的外网访问经此代理出网；
      # 留空 = 直连。NO_PROXY 保证容器内网服务名（apisix/app-pay 等）不走代理。
      # 宿主机代理示例：APPTASK_HTTP_PROXY=http://host.docker.internal:10808
      - HTTP_PROXY=${APPTASK_HTTP_PROXY:-}
      - HTTPS_PROXY=${APPTASK_HTTP_PROXY:-}
      - NO_PROXY=${APPTASK_NO_PROXY:-localhost,127.0.0.1,::1,apisix,app-auth,app-pay,app-pay-admin,app-cloud,app-board,app-board-mcp,app-task-mysql,mysql,mongo,redis,minio,higress,host.docker.internal,.local,.svc,.internal}
    ports:
      - "127.0.0.1:${APP_TASK_PORT:-8001}:8001"
    volumes:
      - app_task_logs:/app/logs
      # app-pay 开发 CA（app-pay/certs/ 由 scripts/gen-dev-cert.* 生成；缺失时目录为空，
      # 只有 https 委托回调会报错并由兜底轮询接管，不影响 app-task 启动）
      - ./app-pay/certs:/app/pay-certs:ro
      # 容器内 HTTPS（.env 设 APPTASK__SERVER__TLS__ENABLED=true 即可）：不配 cert/key 时
      # 启动自动生成自签证书写入 /app/certs（挂卷持久化，重建容器不再换证书）；
      # 显式指定文件用 APPTASK__SERVER__TLS__CERT/KEY
      - app_task_certs:/app/certs
    restart: unless-stopped
    networks:
      - mind-base-net

  # app-bili —— B 站数据获取服务（Go + Gin；收藏夹同步/整理、视频与播放器信息、
  # 音频/字幕获取、DashScope ASR 转写落库、知识库 build 编排（同步+ASR）。
  # 只获取不向量化：AI 域（RAG/Milvus/向量化账本）在 app-ts，经 Redis
  # bili:page_ready 事件触发（消费方 = app-ts BiliEventBridge；分P 向量账本在
  # app-ts 的 Mongo vec_pages/vec_tasks）。schema 所有者：
  # collection/favorite_folders/video/video_versions/async_tasks。
  # 镜像含静态 ffmpeg；须出公网访问 B 站与 DashScope（经 Higress 网关）。
  app-bili:
    image: atoncooper/mind-base-app-bili:latest
    pull_policy: never  # 本地构建产物;绝不拉 Hub——镜像缺失时先 docker compose build <服务>
    build:
      context: ./app-go/app-bili
      dockerfile: Dockerfile
    container_name: mind-base-app-bili
    profiles: ["", "bili", "full"]
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - APPBILI__RDBMS__URL=${RDBMS__URL:-mysql+aiomysql://mind_base:mind-base@mysql:3306/mind_base}
      - MONGO__URI=${MONGO__URI:-mongodb://admin:mind-base@mongo:27017/?authSource=admin}
      - REDIS__URL=${REDIS__URL:-redis://:mind-base@redis:6379/1}
      - AI_GATEWAY__API_KEY=${AI_GATEWAY__API_KEY:-}
      - AI_GATEWAY__BASE_URL=${AI_GATEWAY__BASE_URL:-}
      - SECURITY__API_KEY_ENCRYPTION_KEY=${SECURITY__API_KEY_ENCRYPTION_KEY:-}
      - SECURITY__API_KEY_ENCRYPTION_KEY_FILE=/run/secrets/api_key_encryption_key
      # internal M2M guard (/internal/bili/* knowledge-scope reads by app-ts)
      - APPBILI__INTERNAL__API_KEY=${APISIX_CONSUMER_KEY:-mindbase-internal-key-change-me}
      # ASR 走 Higress 原生透传（/api/v1 → DashScope，真实密钥在网关侧）；
      # AI_GATEWAY__API_KEY 即 Higress 消费者密钥。BaseURL 直连 DashScope 需要
      # sk- 密钥（网关消费者 key 会被 DashScope 判 InvalidApiKey）。
      - AI_GATEWAY__BASE_URL=http://higress:8080/api/v1
      - APPBILI__LOG__OUTPUT=both
    ports:
      - "127.0.0.1:${APP_BILI_PORT:-8010}:8010"
    volumes:
      - app_bili_logs:/app/logs
      - ./secrets/api_key_encryption_key:/run/secrets/api_key_encryption_key:ro
    restart: unless-stopped
    networks:
      - mind-base-net


  # app-pay —— 交易/会员服务（Spring Boot 3;模式对齐 app-task）
  app-pay:
    image: atoncooper/mind-base-app-pay:latest
    pull_policy: never  # 本地构建产物;绝不拉 Hub——镜像缺失时先 docker compose build <服务>
    build:
      context: ./app-pay
      # Dockerfile = 自包含（容器内 mvn，CI 用）; Dockerfile.local = 宿主
      # mvn package 的 jar 直拷——VPN/TUN 环境下容器到国内镜像源只有宿主
      # 1/25 吞吐，本地快速路径设 APP_PAY_DOCKERFILE=Dockerfile.local
      dockerfile: ${APP_PAY_DOCKERFILE:-Dockerfile}
    container_name: mind-base-app-pay
    profiles: ["", "pay", "full"]
    depends_on:
      cert-gen:
        condition: service_completed_successfully
      app-pay-mysql:
        condition: service_healthy
    env_file:
      - .env
    # 配置唯一入口 = app-pay 的 application.yaml（+ profile 变体）：
    # docker profile = 容器生产形态（容器内 DB 地址 / MOCK 关闭 / 正式网关）；
    # 密钥/口令经 yaml 占位符从 env_file 读取（.env 的 PAY_MYSQL_* / ALIPAY_*），不进 git
    command: ["--spring.profiles.active=docker"]
    ports:
      # 仅回环：app-pay 不允许绕过 APISIX 鉴权直达
      - "127.0.0.1:${APP_PAY_PORT:-8002}:8002"
    volumes:
      # 运行日志 + 资金审计 JSONL（pay-audit.jsonl 保留 365 天，对账/取证）
      - app_pay_logs:/app/logs
      # TLS 证书：服务端 HTTPS-only（application.yaml server.ssl，默认相对路径 certs/*，
      # WORKDIR=/app 对齐 /app/certs）。证书由 app-pay/scripts/gen-dev-cert.* 生成（gitignored），
      # 缺失时 app-pay 启动自检明确报错；生产挂载正式证书后用 PAY_TLS_CERT/PAY_TLS_KEY 覆盖
      - ./app-pay/certs:/app/certs:ro
    restart: unless-stopped
    networks:
      - mind-base-net

  # app-board —— 思维导图/白板内容存储（Go 独立服务）
  # 共享主 app 的 MySQL(mind_base.board,服务自建 schema)与 Mongo(MindBase.board_documents)。
  # 鉴权:APISIX forward-auth 验 bili_session 注入 X-Uid,服务信任该头。
  # HTTPS-only:自动生成 dev-CA+叶子证书(自愈+自动续期),dev-ca.crt 只读挂进 apisix
  # 作为 upstream tls_verify 的信任锚(见 apisix config.yaml ssl_trusted_certificate)。
  # 注意:首次启动生成证书后若 apisix 先于其启动,需 `docker compose restart apisix` 重载 CA bundle。
  app-board:
    image: atoncooper/mind-base-app-board:latest
    pull_policy: never  # 本地构建产物;绝不拉 Hub——镜像缺失时先 docker compose build <服务>
    build:
      context: ./app-board
      dockerfile: Dockerfile
    container_name: mind-base-app-board
    profiles: ["", "board", "full"]
    depends_on:
      cert-gen:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # 读缓存（列表/详情 cache-aside；写路径仍直落 MySQL）：独立 DB index /2，
      # 主 app 用 /1；Redis 故障自动降级直查，不影响正确性
      - APPBOARD__REDIS__URL=redis://:${REDIS_PASSWORD:-mind-base}@redis:6379/2
      # 共享主 app MySQL（board 表 schema 由服务启动 db.Migrate 自建）
      - APPBOARD__RDBMS__URL=mysql+aiomysql://${MYSQL_USER:-mind_base}:${MYSQL_PASSWORD:-mind-base}@mysql:3306/mind_base
      # 共享主 app Mongo（正文 collection board_documents）
      - APPBOARD__MONGO__URI=${MONGO__URI:-mongodb://admin:mind-base@mongo:27017/?authSource=admin}
      - APPBOARD__MONGO__DB_NAME=MindBase
      # Logging: stdout + /app/logs/app-board.log（lumberjack 轮转）
      - APPBOARD__LOG__OUTPUT=both
      - APPBOARD__SERVER__TLS__CERT_DIR=/app/certs
      # explicit mode: load cert-gen issued leaf as-is; auto mode would try to
      # regenerate + overwrite the shared dev-ca.crt (root-owned bind mount, EACCES)
      - APPBOARD__SERVER__TLS__CERT=/app/certs/server.crt
      - APPBOARD__SERVER__TLS__KEY=/app/certs/server.key
    # 无宿主端口映射：只能经 APISIX 访问（与 app-task 8001 同策略）
    volumes:
      - app_board_logs:/app/logs
      # TLS 证书目录：自动模式首次启动生成 dev-CA+叶子并持久化（apisix 只读挂其中的 dev-ca.crt）
      - ./app-board/certs:/app/certs
    restart: unless-stopped
    networks:
      - mind-base-net

  # app-board-mcp —— MCP server（把思维导图/白板以 MCP 工具暴露给 Agent）
  # 双模式鉴权：外部 MCP 宿主走 Bearer token（BOARD_MCP_AUTH_TOKEN，固定 uid）；
  # 主 app（app-ts） 走服务模式（apikey=APISIX_CONSUMER_KEY + 每请求 X-Uid，
  # uid 来自后端已认证会话，永不经过 LLM 参数）。上游经 APISIX key-auth 路由
  # /internal/board/* 到 app-board。回环 8005 + 容器内网互通（app-ts 直连）。
  # 默认 profile 启动：board agent 是主栈功能的一部分。
  app-board-mcp:
    image: atoncooper/mind-base-app-board-mcp:latest
    pull_policy: never  # 本地构建产物;绝不拉 Hub——镜像缺失时先 docker compose build <服务>
    build:
      context: ./mcp/app-board-mcp
      dockerfile: Dockerfile
    container_name: mind-base-app-board-mcp
    profiles: ["", "board", "full"]
    depends_on:
      cert-gen:
        condition: service_completed_successfully
    environment:
      - BOARDMCP__UPSTREAM__BASE_URL=http://apisix:9080
      - BOARDMCP__UPSTREAM__API_KEY=${APISIX_CONSUMER_KEY:-mindbase-internal-key-change-me}
      - BOARDMCP__UPSTREAM__UID=${BOARD_MCP_UID:-}
      - BOARDMCP__SERVER__AUTH_TOKEN=${BOARD_MCP_AUTH_TOKEN:-}
      # 服务模式：主 app（app-ts） 以 apikey + 每请求 X-Uid 访问（复用 consumer key）
      - BOARDMCP__SERVER__SERVICE_API_KEY=${APISIX_CONSUMER_KEY:-mindbase-internal-key-change-me}
      # TLS（默认关）：跨机 MCP 宿主或放宽回环绑定时置 true。证书由 cert-gen
      # 统一签发（shared dev CA 叶子），此处 explicit 模式直接加载；
      # auto 模式会试图在 root 属主的 bind mount 里重建 dev CA（EACCES 崩溃）
      - BOARDMCP__SERVER__TLS__ENABLED=${BOARD_MCP_TLS_ENABLED:-false}
      - BOARDMCP__SERVER__TLS__CERT_DIR=/app/certs
      - BOARDMCP__SERVER__TLS__CERT_FILE=/app/certs/server.crt
      - BOARDMCP__SERVER__TLS__KEY_FILE=/app/certs/server.key
      # Logging: stdout + /app/logs/app-board-mcp.log（lumberjack 轮转；
      # 镜像已预建 nonroot 属主的 /app/logs，卷首次挂载继承该属主）
      - BOARDMCP__LOG__OUTPUT=both
      - BOARDMCP__LOG__FILE=/app/logs/app-board-mcp.log
    ports:
      - "127.0.0.1:8005:8005"
    volumes:
      - app_board_mcp_logs:/app/logs
      # TLS 证书目录：cert-gen 统一签发叶子（explicit 模式加载，不自动生成）
      - ./mcp/app-board-mcp/certs:/app/certs
    restart: unless-stopped
    networks:
      - mind-base-net

  # app-note-mcp —— 笔记 MCP server（把笔记以 MCP 工具暴露给 Agent）
  # 双模式鉴权同 app-board-mcp：外部 MCP 宿主走 Bearer（NOTE_MCP_AUTH_TOKEN，
  # 固定 uid）；主 app（app-ts） 走服务模式（apikey=APISIX_CONSUMER_KEY + 每请求
  # X-Uid，uid 永不经过 LLM 参数）。上游经 APISIX key-auth 路由 /internal/note/*
  # 到 app-note。回环 8009 + 容器内网互通（app-ts 直连）；默认 profile 启动。
  app-note-mcp:
    image: atoncooper/mind-base-app-note-mcp:latest
    pull_policy: never  # 本地构建产物;绝不拉 Hub——镜像缺失时先 docker compose build <服务>
    build:
      context: ./mcp/app-note-mcp
      dockerfile: Dockerfile
    container_name: mind-base-app-note-mcp
    profiles: ["", "note", "full"]
    environment:
      - NOTEMCP__UPSTREAM__BASE_URL=http://apisix:9080
      - NOTEMCP__UPSTREAM__API_KEY=${APISIX_CONSUMER_KEY:-mindbase-internal-key-change-me}
      - NOTEMCP__UPSTREAM__UID=${NOTE_MCP_UID:-}
      - NOTEMCP__SERVER__AUTH_TOKEN=${NOTE_MCP_AUTH_TOKEN:-}
      # 服务模式：主 app（app-ts） 以 apikey + 每请求 X-Uid 访问（复用 consumer key）
      - NOTEMCP__SERVER__SERVICE_API_KEY=${APISIX_CONSUMER_KEY:-mindbase-internal-key-change-me}
      # Logging: stdout + /app/logs/app-note-mcp.log（lumberjack 轮转；
      # 镜像已预建 nonroot 属主的 /app/logs，卷首次挂载继承该属主）
      - NOTEMCP__LOG__OUTPUT=both
      - NOTEMCP__LOG__FILE=/app/logs/app-note-mcp.log
    ports:
      - "127.0.0.1:8009:8009"
    volumes:
      - app_note_mcp_logs:/app/logs
    restart: unless-stopped
    networks:
      - mind-base-net

  # app-quiz-mcp —— 测验 MCP server（把 quiz 出题/批改落库以 MCP 工具暴露给 Agent）。
  # 鉴权同 app-note-mcp：外部宿主 Bearer（QUIZ_MCP_AUTH_TOKEN，固定 uid）；主 app（app-ts）
  # 走服务模式（apikey=APISIX_CONSUMER_KEY + 每请求 X-Uid）。上游经 APISIX key-auth
  # 路由 /internal/quiz/* 到 app-quiz。回环 8012 + 容器内网互通；默认 profile 启动。
  app-quiz-mcp:
    image: atoncooper/mind-base-app-quiz-mcp:latest
    pull_policy: never  # 本地构建产物;绝不拉 Hub——镜像缺失时先 docker compose build <服务>
    build:
      context: ./mcp/app-quiz-mcp
      dockerfile: Dockerfile
    container_name: mind-base-app-quiz-mcp
    profiles: ["", "quiz", "full"]
    environment:
      - QUIZMCP__UPSTREAM__BASE_URL=http://apisix:9080
      - QUIZMCP__UPSTREAM__API_KEY=${APISIX_CONSUMER_KEY:-mindbase-internal-key-change-me}
      - QUIZMCP__UPSTREAM__UID=${QUIZ_MCP_UID:-}
      - QUIZMCP__SERVER__AUTH_TOKEN=${QUIZ_MCP_AUTH_TOKEN:-}
      # 服务模式：主 app（app-ts） 以 apikey + 每请求 X-Uid 访问（复用 consumer key）
      - QUIZMCP__SERVER__SERVICE_API_KEY=${APISIX_CONSUMER_KEY:-mindbase-internal-key-change-me}
      # Logging: stdout + /app/logs/app-quiz-mcp.log（lumberjack 轮转；
      # 镜像已预建 nonroot 属主的 /app/logs，卷首次挂载继承该属主）
      - QUIZMCP__LOG__OUTPUT=both
      - QUIZMCP__LOG__FILE=/app/logs/app-quiz-mcp.log
    ports:
      - "127.0.0.1:8012:8012"
    volumes:
      - app_quiz_mcp_logs:/app/logs
    restart: unless-stopped
    networks:
      - mind-base-net

  # app-pay 测试环境（--profile pay-test 按需拉起，不随主栈默认启动）：
  # 与生产完全隔离——独立 MySQL 实例/整库(app_pay_test)、独立卷/端口(仅回环 18002)、
  # MOCK 渠道 + 测试入口开启（全部固化在 application-test.yaml，不读 .env 的生产值）。
  # 订单超时缩到 2min 便于测关单 job。
  app-pay-test-mysql:
    image: mysql:8.4
    container_name: mind-base-app-pay-test-mysql
    profiles: ["pay-test", "full"]
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=app_pay_test
      - MYSQL_USER=app_pay_test
      - MYSQL_PASSWORD=app-pay-test
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:18306:3306"
    volumes:
      - app_pay_test_mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mind-base-net

  app-pay-test:
    image: atoncooper/mind-base-app-pay:latest
    pull_policy: never  # 本地构建产物;绝不拉 Hub——镜像缺失时先 docker compose build <服务>
    build:
      context: ./app-pay
      # Dockerfile = 自包含（容器内 mvn，CI 用）; Dockerfile.local = 宿主
      # mvn package 的 jar 直拷——VPN/TUN 环境下容器到国内镜像源只有宿主
      # 1/25 吞吐，本地快速路径设 APP_PAY_DOCKERFILE=Dockerfile.local
      dockerfile: ${APP_PAY_DOCKERFILE:-Dockerfile}
    container_name: mind-base-app-pay-test
    profiles: ["pay-test", "full"]
    depends_on:
      app-pay-test-mysql:
        condition: service_healthy
    # 配置唯一入口 = application-test.yaml（独立库/账号/MOCK/测试入口/超时 2min 全部固化，
    # 不读 .env 的生产值）；委托回调指向本测试实例
    command: ["--spring.profiles.active=test"]
    ports:
      - "127.0.0.1:${APP_PAY_TEST_PORT:-18002}:8002"
    volumes:
      - app_pay_test_logs:/app/logs
      # TLS 证书（同 app-pay：HTTPS-only，开发 CA + 证书脚本生成）
      - ./app-pay/certs:/app/certs:ro
    restart: unless-stopped
    networks:
      - mind-base-net

  # app-pay-admin —— 支付后台管理（Go + Gin）
  # 全直连 app_pay 库（读查询 + 唯一写操作：会员补偿开通，事务内复刻 app-pay
  # MembershipService.extend 语义），运行时不依赖 app-pay/APISIX。自带账户体系
  # （payadmin_user + bcrypt），仅回环暴露，不经 APISIX（同 app-task WebUI 先例）。
  app-pay-admin:
    image: atoncooper/mind-base-app-pay-admin:latest
    pull_policy: never  # 本地构建产物;绝不拉 Hub——镜像缺失时先 docker compose build <服务>
    build:
      context: ./app-pay-admin
      dockerfile: Dockerfile
    container_name: mind-base-app-pay-admin
    profiles: ["pay-admin", "full"]
    depends_on:
      app-pay-mysql:
        condition: service_healthy
    env_file:
      - .env
    # 配置分层：default.yaml(嵌入) < config.docker.yaml(-config 指定) < PAYADMIN__ 环境变量
    # rdbms.url 由下方 environment 注入（复用 .env 的 PAY_MYSQL_*），改口令两边自动对齐
    command: ["-config", "config.docker.yaml"]
    environment:
      - PAYADMIN__RDBMS__URL=mysql+aiomysql://${PAY_MYSQL_USER:-app_pay}:${PAY_MYSQL_PASSWORD:-app-pay}@app-pay-mysql:3306/app_pay
    ports:
      # 仅回环：管理后台不对公网暴露，本机浏览器直连 http://127.0.0.1:8003
      - "127.0.0.1:${APP_PAY_ADMIN_PORT:-8003}:8003"
    volumes:
      # 运行日志 + 资金审计 JSONL（pay-admin-audit.jsonl，补偿开通留痕）
      - app_pay_admin_logs:/app/logs
      # 启用容器内 HTTPS：.env 设 PAYADMIN__SERVER__TLS__ENABLED=true 即可
      # （不配 cert/key 时容器启动自动生成自签证书写入 /app/certs；挂卷持久化，
      #  重建容器不再换证书）。显式指定文件用 PAYADMIN__SERVER__TLS__CERT/KEY。
      - ./app-pay-admin/certs:/app/certs
    restart: unless-stopped
    networks:
      - mind-base-net

  # ==============================================================
  # AI Gateway (profile=ai) — Higress all-in-one
  # Start: docker compose --profile ai up -d
  #   higress - unified egress for AI requests (LLM/embedding egress proxy,
  #             consumer auth, token rate limiting, primary/backup fallback,
  #             AI Dashboard)
  # Boundary: APISIX fronts "business APIs in", Higress fronts "AI traffic
  # out" — neither replaces the other. Compose-internal services (app-ts
  # etc.) reach it at http://higress:8080 (internal network, never via host
  # ports); real vendor keys are configured in the console
  # (http://127.0.0.1:18081) and persisted under ./data/higress, never in
  # .env/git. Red line: the gateway-side modelMapping must stay an empty
  # pass-through — changing model names (text-embedding-v4/1024-dim) forces
  # a full Milvus rebuild (see AGENTS.md).
  # ==============================================================

  higress:
    # Same image as the official gateway install script; all-in-one ships a
    # rolling :latest tag only (no version tags). linux/amd64 digest recorded
    # 2026-09-14: sha256:da3a8692f927e5ccc40269b8006708363b8e84d3d7cad5d0ef1865ea7071b47f.
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/all-in-one:latest
    container_name: mind-base-higress
    profiles: ["ai", "full"]
    environment:
      # In-container listen ports (same env as the official install.sh)
      - GATEWAY_HTTP_PORT=8080
      - GATEWAY_HTTPS_PORT=8443
      - CONSOLE_PORT=8001
      # 容器内组件互访（console/pilot/envoy 本机回环 + 未来限流插件连 redis）不走
      # 宿主注入的 HTTP_PROXY——Docker Desktop 会把宿主 ~/.docker/config.json 的代理
      # 注入容器，APISIX 曾因此内部 etcd 流量被劫持（见 apisix 服务 entrypoint 注释）。
      # LLM 供应商出网（如 OpenRouter）如需代理，另行在 .env 设 HTTP(S)_PROXY 白名单外变量
      - NO_PROXY=localhost,127.0.0.1,higress,apisix,nginx,frontend,mysql,mongo,redis
      - no_proxy=localhost,127.0.0.1,higress,apisix,nginx,frontend,mysql,mongo,redis
    ports:
      # 18081 console intentionally public; firewall source IPs on public hosts
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18443:8443"
      - "18081:8001"
    volumes:
      # 官方数据目录：providers / 路由 / 消费者 key / 控制台账户持久化于此，
      # 重建容器配置不丢（data/ 整目录已 gitignore）
      - ./data/higress:/data
      # Envoy 访问日志
      - ./data/higress/logs:/var/log/proxy
    restart: unless-stopped
    healthcheck:
      # Console homepage reachable = control plane up. The official image
      # ships no health endpoint contract; probe with curl and fall back to
      # wget (swap to an exec port probe if the image ships neither).
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8001/ || wget -qO /dev/null http://127.0.0.1:8001/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - mind-base-net

volumes:
  app_task_certs:
  app_task_logs:
  app_auth_logs:
  app_cloud_logs:
  app_note_logs:
  app_quiz_logs:
  app_kg_logs:
  app_settings_logs:
  app_bili_logs:
  app_note_mcp_logs:
  app_quiz_mcp_logs:
  app_board_logs:
  app_board_mcp_logs:
  app_task_mysql_data:
  app_pay_mysql_data:
  app_pay_logs:
  app_pay_test_mysql_data:
  app_pay_test_logs:
  app_pay_admin_logs:
  mysql_data:
  redis_data:
  mongo_data:
  milvus_data:
  etcd_data:
  neo4j_data:
  neo4j_logs:
  minio_data:
  certbot_www:
  nginx_video_cache:
  nginx_wallpaper_cache:

networks:
  mind-base-net:
    driver: bridge
