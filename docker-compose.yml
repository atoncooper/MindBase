# MindBase — 生产编排入口（模块化：compose/*.yml，按职责拆分）
#
#   compose/data.yml     数据组件：mysql / redis / mongo / milvus / neo4j / etcd / minio
#   compose/apps.yml     业务服务：frontend / app-ts / app-go / app-pay / app-admin / sandbox
#   compose/gateway.yml  入口与 AI 网关：openresty / apisix / higress
#   compose/certs.yml    证书与信任初始化：cert-gen / cert-truststore
#   compose/sandbox.yml  沙箱运行时：opensandbox-server
#   compose/tools.yml    调试工具（profiles: tools）
#
# 共享 named volumes 与 network 在本文件定义；各模块内路径相对 compose/ 目录。
include:
  - compose/data.yml
  - compose/apps.yml
  - compose/gateway.yml
  - compose/certs.yml
  - compose/sandbox.yml
  - compose/tools.yml

volumes:
  app_task_certs:
  app_task_logs:
  app_ts_logs:
  app_cloud_logs:
  app_content_logs:
  app_kg_logs:
  opensandbox_data:
  app_sandbox_logs:
  app_user_logs:
  app_content_mcp_logs:
  app_task_mysql_data:
  app_pay_mysql_data:
  app_pay_logs:
  app_pay_test_mysql_data:
  app_pay_test_logs:
  app_admin_logs:
  mysql_data:
  redis_data:
  mongo_data:
  milvus_data:
  etcd_data:
  neo4j_data:
  neo4j_logs:
  minio_data:
  certbot_www:
  openresty_cache:


networks:
  mind-base-net:
    driver: bridge
