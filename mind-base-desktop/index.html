<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mb-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindBase Desktop</title>
    <script>
      // 首帧前解析主题（镜像自 src/lib/theme.ts），避免深色用户启动闪白。
      try {
        var pref = localStorage.getItem("mb-theme") || "system";
        var dark =
          pref === "dark" ||
          (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
