# Dedicated Nginx server for the app-admin UI container.
# The main gateway config is nginx.conf; this file is copied into the separate
# static UI image as /etc/nginx/conf.d/default.conf.
upstream app_admin {
    server app-admin-api:8016;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Docker embedded DNS: keep dynamic resolution for minio (UI may start
    # before the minio container; a static upstream would fail nginx startup).
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Controlled content preview: app-cloud returns presigned URLs as
    # same-origin /minio-proxy/... (no public_endpoint configured). Proxy them
    # to MinIO exactly like the main gateway, otherwise <img>/<video>/<iframe>
    # would hit the SPA fallback and render nothing.
    location ^~ /minio-proxy/ {
        set $admin_minio http://minio:9000;
        rewrite ^/minio-proxy/(.*) /$1 break;
        proxy_pass $admin_minio;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_cache off;
        proxy_buffering off;
        client_max_body_size 50m;

        # A PDF preview is embedded in this SPA's same-origin <iframe>; the
        # server-level DENY would block it. Override the inherited headers for
        # this location only (add_header in a location replaces inheritance).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        proxy_pass http://app_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    location ^~ /api/ {
        proxy_pass http://app_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
