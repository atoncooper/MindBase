    proxy_cache_key "$host$request_uri";
    proxy_cache_valid 200 5m;
    proxy_cache_valid 404 1m;
}

# /notes 特例：裸路径既是页面也是 API（GET 列表 / POST 创建），全靠 XHR 头分发。
location = /notes {
    if ($http_x_requested_with = "XMLHttpRequest") { rewrite ^ /apisix-xhr$uri$is_args$args last; }
    proxy_pass $frontend_upstream;
