# ============================================================
# Shared location blocks - included by both :80 and :443 servers
# ============================================================

# Common proxy settings
proxy_http_version      1.1;
proxy_set_header        Host                $host;
proxy_set_header        X-Real-IP           $remote_addr;
proxy_set_header        X-Forwarded-For     $proxy_add_x_forwarded_for;
proxy_set_header        X-Forwarded-Proto   $scheme;
proxy_set_header        X-Forwarded-Host    $host;
proxy_set_header        X-Forwarded-Port    $server_port;

proxy_connect_timeout   75s;
proxy_read_timeout      300s;  # SSE / streaming
# proxy_buffering / proxy_cache are NOT set at server level -
# each location sets its own. Cacheable locations enable
# proxy_buffering on; streaming locations (/chat, /minio-proxy/)
# set proxy_buffering off explicitly.

client_max_body_size    50m;

# app-board (mind maps / whiteboards) - CRUD, no cache: bodies change on edit
location /board/ {
    limit_req zone=api burst=10 nodelay;
    proxy_pass $apisix_upstream;
    proxy_set_header Host $host;
}

# ============================================================
# 双用途前缀：frontendv2 页面与 API 同路径（页面刷新/直开修复）
# 约定：API 请求（lib/api/client.ts）必带 X-Requested-With: XMLHttpRequest；
# 页面导航与 Next RSC 预取从不携带。据此精确路径分发页面（frontend），
# XHR 转发 APISIX；子路径仍走下方各 API location（最长前缀匹配）。
# ============================================================

location /apisix-xhr/ {
    internal;
    rewrite ^/apisix-xhr(/.*)$ $1 break;
    # api 区（20r/s/IP）：经此分发的裸路径 XHR（GET /notes 列表等）此前无限流
    limit_req zone=api burst=30 nodelay;
    proxy_pass $apisix_upstream;
}

# notes 公开分享 XHR 专用分发：公开读 + view_count 自增写，api 区限流防刷计数
location /sharenotes-xhr/ {
    internal;
    rewrite ^/sharenotes-xhr(/.*)$ $1 break;
    limit_req zone=api burst=20 nodelay;
    proxy_pass $apisix_upstream;
}

# cloud 公开分享 XHR 专用分发：提取码校验 + 预签名。auth 区（1r/s）严格限流
# —— 提取码是用户自选 3-8 位，此闸门防在线爆破
location /sharecloud-xhr/ {
    internal;
    rewrite ^/sharecloud-xhr(/.*)$ $1 break;
    limit_req zone=auth burst=10 nodelay;
    proxy_pass $appcloud_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /tasks {
    # CORS 预检不带 X-Requested-With，必须同样进 API 链（否则落到 Next 页面路由吃 405）
    if ($request_method = OPTIONS) { rewrite ^ /apisix-xhr$uri last; }
    if ($http_x_requested_with = "XMLHttpRequest") { rewrite ^ /apisix-xhr$uri last; }
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

location = /skills {
    # CORS 预检不带 X-Requested-With，必须同样进 API 链（否则落到 Next 页面路由吃 405）
    if ($request_method = OPTIONS) { rewrite ^ /apisix-xhr$uri last; }
    if ($http_x_requested_with = "XMLHttpRequest") { rewrite ^ /apisix-xhr$uri last; }
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

location = /billing {
    # CORS 预检不带 X-Requested-With，必须同样进 API 链（否则落到 Next 页面路由吃 405）
    if ($request_method = OPTIONS) { rewrite ^ /apisix-xhr$uri last; }
    if ($http_x_requested_with = "XMLHttpRequest") { rewrite ^ /apisix-xhr$uri last; }
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

location = /settings {
    # CORS 预检不带 X-Requested-With，必须同样进 API 链（否则落到 Next 页面路由吃 405）
    if ($request_method = OPTIONS) { rewrite ^ /apisix-xhr$uri last; }
    if ($http_x_requested_with = "XMLHttpRequest") { rewrite ^ /apisix-xhr$uri last; }
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

location = /quiz {
    # CORS 预检不带 X-Requested-With，必须同样进 API 链（否则落到 Next 页面路由吃 405）
    if ($request_method = OPTIONS) { rewrite ^ /apisix-xhr$uri last; }
    if ($http_x_requested_with = "XMLHttpRequest") { rewrite ^ /apisix-xhr$uri last; }
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

location = /favorites {
    # CORS 预检不带 X-Requested-With，必须同样进 API 链（否则落到 Next 页面路由吃 405）
    if ($request_method = OPTIONS) { rewrite ^ /apisix-xhr$uri last; }
    if ($http_x_requested_with = "XMLHttpRequest") { rewrite ^ /apisix-xhr$uri last; }
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

# /notes 特例：裸路径既是页面也是 API（GET 列表 / POST 创建），全靠 XHR 头分发。
location = /notes {
    # CORS 预检不带 X-Requested-With，必须同样进 API 链（否则落到 Next 页面路由吃 405）
    if ($request_method = OPTIONS) { rewrite ^ /apisix-xhr$uri last; }
    if ($http_x_requested_with = "XMLHttpRequest") { rewrite ^ /apisix-xhr$uri last; }
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

location = /chat {
    # CORS 预检不带 X-Requested-With，必须同样进 API 链（否则落到 Next 页面路由吃 405）
    if ($request_method = OPTIONS) { rewrite ^ /apisix-xhr$uri last; }
    if ($http_x_requested_with = "XMLHttpRequest") { rewrite ^ /apisix-xhr$uri last; }
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

# /blindspot 页面：带斜杠形态直达 frontend（Next 对裸路径 308 规范化到无斜杠，
# 故两种形态最终都落在无斜杠页面；带斜杠绝不能再转发 API，否则页面打不开）。
# 无斜杠精确路径必须显式钉住：实测存在一个非配置来源的 301（/blindspot ->
# /blindspot/，nginx 本机生成、upstream=-），若不钉住会与 Next 的 308 规范化
# （/blindspot/ -> /blindspot）互相成环。精确匹配优先级最高，直接绕过。
location = /blindspot {
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

location = /blindspot/ {
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

# ============================================================
# Backend API routes
# ============================================================

# 用量与额度（app-ts /quota/summary，APISIX forward-auth 注入 X-Uid）。
# 与 /pay 同坑：/quota 既是前端页面路由又是 API 前缀 —— 页面精确钉住
# （含无斜杠 301 行为），API 前缀单独进 APISIX。
location = /quota {
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

location = /quota/ {
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

location /quota/ {
    limit_req zone=api burst=10 nodelay;
    proxy_pass $apisix_upstream;
}

# Pay / membership (app-pay, APISIX forward-auth 注入 X-Uid)。1.0.7 消费端
# 接入时漏掉本块：/pay/* 全部落到 location / 打进前端容器（Next 404 → 前端
# 报「请求的资源不存在」），会员中心整体不可用。
location /pay {
    limit_req zone=api burst=10 nodelay;
    proxy_pass $apisix_upstream;
}

# Preferences KV + wallpaper + avatar (app-settings, APISIX forward-auth)。
# /wallpaper 与 /preferences 此前同样缺失（壁纸上传/偏好读写同病）。
# /avatar/file、/wallpaper/file 是 <img> 直读的公开对象（无 Authorization 头），
# 依赖 APISIX 侧 lenient forward-auth 放行，语义与壁纸一致。
location /preferences {
    limit_req zone=api burst=10 nodelay;
    proxy_pass $apisix_upstream;
}

location /wallpaper {
    limit_req zone=api burst=10 nodelay;
    proxy_pass $apisix_upstream;
}

location /avatar {
    proxy_pass $apisix_upstream;
}

# /task-quiz 页面（Next 页面与 API 前缀同名）：同 /blindspot，双精确钉到 frontend。
# 不钉住时 nginx 对无斜杠裸路径返回 301 加斜杠（前缀 location 以 / 结尾的规定
# 行为），跟随重定向的页面预取（?_rsc=）会落进下方 API location 打到 APISIX
# 吃 404。精确匹配优先级最高，绕开 301 与 API 分发；/task-quiz/chat 等 API
# 路径仍走下方前缀 location。
location = /task-quiz {
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

location = /task-quiz/ {
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

# Task-quiz (定时出题) - via APISIX (forward-auth injects X-Uid)
# /task-quiz/chat is SSE -> no buffering
location /task-quiz/ {
    limit_req zone=api burst=10 nodelay;
    proxy_pass $apisix_upstream;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 300s;
}

# Task list/detail/answer - via APISIX (forward-auth injects X-Uid)
location /tasks {
    limit_req zone=api burst=10 nodelay;
    proxy_pass $apisix_upstream;
    proxy_set_header Host $host;
}

# Auth (login QR, verification codes) – strict rate limit, no cache
location /auth {
    limit_req zone=auth burst=3 nodelay;
    limit_conn conn_per_ip 5;
    proxy_cache off;
    proxy_pass $apisix_upstream;
}

# Chat - SSE streaming, MUST NOT cache or buffer
location /chat {
    limit_req zone=api burst=10 nodelay;
    limit_conn conn_per_ip 20;
    proxy_cache off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_pass $apisix_upstream;
}

# Favorites - read-heavy, short cache to avoid repeated B站 API calls
location /favorites {
    limit_req zone=api burst=5 nodelay;
    proxy_buffering on;
    proxy_cache api_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 30s;
    proxy_cache_valid 404 10s;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_pass $apisix_upstream;
}

# Knowledge - read-heavy folder/video status
location /knowledge {
    proxy_buffering on;
    proxy_cache api_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 10s;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_pass $apisix_upstream;
}

# Blindspot map (Plan 1.0.6) - read aggregation via APISIX.
# NOTE: /blindspot is also a frontend page route; only /blindspot/* API
# subpaths are proxied here (exact /blindspot falls through to location /).
location /blindspot/ {
    limit_req zone=api burst=5 nodelay;
    proxy_pass $apisix_upstream;
}

# ASR - no cache (status polling)
location /asr         { proxy_pass $apisix_upstream; }
location /skills      { proxy_pass $apisix_upstream; }
location /vec         { proxy_pass $apisix_upstream; }

# Credentials / settings - strict, no cache
location /credentials {
    limit_req zone=auth burst=3 nodelay;
    proxy_cache off;
    proxy_pass $apisix_upstream;
}
location /settings {
    limit_req zone=auth burst=3 nodelay;
    proxy_cache off;
    proxy_pass $apisix_upstream;
}

# Billing - read-only, medium cache
location /billing {
    proxy_buffering on;
    proxy_cache api_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 60s;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_pass $apisix_upstream;
}

# Public shared quiz - cacheable (no auth, content is public).
# MUST come before /quiz - nginx longest-prefix match means /quiz/shared/xxx
# would otherwise hit the /quiz block (which has no cache).
location /quiz/shared/ {
    # Dual-use prefix: 页面导航渲染 Next.js 公开 quiz 阅读页（免登录），
    # 阅读页 XHR（X-Requested-With）经 /apisix-xhr 转 APISIX/app-quiz。
    # nginx 微缓存冗余 —— app-quiz 自带 Redis L2 缓存（60s TTL）。
    limit_req zone=general burst=20 nodelay;
    if ($request_method = OPTIONS) { rewrite ^ /apisix-xhr$uri last; }
    if ($http_x_requested_with = "XMLHttpRequest") { rewrite ^ /apisix-xhr$uri last; }
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

# Quiz（双用途前缀，同 /quiz/shared/ 与 /notes/shared/ 模式）：
#   - 页面导航（无 X-Requested-With）→ frontend：/quiz 列表、/quiz/<uuid>
#     动态路由详情、/quiz/shared/<token> 公开页（后两者由更长前缀块接管）。
#   - API XHR（lib/api/client.ts 统一注入 X-Requested-With）→ /apisix-xhr
#     转 APISIX/app-quiz（api 区限流在 /apisix-xhr 内）。
# 历史坑：本块曾全量 → APISIX，页面导航 /quiz/<uuid> 被网关鉴权 401
# 「未提供认证 token」——导航请求不携带 fetch 才注入的 Authorization 头。
location /quiz {
    if ($request_method = OPTIONS) { rewrite ^ /apisix-xhr$uri last; }
    if ($http_x_requested_with = "XMLHttpRequest") { rewrite ^ /apisix-xhr$uri last; }
    proxy_pass $frontend_upstream;
}

# Public shared note - dual-use prefix: the visitor's page navigation renders
# the Next.js public reader (frontendv2/app/notes/shared/[token], no auth),
# while the reader page's getShared() XHR (X-Requested-With header) proxies to
# APISIX/app-note. Previously the whole block went to APISIX unconditionally,
# so opening a share link in a browser showed app-note's raw JSON document.
# MUST come before /notes - nginx longest-prefix match means
# /notes/shared/xxx would otherwise hit the /notes block below.
location /notes/shared/ {
    # 页面导航（未被下方 rewrite 接管的请求）走 general 区：防页面刷量
    limit_req zone=general burst=20 nodelay;
    # XHR/预检改道 sharenotes-xhr（api 区限流，防 view_count 刷写）
    if ($request_method = OPTIONS) { rewrite ^ /sharenotes-xhr$uri last; }
    if ($http_x_requested_with = "XMLHttpRequest") { rewrite ^ /sharenotes-xhr$uri last; }
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

# Notes (authed endpoints) - moderate, no cache
location /notes {
    limit_req zone=api burst=10 nodelay;
    proxy_pass $apisix_upstream;
}

# Health / docs / OpenAPI - cacheable
location /health {
    proxy_buffering on;
    proxy_cache api_cache;
    proxy_cache_key "$host$request_uri";
    proxy_cache_valid 200 5s;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_pass $apisix_upstream;
}
location /docs        { proxy_pass $apisix_upstream; }
location /openapi.json {
    proxy_buffering on;
    proxy_cache api_cache;
    proxy_cache_key "$host$request_uri";
    proxy_cache_valid 200 1h;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_pass $apisix_upstream;
}

# ---- Wallpaper: custom (app-cloud -> MinIO) + presets (frontend static) ----
location /wallpaper/file/ {
    proxy_pass $apisix_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache wallpaper_cache;
    proxy_cache_key "$uri";
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 1m;
    proxy_cache_revalidate on;
    proxy_buffering on;
    add_header X-Cache-Status $upstream_cache_status;
}

location /wallpapers/ {
    proxy_pass $frontend_upstream;
    proxy_set_header Host $host;
    proxy_cache wallpaper_cache;
    proxy_cache_key "$uri";
    proxy_cache_valid 200 7d;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}

# ---- MinIO public proxy (presigned URLs from browser) ----
# 带宽防护：知道提取码的访客可脚本化批量下载（应用层无法区分人与脚本），
# 用连接数 + 单连接限速封顶单 IP 吞吐，防带宽打满拖垮整机。
location /minio-proxy/ {
    limit_conn conn_per_ip 8;
    limit_rate $minio_dl_rate;
    rewrite ^/minio-proxy/(.*) /$1 break;
    proxy_pass $minio_upstream;
    proxy_set_header Host minio:9000;
    proxy_cache off;  # upload chunks must not be cached
    proxy_buffering off;
    client_max_body_size 50m;
}

# ---- Cloud drive video streaming (internal redirect from app-cloud) ----
location /cloud-stream/ {
    internal;
    rewrite ^/cloud-stream/(.*) /$1 break;
    proxy_pass $minio_upstream;
    proxy_cache video_cache;
    proxy_cache_key "$uri";
    proxy_cache_valid 200 24h;
    proxy_cache_valid 206 24h;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_cache_revalidate on;
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 100 1m;
    proxy_max_temp_file_size 2048m;
    proxy_set_header Host minio:9000;
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-id-2;
}

# ---- Public share pages (/cloud/s/<token>) — BEFORE /cloud/ ----
# Dual-use prefix: the visitor's page navigation renders the Next.js public
# share page (frontendv2/app/cloud/s/[token], no auth), while the page's
# anonymous XHR (X-Requested-With) proxies to app-cloud. Previously the whole
# block went to app-cloud unconditionally: visitors saw raw JSON, and the
# token-less URL the old dialog generated (unconverted snake_case response)
# redirected in a loop until the auth zone limit fired 503s.
location /cloud/s/ {
    # 页面导航走 general 区防刷；XHR/预检改道 sharecloud-xhr（auth 区严限防提取码爆破）
    limit_req zone=general burst=20 nodelay;
    if ($request_method = OPTIONS) { rewrite ^ /sharecloud-xhr$uri last; }
    if ($http_x_requested_with = "XMLHttpRequest") { rewrite ^ /sharecloud-xhr$uri last; }
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

# 分享地址解析（frontend Next route handler）：general 区即可（内部 10 分钟缓存）
location = /api/share-base {
    limit_req zone=general burst=10 nodelay;
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

# ---- Internal: auth subrequest target for /cloud/ ----
# Referenced by "auth_request /_auth_verify" below; a missing definition makes
# the subrequest 404 and nginx answers 500 to every /cloud/ request. Wide
# verify semantics (same authority as the APISIX forward-auth): no creds ->
# 200 without identity headers; invalid creds -> 401; valid -> 200 + X-Uid /
# X-Roles, captured via auth_request_set and injected into the upstream call.
location = /_auth_verify {
    internal;
    proxy_pass $appauth_upstream/internal/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    # never forward client-supplied identity headers to the authority
    proxy_set_header X-Uid "";
    proxy_set_header X-Roles "";
}

# ---- Plan 0021: Cloud drive API ----
# /cloud/ bypasses APISIX (5GB uploads: avoid gateway body-limit + buffering),
# identity is sourced via auth_request against app-auth (same authority as
# the APISIX forward-auth). Upstream = app-cloud (Go drive service) since the
# cloud cutover. Client-supplied X-Uid/X-Roles are overwritten (never
# trusted); missing identity -> empty X-Uid -> service 401 on protected
# endpoints.
location /cloud/ {
    # Upload init/complete: moderate; chunked upload heartbeats: generous
    limit_req zone=api burst=30 nodelay;
    limit_conn conn_per_ip 10;
    client_max_body_size 5g;
    auth_request /_auth_verify;
    auth_request_set $auth_uid $upstream_http_x_uid;
    auth_request_set $auth_roles $upstream_http_x_roles;
    # Large file upload: bypass apisix (avoids global body-limit bump + buffering)
    proxy_pass $appcloud_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Uid $auth_uid;
    proxy_set_header X-Roles $auth_roles;
}

# ---- Plan 0023: Workspace API ----
location /workspaces {
    limit_req zone=api burst=10 nodelay;
    # Bypass cache for write methods
    set $ws_bypass 0;
    if ($request_method != GET) { set $ws_bypass 1; }
    proxy_buffering on;
    proxy_cache api_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 15s;
    proxy_cache_valid 404 10s;
    proxy_cache_bypass $ws_bypass;
    proxy_no_cache $ws_bypass;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_pass $apisix_upstream;
}

location /cache       { proxy_pass $apisix_upstream; }

# ============================================================
# Frontend
# ============================================================

# Next.js static assets (long cache)
location /_next/static {
    proxy_pass          $frontend_upstream;
    expires             1y;
    add_header          Cache-Control "public, immutable";
}

# Frontend SSR pages - cache rendered HTML
location / {
    proxy_pass          $frontend_upstream;
    proxy_set_header    Upgrade           $http_upgrade;
    proxy_set_header    Connection        "upgrade";
    proxy_buffering     on;
}
