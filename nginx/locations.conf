# ============================================================
# Shared location blocks - included by both :80 and :443 servers
# ============================================================

# Common proxy settings
proxy_http_version      1.1;
proxy_set_header        Host                $host;
proxy_set_header        X-Real-IP           $remote_addr;
proxy_set_header        X-Forwarded-For     $proxy_add_x_forwarded_for;
proxy_set_header        X-Forwarded-Proto   $scheme;
proxy_set_header        X-Forwarded-Host    $host;
proxy_set_header        X-Forwarded-Port    $server_port;

proxy_connect_timeout   75s;
proxy_read_timeout      300s;  # SSE / streaming
# proxy_buffering / proxy_cache are NOT set at server level -
# each location sets its own. Cacheable locations enable
# proxy_buffering on; streaming locations (/chat, /minio-proxy/)
# set proxy_buffering off explicitly.

client_max_body_size    50m;

# app-board (mind maps / whiteboards) - CRUD, no cache: bodies change on edit
location /board/ {
    limit_req zone=api burst=10 nodelay;
    proxy_pass $apisix_upstream;
    proxy_set_header Host $host;
}

# ============================================================
# 双用途前缀：frontendv2 页面与 API 同路径（页面刷新/直开修复）
# 约定：API 请求（lib/api/client.ts）必带 X-Requested-With: XMLHttpRequest；
# 页面导航与 Next RSC 预取从不携带。据此精确路径分发页面（frontend），
# XHR 转发 APISIX；子路径仍走下方各 API location（最长前缀匹配）。
# ============================================================

location /apisix-xhr/ {
    internal;
    rewrite ^/apisix-xhr(/.*)$ $1 break;
    proxy_pass $apisix_upstream;
}

location = /tasks {
    if ($http_x_requested_with = "XMLHttpRequest") { rewrite ^ /apisix-xhr$uri$is_args$args last; }
    proxy_pass $frontend_upstream;
    proxy_buffering on;
    proxy_cache pages_cache;
    proxy_cache_key "$host$request_uri";
    proxy_cache_valid 200 5m;
    proxy_cache_valid 404 1m;
}

location = /skills {
    if ($http_x_requested_with = "XMLHttpRequest") { rewrite ^ /apisix-xhr$uri$is_args$args last; }
    proxy_pass $frontend_upstream;
    proxy_buffering on;
    proxy_cache pages_cache;
    proxy_cache_key "$host$request_uri";
    proxy_cache_valid 200 5m;
    proxy_cache_valid 404 1m;
}

location = /billing {
    if ($http_x_requested_with = "XMLHttpRequest") { rewrite ^ /apisix-xhr$uri$is_args$args last; }
    proxy_pass $frontend_upstream;
    proxy_buffering on;
    proxy_cache pages_cache;
    proxy_cache_key "$host$request_uri";
    proxy_cache_valid 200 5m;
    proxy_cache_valid 404 1m;
}

location = /settings {
    if ($http_x_requested_with = "XMLHttpRequest") { rewrite ^ /apisix-xhr$uri$is_args$args last; }
    proxy_pass $frontend_upstream;
    proxy_buffering on;
    proxy_cache pages_cache;
    proxy_cache_key "$host$request_uri";
    proxy_cache_valid 200 5m;
    proxy_cache_valid 404 1m;
}

location = /quiz {
    if ($http_x_requested_with = "XMLHttpRequest") { rewrite ^ /apisix-xhr$uri$is_args$args last; }
    proxy_pass $frontend_upstream;
    proxy_buffering on;
    proxy_cache pages_cache;
    proxy_cache_key "$host$request_uri";
    proxy_cache_valid 200 5m;
    proxy_cache_valid 404 1m;
