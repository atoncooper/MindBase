worker_processes auto;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" ' upstream=$upstream_addr';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # ---- Gzip ----
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;
    gzip_proxied    any;
    gzip_vary       on;

    # ---- Plan 0021: Video streaming cache ----
    proxy_cache_path /var/cache/nginx/video
        levels=1:2
        keys_zone=video_cache:512m
        max_size=50g
        inactive=7d
        use_temp_path=off;

    # ---- API response cache (short TTL) ----
    proxy_cache_path /var/cache/nginx/api
        levels=1:2
        keys_zone=api_cache:64m
        max_size=1g
        inactive=10m
        use_temp_path=off;

    # ---- Frontend page cache (SSR output) ----
    proxy_cache_path /var/cache/nginx/pages
        levels=1:2
        keys_zone=pages_cache:128m
        max_size=2g
        inactive=30m
        use_temp_path=off;

    # ---- Wallpaper image cache (custom via app-cloud + presets via frontend) ----
    proxy_cache_path /var/cache/nginx/wallpaper
        levels=1:2
        keys_zone=wallpaper_cache:64m
        max_size=2g
        inactive=30d
        use_temp_path=off;

    # ---- Rate limiting Zones ----
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    # 超限返回 429 Too Many Requests（nginx 默认 503 会把限流伪装成服务故障）
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ---- Upstreams（动态解析）----
    # Docker 内嵌 DNS（127.0.0.11）+ 变量 proxy_pass：容器重建换 IP 后 nginx
    # 按需重新解析（缓存 valid 秒），不再复现"frontend 重建后长期 502"——
    # 静态 upstream 块只在启动时解析一次主机名，是旧 IP 的根源。
    # map 单 default 是"常量变量"惯用法：变量出现在 proxy_pass 里即触发
    # 运行时解析，locations.conf 只需引用变量名。
    resolver            127.0.0.11 valid=10s ipv6=off;
    resolver_timeout    5s;

    map $request_uri $apisix_upstream   { default http://apisix:9080; }
    map $request_uri $frontend_upstream { default http://frontend:3000; }
    map $request_uri $minio_upstream    { default http://minio:9000; }
    # app-auth (identity service) — auth_request subrequest target for /cloud/
    # (the only nginx->app-cloud direct route, bypassing APISIX; kept for 5GB uploads)
    # to source X-Uid.
    map $request_uri $appauth_upstream  { default http://app-auth:8006; }
    # app-cloud (drive service) — /cloud/ target since the cloud cutover
    map $request_uri $appcloud_upstream { default http://app-cloud:8007; }

    # ── CORS：反射式放行（分享域名部署链使浏览器可能跨域访问 API）──
    # 仅当请求带 http/https Origin 时回显（空值 add_header 自动省略，同源
    # 请求不受影响）。后端已返回 ACAO 时透传后端值，避免重复头被浏览器拒收。
    # 鉴权是 Bearer 头而非 Cookie，反射 Origin 不引入凭据泄露面。
    map "$upstream_http_access_control_allow_origin::$http_origin" $cors_ao {
        "~^(?<acao>.+)::(?<org>https?://.+)$"   $acao;
        "~^::(?<org>https?://.+)$"              $org;
        default                                  "";
    }

    # MinIO 代理按方法限速：PUT 是属主上传分块（不限速），GET/HEAD 是下载/
    # 预览（限速防脚本拉满带宽）。limit_rate 值为 0 表示不限。
    map $request_method $minio_dl_rate {
        PUT      0;
        default  8m;
    }

    # ============================================================
    # HTTP server (default - works without SSL certs)
    # 公网部署开箱即用。如需 HTTPS，把证书放到 nginx/certs/ 并启用下方 443 server。
    # ============================================================
    server {
        listen       80;
        server_name  _;
        server_tokens off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        # CORS（响应给跨域 XHR；同源请求无 Origin 时 $cors_ao 为空 → 头省略）
        add_header Access-Control-Allow-Origin  $cors_ao always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, If-Match, X-Api-Key, apikey, X-Fp, X-Ticket" always;
        add_header Access-Control-Expose-Headers "X-Total-Count, X-Trace-Id" always;
        add_header Vary "Origin" always;

        # Let's Encrypt ACME challenge (申请证书时用)
        location /.well-known/acme-challenge/ {
            root  /var/www/certbot;
        }

        include /etc/nginx/locations.conf;
    }

    # ============================================================
    # HTTPS server (optional - 放证书后取消注释启用)
    # 启用步骤：
    #   1. 把 fullchain.pem + privkey.pem 放到 nginx/certs/
    #   2. 删除下面 server 块每行开头的 '# '
    #   3. （可选）把上面 80 server 改成强制跳转：
    #        location / { return 301 https://$host$request_uri; }
    #      并把 include /etc/nginx/locations.conf; 移到 443 server
    # ============================================================
    server {
        listen       443 ssl;
        http2        on;
        server_name  _;
        server_tokens off;
    #
        ssl_certificate       /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key   /etc/nginx/certs/privkey.pem;
        ssl_protocols         TLSv1.2 TLSv1.3;
        ssl_ciphers           ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache     shared:SSL:10m;
        ssl_session_timeout   10m;
    #
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options    "nosniff"         always;
        add_header X-Frame-Options           "SAMEORIGIN"      always;
        add_header X-XSS-Protection          "0"               always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        # CORS（响应给跨域 XHR；同源请求无 Origin 时 $cors_ao 为空 → 头省略）
        add_header Access-Control-Allow-Origin  $cors_ao always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, If-Match, X-Api-Key, apikey, X-Fp, X-Ticket" always;
        add_header Access-Control-Expose-Headers "X-Total-Count, X-Trace-Id" always;
        add_header Vary "Origin" always;
    #
        include /etc/nginx/locations.conf;
    }
}
