worker_processes auto;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # ---- Gzip ----
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;
    gzip_proxied    any;
    gzip_vary       on;

    # ---- Plan 0021: Video streaming cache ----
    proxy_cache_path /var/cache/nginx/video
        levels=1:2
        keys_zone=video_cache:512m
        max_size=50g
        inactive=7d
        use_temp_path=off;

    # ---- API response cache (short TTL) ----
    proxy_cache_path /var/cache/nginx/api
        levels=1:2
        keys_zone=api_cache:64m
        max_size=1g
        inactive=10m
        use_temp_path=off;

    # ---- Frontend page cache (SSR output) ----
    proxy_cache_path /var/cache/nginx/pages
        levels=1:2
        keys_zone=pages_cache:128m
        max_size=2g
        inactive=30m
        use_temp_path=off;

    # ---- Wallpaper image cache (custom via backend + presets via frontend) ----
    proxy_cache_path /var/cache/nginx/wallpaper
        levels=1:2
        keys_zone=wallpaper_cache:64m
        max_size=2g
        inactive=30d
        use_temp_path=off;

    # ---- Rate limiting Zones ----
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ---- Upstreams ----
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    upstream apisix {
        server apisix:9080;
    }

    # ============================================================
    # HTTP server (default - works without SSL certs)
    # 公网部署开箱即用。如需 HTTPS，把证书放到 nginx/certs/ 并启用下方 443 server。
    # ============================================================
    server {
        listen       80;
        server_name  _;
        server_tokens off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # Let's Encrypt ACME challenge (申请证书时用)
        location /.well-known/acme-challenge/ {
            root  /var/www/certbot;
        }

        include /etc/nginx/locations.conf;
    }

    # ============================================================
    # HTTPS server (optional - 放证书后取消注释启用)
    # 启用步骤：
    #   1. 把 fullchain.pem + privkey.pem 放到 nginx/certs/
    #   2. 删除下面 server 块每行开头的 '# '
    #   3. （可选）把上面 80 server 改成强制跳转：
    #        location / { return 301 https://$host$request_uri; }
    #      并把 include /etc/nginx/locations.conf; 移到 443 server
    # ============================================================
    # server {
    #     listen       443 ssl;
    #     http2        on;
    #     server_name  _;
    #     server_tokens off;
    #
    #     ssl_certificate       /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key   /etc/nginx/certs/privkey.pem;
    #     ssl_protocols         TLSv1.2 TLSv1.3;
    #     ssl_ciphers           ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache     shared:SSL:10m;
    #     ssl_session_timeout   10m;
    #
    #     add_header Strict-Transport-Security "max-age=63072000" always;
    #     add_header X-Content-Type-Options    "nosniff"         always;
    #     add_header X-Frame-Options           "SAMEORIGIN"      always;
    #     add_header X-XSS-Protection          "0"               always;
    #     add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    #     add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    #
    #     include /etc/nginx/locations.conf;
    # }
}
