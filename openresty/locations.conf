location /quiz/shared/ {
    # Dual-use prefix: 页面导航渲染 Next.js 公开 quiz 阅读页（免登录），
    # 阅读页 XHR（X-Requested-With）经 /apisix-xhr 转 APISIX/app-content（quiz 面）。
    # nginx 微缓存冗余 —— app-content quiz 面带 Redis L2 缓存（60s TTL）。
    limit_req zone=general burst=20 nodelay;
    if ($request_method = OPTIONS) { rewrite ^ /apisix-xhr$uri last; }
    if ($http_x_requested_with = "XMLHttpRequest") { rewrite ^ /apisix-xhr$uri last; }
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

