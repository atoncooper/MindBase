    if ($http_x_requested_with = "XMLHttpRequest") { rewrite ^ /sharecloud-xhr$uri last; }
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

location /workspaces {
    limit_req zone=api burst=10 nodelay;
    # Bypass cache for write methods
    set $ws_bypass 0;
    if ($request_method != GET) { set $ws_bypass 1; }
    proxy_buffering on;
    proxy_cache api_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 15s;
    proxy_cache_valid 404 10s;
    proxy_cache_bypass $ws_bypass;
    proxy_no_cache $ws_bypass;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_pass https://apisix_backend;
}
