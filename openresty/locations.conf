# ============================================================
# OpenResty edge locations — minimal surface
# ============================================================
# API plane: exactly one namespace (/mindbase/api/v1/*) forwarded to APISIX.
# APISIX owns all per-domain routing (cloud/sandbox/pay/auth/chat/...).
# Everything else here is the page/media/ops plane (Next pages, static,
# MinIO media, share pages, health/purge). Legacy bare API locations are
# intentionally GONE — old paths fall through to the Next.js 404 page.

# ---- OpenResty: soft-purge versions / health / purge ----
set_by_lua_block $cache_ver_api    { return ngx.shared.cache_versions:get("api")    or "0" }
set_by_lua_block $cache_ver_pages  { return ngx.shared.cache_versions:get("pages")  or "0" }
set_by_lua_block $cache_ver_video  { return ngx.shared.cache_versions:get("video")  or "0" }
set_by_lua_block $cache_ver_static { return ngx.shared.cache_versions:get("static") or "0" }

location = /_edge/health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location = /_purge {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    content_by_lua_file /etc/openresty/lua/purge.lua;
}

# Common proxy settings (server-level for every location below)
proxy_http_version      1.1;
proxy_set_header        Connection          "";
proxy_set_header        Host                $host;
proxy_set_header        X-Real-IP           $remote_addr;
proxy_set_header        X-Forwarded-For     $remote_addr;
proxy_set_header        X-Forwarded-Proto   $scheme;
proxy_set_header        X-Forwarded-Host    $host;
proxy_set_header        X-Forwarded-Port    $server_port;
proxy_connect_timeout   75s;
proxy_read_timeout      300s;
client_max_body_size    50m;

# ============================================================
# Unified namespace: /mindbase/api/v1/* -> APISIX (prefix stripped)
# ============================================================
# presigned object access (browser): /mindbase/api/v1/media/<object> -> MinIO
# Write methods are validated by Lua (bearer session + size cap) BEFORE the
# bytes are proxied; GET/HEAD downloads keep the MinIO presigned signature.
location ^~ /mindbase/api/v1/media/ {
    access_by_lua_file /etc/openresty/lua/upload_guard.lua;
    limit_conn conn_per_ip 8;
    limit_rate $minio_dl_rate;
    rewrite ^/mindbase/api/v1/media/(.*)$ /$1 break;
    proxy_pass $minio_upstream;
    proxy_set_header Host minio:9000;

    # Object-byte cache: only signed GET/HEAD downloads are cacheable.
    # The cache key includes the full query string (X-Amz-Signature/expiry),
    # so a cache hit can never bypass MinIO's presigned-URL authorization.
    # TTL is deliberately short: a URL that expires before the cached copy
    # must stop being usable shortly after its expiry.
    set $media_cache_bypass 0;
    if ($request_method !~ ^(GET|HEAD)$) { set $media_cache_bypass 1; }
    if ($args !~* "x-amz-signature=") { set $media_cache_bypass 1; }

    proxy_cache media_cache;
    proxy_cache_key "$scheme$host$uri$http_range$args";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 206 5m;
    proxy_cache_min_uses 1;
    proxy_cache_lock on;
    proxy_cache_lock_age 10s;
    proxy_cache_lock_timeout 15s;
    proxy_cache_revalidate off;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_bypass $media_cache_bypass;
    proxy_no_cache $media_cache_bypass;
    add_header X-Cache-Status $upstream_cache_status;

    proxy_buffering on;
    proxy_request_buffering off;
    proxy_max_temp_file_size 2048m;
    client_max_body_size 50m;
}

# SSE: chat streaming must never be buffered/cached
location ^~ /mindbase/api/v1/chat/ {
    limit_req zone=api burst=20 nodelay;
    limit_conn conn_per_ip 20;
    proxy_cache off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    rewrite ^/mindbase/api/v1(/.*)$ $1 break;
    proxy_pass https://apisix_backend;
}

# SSE: task-quiz chat
location ^~ /mindbase/api/v1/task-quiz/ {
    limit_req zone=api burst=20 nodelay;
    proxy_cache off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    rewrite ^/mindbase/api/v1(/.*)$ $1 break;
    proxy_pass https://apisix_backend;
}

# Cloud uploads: 5GB body streaming, auth at APISIX
# Upload session metadata: edge -> app-cloud DIRECTLY (no APISIX), authenticated by
# an auth subrequest to app-user. Chunk bytes already bypass APISIX (presigned
# PUT -> edge -> MinIO), so this route keeps the whole upload path off APISIX.
location = /_upload_auth_verify {
    internal;
    proxy_pass $appauth_upstream/internal/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Uid "";
    proxy_set_header X-Roles "";
}

location ^~ /mindbase/api/v1/cloud/upload/ {
    limit_req zone=api burst=30 nodelay;
    client_max_body_size 1m;
    auth_request /_upload_auth_verify;
    auth_request_set $up_uid $upstream_http_x_uid;
    auth_request_set $up_roles $upstream_http_x_roles;
    proxy_set_header X-Uid $up_uid;
    proxy_set_header X-Roles $up_roles;
    rewrite ^/mindbase/api/v1(/.*)$ $1 break;
    proxy_pass $appcloud_upstream;
}
location ^~ /mindbase/api/v1/cloud/ {
    limit_req zone=api burst=30 nodelay;
    limit_conn conn_per_ip 10;
    client_max_body_size 5g;
    proxy_request_buffering off;
    proxy_cache off;
    rewrite ^/mindbase/api/v1(/.*)$ $1 break;
    proxy_pass https://apisix_backend;
}

# Anonymous public cloud-share data API (APISIX cloud_user requires forward-auth)
location ^~ /mindbase/api/v1/cloud/s/ {
    limit_req zone=api burst=20 nodelay;
    proxy_cache off;
    rewrite ^/mindbase/api/v1/cloud/s/(.*)$ /cloud/s/$1 break;
    proxy_pass $appcloud_upstream;
}

# 支付渠道异步回调：公网未认证入口，限制请求体（server 级 50m 会把大 body 先缓冲到边缘临时文件，
# 伪造回调可借此打磁盘/带宽）。正常 form 回调 < 10KB，1MB 余量充足。
location ^~ /mindbase/api/v1/pay/callback/ {
    client_max_body_size 1m;
    limit_req zone=api burst=30 nodelay;
    rewrite ^/mindbase/api/v1(/.*)$ $1 break;
    proxy_pass https://apisix_backend;
}

# Everything else: public GETs may be cached short; auth/write bypass; -> APISIX
# 防御：/internal/* 只能由服务网内直连 APISIX，公网 edge 一律 404。
location ^~ /mindbase/api/v1/internal/ {
    return 404;
}

location ^~ /mindbase/api/v1/ {
    limit_req zone=api burst=30 nodelay;
    set $mb_v1_bypass 0;
    if ($http_authorization != "") { set $mb_v1_bypass 1; }
    if ($request_method != GET) { set $mb_v1_bypass 1; }
    proxy_buffering on;
    proxy_cache api_cache;
    proxy_cache_key "$cache_ver_api$scheme$host$request_uri";
    proxy_cache_valid 200 10s;
    proxy_cache_bypass $mb_v1_bypass;
    proxy_no_cache $mb_v1_bypass;
    proxy_cache_lock on;
    add_header X-Cache-Status $upstream_cache_status;
    rewrite ^/mindbase/api/v1(/.*)$ $1 break;
    proxy_pass https://apisix_backend;
}

# ============================================================
# HLS playback: hls_token cookie -> Redis check -> MinIO HLS prefix
# ============================================================
# Relative playlist URIs inherit this /hls/{uid}/{uuid}/ prefix, so every
# segment request carries the same HttpOnly cookie. No app-cloud call is made
# on the playlist/segment path.
location ^~ /hls/ {
    limit_req zone=api burst=40 nodelay;
    limit_conn conn_per_ip 16;
    set $hls_cache_key "";
    access_by_lua_file /etc/openresty/lua/hls_token.lua;
    proxy_pass $minio_upstream;
    proxy_set_header Host minio:9000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_cache hls_cache;
    proxy_cache_key "$hls_cache_key";
    proxy_cache_valid 200 24h;
    proxy_cache_min_uses 1;
    proxy_cache_lock on;
    proxy_cache_lock_age 10s;
    proxy_cache_lock_timeout 15s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_buffering on;
}

# ============================================================
# Pages plane
# ============================================================
# share pages / OAuth: canonical URLs under /mindbase/... (rewrite to Next routes)
location ^~ /mindbase/s/cloud/ {
    rewrite ^/mindbase/s/cloud(/.*)$ /cloud/s$1 break;
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}
location ^~ /mindbase/s/notes/ {
    rewrite ^/mindbase/s/notes(/.*)$ /notes/shared$1 break;
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}
location ^~ /mindbase/s/quiz/ {
    rewrite ^/mindbase/s/quiz(/.*)$ /quiz/shared$1 break;
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}
location ^~ /mindbase/oauth/wechat/callback {
    rewrite ^/mindbase/oauth/wechat/callback$ /oauth/wechat/callback break;
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}
location ^~ /mindbase/ {
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

# Public page cache (anonymous evergreen pages only)
location = / {
    include /etc/openresty/public-page-cache.conf;
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}
location = /forgot-password {
    include /etc/openresty/public-page-cache.conf;
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}
location = /reset-password {
    include /etc/openresty/public-page-cache.conf;
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

# Next.js route handler used by the deployment resolver (never prefixed)
location = /api/share-base {
    limit_req zone=general burst=10 nodelay;
    proxy_pass $frontend_upstream;
    proxy_buffering on;
}

# ============================================================
# Media plane (public object access)
# ============================================================
# Avatars: backend returns /avatar/file/... directly (public image URLs)
location /avatar/ {
    proxy_pass https://apisix_backend;
    proxy_buffering on;
}

# Cloud drive video streaming (X-Accel-Redirect from app-cloud) — video cache
location /cloud-stream/ {
    internal;
    rewrite ^/cloud-stream/(.*)$ /$1 break;
    proxy_pass $minio_upstream;
    proxy_cache video_cache;
    proxy_cache_key "$cache_ver_video$uri$http_range";
    proxy_cache_valid 200 24h;
    proxy_cache_valid 206 24h;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_cache_revalidate on;
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 100 1m;
    proxy_max_temp_file_size 2048m;
    proxy_set_header Host minio:9000;
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-id-2;
}

# Legacy presigned proxy (kept one release; new presigned URLs use /mindbase/api/v1/media)
location /minio-proxy/ {
    limit_conn conn_per_ip 8;
    limit_rate $minio_dl_rate;
    rewrite ^/minio-proxy/(.*)$ /$1 break;
    proxy_pass $minio_upstream;
    proxy_set_header Host minio:9000;

    # Legacy presigned downloads use the same safe object-byte cache contract.
    set $media_cache_bypass 0;
    if ($request_method !~ ^(GET|HEAD)$) { set $media_cache_bypass 1; }
    if ($args !~* "x-amz-signature=") { set $media_cache_bypass 1; }

    proxy_cache media_cache;
    proxy_cache_key "$scheme$host$uri$http_range$args";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 206 5m;
    proxy_cache_min_uses 1;
    proxy_cache_lock on;
    proxy_cache_lock_age 10s;
    proxy_cache_lock_timeout 15s;
    proxy_cache_revalidate off;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_bypass $media_cache_bypass;
    proxy_no_cache $media_cache_bypass;
    add_header X-Cache-Status $upstream_cache_status;

    proxy_buffering on;
    proxy_request_buffering off;
    proxy_max_temp_file_size 2048m;
    client_max_body_size 50m;
}

# ============================================================
# Static assets + SPA fallback
# ============================================================
location /_next/static {
    proxy_pass $frontend_upstream;
    proxy_cache static_cache;
    proxy_cache_key "$cache_ver_static$uri";
    proxy_cache_valid 200 30d;
    proxy_cache_lock on;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Cache-Status $upstream_cache_status;
}

# All remaining paths are Next.js pages (client-rendered; never edge-cached)
location / {
    proxy_pass $frontend_upstream;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering on;
}

# ============================================================
# LEGACY COMPATIBILITY (deprecated): old bare API paths
# Old browser bundles / scripts still call /auth, /pay, /cloud, /board, ...
# These blocks route them to APISIX exactly like the pre-OpenResty nginx did.
# Remove once all clients use /mindbase/api/v1/*.
# ============================================================

# Legacy cloud API (old clients): now through APISIX forward-auth (same as the
# new /mindbase/api/v1/cloud/* namespace). Kept for backward compatibility.
location /cloud/ {
    limit_req zone=api burst=30 nodelay;
    limit_conn conn_per_ip 10;
    client_max_body_size 5g;
    proxy_request_buffering off;
    proxy_pass https://apisix_backend;
    proxy_set_header Host $host;
}
location /board/ {
    limit_req zone=api burst=10 nodelay;
    proxy_pass https://apisix_backend;
    proxy_set_header Host $host;
}

location /apisix-xhr/ {
    internal;
    rewrite ^/apisix-xhr(/.*)$ $1 break;
    # api 区（20r/s/IP）：经此分发的裸路径 XHR（GET /notes 列表等）此前无限流
    limit_req zone=api burst=30 nodelay;
    proxy_pass https://apisix_backend;
}

location /sharenotes-xhr/ {
    internal;
    rewrite ^/sharenotes-xhr(/.*)$ $1 break;
    limit_req zone=api burst=20 nodelay;
    proxy_pass https://apisix_backend;
}

location /sharecloud-xhr/ {
    internal;
    rewrite ^/sharecloud-xhr(/.*)$ $1 break;
    limit_req zone=auth burst=10 nodelay;
    proxy_pass $appcloud_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
}

