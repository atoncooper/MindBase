# Public SSR page cache (included by anonymous page locations only).
# Next marks pages "Cache-Control: no-cache"; for this public subset we ignore
# that + Set-Cookie deliberately: the HTML carries no auth state (identity is
# loaded client-side with a bearer token) and Set-Cookie must not be replayed.
# Authenticated requests and RSC prefetches bypass (see nginx.conf maps).
proxy_cache         pages_cache;
proxy_cache_key     "$cache_ver_pages$scheme$host$request_uri";
proxy_cache_valid   200 10m;
proxy_cache_valid   404 1m;
proxy_cache_bypass  $pages_bypass_auth $pages_bypass_rsc $pages_bypass_rsc_hdr;
proxy_no_cache      $pages_bypass_auth $pages_bypass_rsc $pages_bypass_rsc_hdr;
proxy_cache_lock    on;
proxy_ignore_headers Cache-Control Set-Cookie;
add_header          X-Cache-Status $upstream_cache_status;
