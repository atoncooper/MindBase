# app-pay 告警规则（P2-4/P2-11 配套）：挂到 Prometheus rule_files 并由 Alertmanager 路由。
# 数据源 = app-pay /actuator/prometheus（Micrometer），指标名在 PayMetrics / Hikari / Tomcat。
groups:
  - name: app-pay-funds
    rules:
      # 资金对账差异（ReconciliationJob）——出现即需人工
      - alert: AppPayReconMismatch
        expr: increase(pay_recon_mismatch_total[1h]) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "app-pay 对账发现差异（1h 内 {{ $value }} 笔）"

      # 回调金额不符/缺失（已 ack 停止重试，需人工退款）——独立指标（原规则错用了 rejected 指标，永不触发）
      - alert: AppPayAmountMismatch
        expr: increase(pay_callback_amount_mismatch_total[1h]) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "app-pay 回调金额不符/缺失（1h 内 {{ $value }}），需人工对账/退款"

      # 回调验签失败/未知订单（伪造或配置错，突增需排查）
      - alert: AppPayCallbackRejected
        expr: increase(pay_callback_rejected_total[1h]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "app-pay 回调验签失败（1h 内 {{ $value }}），疑似伪造或公钥配置错误"

      # 交付失败（订单停留 PAID 等待补偿）
      - alert: AppPayDeliveryFailed
        expr: increase(pay_delivery_failed_total[30m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "app-pay 交付失败（30m 内 {{ $value }}），订单停留 PAID 等待补偿"

      # 档位墙自动退款失败（订单冻结 REFUND_HOLD，需人工）
      - alert: AppPayAutoRefundFailed
        expr: increase(pay_order_auto_refund_failed_total[30m]) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "app-pay 重复购买自动退款失败（30m 内 {{ $value }}），订单冻结 REFUND_HOLD 需人工退款"

      # 交付补偿达到尝试上限（毒丸订单，需人工）
      - alert: AppPayDeliveryExhausted
        expr: increase(pay_delivery_exhausted_total[1h]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "app-pay 交付补偿达到尝试上限（1h 内 {{ $value }}），需人工处理"

      # 内部端点鉴权失败（缺/错 X-Internal-Key）：安全事件
      - alert: AppPayInternalAuthRejected
        expr: increase(pay_internal_auth_rejected_total[5m]) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "app-pay 内部端点鉴权失败（5m 内 {{ $value }}），检查网关注入/直连调用"

      # 渠道配额水位（P2-4）：query/create 速率逼近告警线
      - alert: AppPayChannelQueryRate
        expr: rate(pay_channel_query_total[5m]) > 40
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "支付宝查单 QPS 持续 >40（5m），检查退避与 notify_url"

      - alert: AppPayChannelCreateRate
        expr: rate(pay_channel_create_total[5m]) > 20
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "支付宝 precreate QPS 持续 >20（5m），疑似预下单洪水"

      # 风控拦截激增（Sybil/脚本信号）
      - alert: AppPayRiskBlockedSpike
        expr: increase(pay_risk_blocked_total[5m]) > 100
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "app-pay 风控拦截激增（5m 内 {{ $value }}，reason={{ $labels.reason }}）"

  - name: app-pay-capacity
    rules:
      # Hikari 连接池饱和（容量问题先兆）
      - alert: AppPayHikariPending
        expr: hikaricp_connections_pending > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "app-pay Hikari 有线程在等连接（pending={{ $value }}）"

      - alert: AppPayHikariTimeout
        expr: increase(hikaricp_connections_timeout_total[5m]) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "app-pay 出现获取连接超时（5m 内 {{ $value }}）—— 池太小或慢查询"

      # 渠道出网并发闸门拒绝（渠道变慢/被刷，保护线程与配额）
      - alert: AppPayChannelThrottled
        expr: increase(pay_channel_throttled_total[5m]) > 50
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "app-pay 渠道出网闸门拒绝激增（5m 内 {{ $value }}）"

      # 定时任务停滞（P0 修复后指标真实存在：pay_job_last_run{job=...} 为 epoch 秒）
      - alert: AppPayJobStalled
        expr: time() - max by (job) (pay_job_last_run) > 600
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "app-pay 兜底 job {{ $labels.job }} 超过 10 分钟未运行"
